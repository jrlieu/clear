<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>cute character · plate carousel</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

  html {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }

  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: auto;
    touch-action: none;
    -webkit-touch-callout: none;
    background: #eef4ec;
    font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif;
    transition: background 0.3s ease;
  }

  /* The fullscreen centering layer for the scene.
     It's a fixed layer so the scene stays centered on any screen size. */
  .stage-wrap {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    pointer-events: none;   /* clicks pass through to children */
    touch-action: none;
  }

  /* ---------- FLOATING TOOLBAR ----------
     Lives as a fixed element DIRECTLY under <body>, outside any transformed
     ancestor, so it never scrolls or scales with the scene. */
  .top-bar {
    position: fixed;
    top: 10px;
    left: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(107, 74, 56, 0.15);
    border-radius: 999px;
    padding: 4px 8px;
    box-shadow: 0 4px 14px rgba(50, 60, 45, 0.12);
    z-index: 2147483647;    /* maximum possible z-index */
    opacity: 0.55;
    transition: opacity 0.25s ease, box-shadow 0.25s ease;
    touch-action: manipulation;
    transform: translateZ(0);  /* force own layer */
    will-change: opacity;
  }
  .top-bar:hover {
    opacity: 1;
    box-shadow: 0 6px 20px rgba(50, 60, 45, 0.2);
  }

  .top-bar input[type="file"] { display: none; }

  .upload-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    background: #a8bfa0;
    color: #2e3d28;
    border: none;
    border-radius: 50%;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    transition: transform 0.15s ease, background 0.15s ease;
    touch-action: manipulation;
  }
  .upload-btn:hover { background: #b8cfae; transform: scale(1.1); }
  .upload-btn:active { transform: scale(0.95); }

  .color-picker-wrap input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    background: none;
    padding: 0;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
    transition: transform 0.15s ease;
    touch-action: manipulation;
  }
  .color-picker-wrap input[type="color"]:hover { transform: scale(1.1); }
  .color-picker-wrap input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .color-picker-wrap input[type="color"]::-webkit-color-swatch {
    border: none;
    border-radius: 50%;
  }
  .color-picker-wrap input[type="color"]::-moz-color-swatch {
    border: none;
    border-radius: 50%;
  }

  .clear-btn {
    background: transparent;
    color: #6b4a38;
    border: none;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.15s ease;
    touch-action: manipulation;
  }
  .clear-btn:hover { background: rgba(200, 150, 120, 0.25); transform: scale(1.1); }
  .clear-btn:active { transform: scale(0.95); }

  .zoom-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-left: 8px;
    border-left: 1px solid rgba(107, 74, 56, 0.15);
    color: #6b4a38;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
    touch-action: manipulation;
  }

  .zoom-wrap input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 90px;
    height: 4px;
    background: rgba(107, 74, 56, 0.25);
    border-radius: 999px;
    outline: none;
    cursor: pointer;
    padding: 0;
    margin: 0;
    touch-action: manipulation;
  }
  .zoom-wrap input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #a8bfa0;
    border: 2px solid #ffffff;
    box-shadow: 0 1px 3px rgba(50, 60, 45, 0.35);
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  .zoom-wrap input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
  }
  .zoom-wrap input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #a8bfa0;
    border: 2px solid #ffffff;
    box-shadow: 0 1px 3px rgba(50, 60, 45, 0.35);
    cursor: pointer;
  }
  .zoom-wrap input[type="range"]::-moz-range-track {
    height: 4px;
    background: rgba(107, 74, 56, 0.25);
    border-radius: 999px;
  }

  .zoom-value {
    min-width: 34px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: #6b4a38;
  }

  /* ---------- SCENE (this is what scales with the zoom) ---------- */
  .scene {
    position: relative;
    width: 1080px;
    height: 900px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
    transform-origin: center center;
    will-change: transform;
    touch-action: none;
    pointer-events: auto;
  }

  .group {
    position: relative;
    width: 1080px;
    height: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: visible;
    touch-action: none;
  }

  /* ---------- CHARACTER ---------- */
  .character-wrapper {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 320px;
    z-index: 1;
    filter: drop-shadow(0 10px 8px rgba(50, 60, 45, 0.18));
    pointer-events: none;
  }

  .chibi {
    position: relative;
    width: 100%;
    height: 100%;
    transform-origin: 50% 90%;
    transition: transform 0.6s cubic-bezier(0.34, 1.4, 0.5, 1);
    animation: idleBreathe 3.4s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes idleBreathe {
    0%, 100% { transform: translateY(0px)  scale(1); }
    50%      { transform: translateY(-4px)  scale(1.012); }
  }

  .chibi.curious { animation: curiousSway 2.6s ease-in-out infinite; }
  @keyframes curiousSway {
    0%   { transform: translateY(0px)   rotate(0deg); }
    25%  { transform: translateY(-5px)  rotate(-4deg); }
    50%  { transform: translateY(-8px)  rotate(0deg); }
    75%  { transform: translateY(-4px)  rotate(4deg); }
    100% { transform: translateY(0px)   rotate(0deg); }
  }

  .chibi-body {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 234px;
    height: 196px;
    background: #a8bfa0;
    border-radius: 55% 55% 48% 48% / 60% 60% 40% 40%;
    box-shadow: inset -8px -10px 0 rgba(60, 80, 55, 0.18);
    transform-origin: 50% 100%;
    transition: transform 0.6s cubic-bezier(0.34, 1.4, 0.5, 1);
  }

  .chibi-head {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 278px;
    height: 278px;
    background: #f0dcbc;
    border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
    box-shadow: inset -8px -10px 0 rgba(120, 90, 60, 0.15);
    z-index: 2;
    transform-origin: 50% 100%;
    transition: transform 0.6s cubic-bezier(0.34, 1.4, 0.5, 1);
  }

  .chibi.curious .chibi-head { animation: headThink 2.6s ease-in-out infinite; }
  @keyframes headThink {
    0%   { transform: translateX(-50%) rotate(-8deg) translateY(0px); }
    30%  { transform: translateX(-50%) rotate(-6deg) translateY(-4px); }
    55%  { transform: translateX(-50%) rotate(-9deg) translateY(0px); }
    80%  { transform: translateX(-50%) rotate(-5deg) translateY(-3px); }
    100% { transform: translateX(-50%) rotate(-8deg) translateY(0px); }
  }

  .chibi.curious .chibi-body { transform: translateX(-50%) rotate(3deg); }

  .chibi-head::before {
    content: '';
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 60px;
    background: radial-gradient(ellipse at 50% 40%, rgba(220, 190, 160, 0.55) 0%, transparent 72%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
  }

  /* ---------- 3 HAIR STRANDS ---------- */
  .hair-strand {
    position: absolute;
    z-index: 5;
    pointer-events: none;
    transform-origin: 50% 100%;
    filter: drop-shadow(0 1px 1px rgba(60, 40, 25, 0.18));
  }

  .hair-strand svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .hair-strand path {
    fill: #6b4a38;
    stroke: #6b4a38;
    stroke-width: 1;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .hair-strand.hs1 {
    top: 6px;
    left: 50%;
    margin-left: -58px;
    width: 30px;
    height: 62px;
    animation: hairWaveL 2.8s ease-in-out infinite;
    transform-origin: 60% 100%;
  }

  .hair-strand.hs2 {
    top: -6px;
    left: 50%;
    margin-left: -14px;
    width: 32px;
    height: 78px;
    animation: hairWaveM 3.2s ease-in-out infinite;
    transform-origin: 50% 100%;
  }

  .hair-strand.hs3 {
    top: 8px;
    left: 50%;
    margin-left: 26px;
    width: 30px;
    height: 58px;
    animation: hairWaveR 3s ease-in-out infinite;
    transform-origin: 40% 100%;
  }

  @keyframes hairWaveL {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(-7deg); }
  }
  @keyframes hairWaveM {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(4deg); }
  }
  @keyframes hairWaveR {
    0%, 100% { transform: rotate(2deg); }
    50%      { transform: rotate(7deg); }
  }

  .chibi-eyes {
    position: absolute;
    top: 150px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 60px;
    z-index: 4;
    transition: transform 0.4s ease;
  }
  .chibi-eye {
    width: 44px;
    height: 52px;
    background: #3a2a20;
    border-radius: 50%;
    position: relative;
    transition: height 0.4s ease, width 0.4s ease, transform 0.4s ease, background 0.4s ease;
  }
  .chibi-eye::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 8px;
    width: 18px;
    height: 22px;
    background: #fff;
    border-radius: 50%;
  }
  .chibi-eye::after {
    content: '';
    position: absolute;
    bottom: 8px;
    right: 7px;
    width: 9px;
    height: 9px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.8;
  }

  .chibi.curious .chibi-eye { width: 49px; height: 58px; }
  .chibi.curious .chibi-eyes {
    transform: translateX(-50%) translateY(-3px) translateX(-3px);
  }

  .chibi.sad { animation: sadSlouch 2s ease-in-out infinite; }
  @keyframes sadSlouch {
    0%, 100% { transform: translateY(0px)   rotate(0deg); }
    50%      { transform: translateY(5px)   rotate(0deg); }
  }
  .chibi.sad .chibi-head { transform: translateX(-50%) rotate(6deg); }
  .chibi.sad .chibi-eye { height: 17px; border-radius: 0 0 50% 50%; }
  .chibi.sad .chibi-eye::before,
  .chibi.sad .chibi-eye::after { display: none; }
  .chibi.sad .chibi-eyes { transform: translateX(-50%) translateY(5px); }
  .chibi.sad .chibi-blush { opacity: 0.2; }

  .chibi.sad .chibi-arm.left  { transform: rotate(-5deg) translate(0, 5px); }
  .chibi.sad .chibi-arm.right { transform: rotate(5deg)  translate(0, 5px); }

  .tear {
    position: absolute;
    width: 21px;
    height: 29px;
    background: linear-gradient(180deg, #a8d4f0 0%, #6aaede 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 0 5px rgba(106, 174, 222, 0.5);
  }
  .tear.left  { top: 180px; left: 66px; }
  .tear.right { top: 180px; right: 66px; }
  .chibi.sad .tear { animation: tearDrop 1.2s ease-in infinite; }
  .chibi.sad .tear.left  { animation-delay: 0s; }
  .chibi.sad .tear.right { animation-delay: 0.5s; }
  @keyframes tearDrop {
    0%   { opacity: 0; transform: translateY(0) scaleY(0.6); }
    20%  { opacity: 1; transform: translateY(3px) scaleY(1); }
    80%  { opacity: 1; transform: translateY(24px) scaleY(1.1); }
    100% { opacity: 0; transform: translateY(35px) scaleY(0.8); }
  }

  .chibi.excited { animation: excitedBounce 0.55s ease-in-out infinite; }
  @keyframes excitedBounce {
    0%, 100% { transform: translateY(0px)   scale(1); }
    50%      { transform: translateY(-11px) scale(1.03); }
  }
  .chibi.excited .chibi-eye { width: 49px; height: 58px; }
  .chibi.excited .chibi-blush { opacity: 0.95; transform: scale(1.2); }

  .chibi.excited .chibi-arm.left  { animation: excitedArmL 0.7s ease-in-out infinite; }
  .chibi.excited .chibi-arm.right { animation: excitedArmR 0.7s ease-in-out infinite; }
  @keyframes excitedArmL {
    0%, 100% { transform: rotate(-60deg) translate(-4px, -8px); }
    50%      { transform: rotate(-80deg) translate(-7px, -14px); }
  }
  @keyframes excitedArmR {
    0%, 100% { transform: rotate(60deg) translate(4px, -8px); }
    50%      { transform: rotate(80deg) translate(7px, -14px); }
  }

  .chibi.happy { animation: happyJump 0.6s ease-in-out infinite; }
  @keyframes happyJump {
    0%, 100% { transform: translateY(0px)   scale(1); }
    50%      { transform: translateY(-24px) scale(1.04); }
  }

  .chibi.happy .chibi-arm.left  { animation: happyArmL 0.6s ease-in-out infinite; }
  .chibi.happy .chibi-arm.right { animation: happyArmR 0.6s ease-in-out infinite; }
  @keyframes happyArmL {
    0%, 100% { transform: rotate(-50deg) translate(-5px, -11px); }
    50%      { transform: rotate(-75deg) translate(-8px, -16px); }
  }
  @keyframes happyArmR {
    0%, 100% { transform: rotate(50deg) translate(5px, -11px); }
    50%      { transform: rotate(75deg) translate(8px, -16px); }
  }

  /* ---------- EATING ---------- */
  .chibi.eating { animation: none; }

  .chibi.eating .chibi-mouth {
    width: 64px;
    height: 59px;
    top: 212px;
  }
  .chibi.eating .chibi-mouth svg { display: none; }
  .chibi.eating .chibi-mouth::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 35%, #8a3a3a 0%, #c97070 55%, #d98a8a 100%);
    border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
    box-shadow: inset 0 -4px 0 rgba(60, 20, 20, 0.35);
    animation: chewMouth 0.35s ease-in-out infinite;
    transform-origin: 50% 40%;
  }
  .chibi.eating .chibi-mouth::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 6px;
    transform: translateX(-50%);
    width: 29px;
    height: 19px;
    background: #6b2a2a;
    border-radius: 50% 50% 40% 40%;
    opacity: 0.85;
  }

  @keyframes chewMouth {
    0%   { transform: scaleY(1)    scaleX(1); }
    35%  { transform: scaleY(0.55) scaleX(1.05); }
    70%  { transform: scaleY(0.9)  scaleX(0.98); }
    100% { transform: scaleY(1)    scaleX(1); }
  }

  .chibi.eating .chibi-arm.left  {
    transform: rotate(-45deg) translate(3px, -5px);
  }
  .chibi.eating .chibi-arm.right {
    transform: rotate(45deg) translate(-3px, -5px);
  }

  /* ---------- MOUTH SHAPES ---------- */
  .chibi-mouth {
    position: absolute;
    top: 228px;
    left: 50%;
    transform: translateX(-50%);
    width: 35px;
    height: 17px;
    z-index: 4;
    transition: width 0.4s ease, height 0.4s ease, top 0.4s ease;
  }
  .chibi-mouth svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }
  .chibi-mouth path,
  .chibi-mouth circle {
    fill: none;
    stroke: #3a2a20;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .chibi-mouth .mouth-smile,
  .chibi-mouth .mouth-frown,
  .chibi-mouth .mouth-bigsmile,
  .chibi-mouth .mouth-o {
    display: none;
  }
  .chibi-mouth .mouth-smile { display: block; }

  .chibi.curious .chibi-mouth {
    width: 21px;
    height: 21px;
    top: 226px;
  }
  .chibi.curious .chibi-mouth .mouth-smile { display: none; }
  .chibi.curious .chibi-mouth .mouth-o { display: block; }

  .chibi.sad .chibi-mouth {
    width: 40px;
    height: 20px;
    top: 244px;
  }
  .chibi.sad .chibi-mouth .mouth-smile { display: none; }
  .chibi.sad .chibi-mouth .mouth-frown { display: block; }

  .chibi.excited .chibi-mouth,
  .chibi.happy .chibi-mouth {
    width: 48px;
    height: 27px;
    top: 225px;
  }
  .chibi.excited .chibi-mouth .mouth-smile,
  .chibi.happy .chibi-mouth .mouth-smile { display: none; }
  .chibi.excited .chibi-mouth .mouth-bigsmile,
  .chibi.happy .chibi-mouth .mouth-bigsmile { display: block; }

  .chibi-blush {
    position: absolute;
    top: 208px;
    width: 39px;
    height: 21px;
    background: #c9a68a;
    border-radius: 50%;
    opacity: 0.65;
    filter: blur(0.5px);
    z-index: 4;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .chibi-blush.left  { left: 39px; }
  .chibi-blush.right { right: 39px; }
  .chibi.curious .chibi-blush { opacity: 0.95; transform: scale(1.2); }

  .chibi-arm {
    position: absolute;
    top: 192px;
    width: 51px;
    height: 29px;
    background: #f0dcbc;
    border-radius: 20px;
    box-shadow: inset -3px -3px 0 rgba(120, 90, 60, 0.15);
    z-index: 6;
    transform-origin: 100% 50%;
    transition: transform 0.6s cubic-bezier(0.34, 1.4, 0.5, 1);
  }
  .chibi-arm.left  { left: -13px;  transform-origin: 100% 50%; transform: rotate(-20deg); }
  .chibi-arm.right { right: -13px; transform-origin: 0% 50%;   transform: rotate(20deg); }

  .chibi-foot {
    position: absolute;
    bottom: -13px;
    width: 47px;
    height: 29px;
    background: #f0dcbc;
    border-radius: 50%;
    box-shadow: inset -3px -3px 0 rgba(120, 90, 60, 0.15);
    z-index: 3;
  }
  .chibi-foot.left  { left: 64px; }
  .chibi-foot.right { right: 64px; }

  /* ---------- SPARKLES ---------- */
  .sparkle {
    position: absolute;
    color: #b8c9a8;
    font-size: 26px;
    z-index: 5;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(184, 201, 168, 0.6);
    opacity: 1;
    transform: scale(1);
    transition:
      opacity 0.6s cubic-bezier(0.45, 0, 0.25, 1),
      transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation: twinkle 2.4s ease-in-out infinite;
  }

  .sparkle.s1 { top: 8px;     left: 20px;  font-size: 24px; transition-delay: 0ms; }
  .sparkle.s2 { top: 22px;    right: 26px; font-size: 28px; transition-delay: 60ms; }
  .sparkle.s3 { bottom: 120px; right: 18px; font-size: 20px; transition-delay: 120ms; }

  .chibi.curious .sparkle {
    opacity: 0;
    transform: scale(0.2) rotate(-15deg);
  }

  @keyframes twinkle {
    0%, 100% { text-shadow: 0 0 8px rgba(184, 201, 168, 0.6); }
    50%      { text-shadow: 0 0 14px rgba(184, 201, 168, 0.95); }
  }

  /* ---------- BIG ? ---------- */
  .question-bubble {
    position: absolute;
    top: -55px;
    right: -48px;
    width: 120px;
    height: 120px;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transform: scale(0.2);
    transform-origin: 55% 75%;
    will-change: opacity, transform;
  }

  .question-bubble.show {
    opacity: 1;
    transform: scale(1);
    animation: qmPopIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes qmPopIn {
    0%   { opacity: 0; transform: scale(0.2); }
    60%  { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }

  .question-bubble svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    transform-origin: 55% 75%;
  }

  .question-bubble.show svg {
    animation: bubbleBob 2s ease-in-out infinite;
  }

  @keyframes bubbleBob {
    0%, 100% { transform: scale(1)    translateY(0px); }
    50%      { transform: scale(1.08) translateY(-8px); }
  }

  .question-mark {
    font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif;
    font-size: 110px;
    font-weight: 900;
    fill: #6b4a38;
    stroke: #ffffff;
    stroke-width: 10;
    paint-order: stroke fill;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  /* ---------- BOWL / PLATE ---------- */
  .carousel-section {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 20;
  }

  .stage {
    position: relative;
    width: 1080px;
    height: 440px;
    overflow: visible;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  .plate-stand {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .plate {
    width: 440px;
    height: 440px;
    border-radius: 50%;
    background: radial-gradient(circle at 42% 38%, #ffffff 0%, #f4f4f4 45%, #e2e2e2 100%);
    border: 10px solid #1e1e1e;
    box-shadow:
      0 0 0 5px #fff inset,
      0 22px 40px rgba(0, 0, 0, 0.15),
      inset 0 0 40px rgba(0, 0, 0, 0.08);
    position: relative;
  }

  .plate::before {
    content: '';
    position: absolute;
    inset: 28px;
    border-radius: 50%;
    border: 4px dashed #d6d6d6;
    opacity: 0.85;
  }

  .plate::after {
    content: '';
    position: absolute;
    top: 18%; left: 22%;
    width: 42%; height: 34%;
    background: radial-gradient(ellipse, #ffffffdd 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  /* ---------- CAROUSEL STRIP ---------- */
  .carousel-strip {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 80px;
    padding: 0 50px;
    cursor: default;
    white-space: nowrap;
    will-change: transform;
    z-index: 15;
    height: 150px;
    pointer-events: none;
  }

  /* ---------- EATEN ROW ---------- */
  .eaten-row {
    position: absolute;
    top: 50%;
    right: calc(50% + 260px);
    transform: translateY(-50%);
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-end;
    gap: 80px;
    height: 150px;
    padding: 0;
    pointer-events: none;
    z-index: 16;
    overflow: visible;
    white-space: nowrap;
  }

  .eaten-entry {
    flex: 0 0 auto;
    width: 150px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 12px 12px rgba(0, 0, 0, 0.2));
    opacity: 0.35;
    transform: scale(0.75);
    transform-origin: center center;
    animation: settleEntry 0.6s cubic-bezier(0.34, 1.5, 0.5, 1) forwards;
    will-change: transform, opacity;
  }

  .eaten-entry img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  @keyframes settleEntry {
    0%   { opacity: 0;    transform: translateX(260px) scale(0.4); }
    60%  { opacity: 0.45; transform: translateX(-8px)  scale(0.82); }
    100% { opacity: 0.35; transform: translateX(0)     scale(0.75); }
  }

  .food-slot {
    flex: 0 0 auto;
    width: 150px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    position: relative;
  }

  .food-item {
    width: 150px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 105px;
    line-height: 1;
    filter: drop-shadow(0 12px 12px rgba(0, 0, 0, 0.2));
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.25s ease,
                filter 0.25s ease;
    cursor: pointer;
    will-change: transform;
    -webkit-user-drag: none;
    position: relative;
    z-index: 2;
    opacity: 0.35;
    transform: scale(0.75);
    transform-origin: center center;
    pointer-events: auto;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
    border-radius: 20%;
  }

  .food-item img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .food-item.center {
    opacity: 1 !important;
    z-index: 40 !important;
    filter: drop-shadow(0 20px 20px rgba(0, 0, 0, 0.25));
    animation: plateWobble 3s linear infinite;
  }

  @keyframes plateWobble {
    0%    { transform: scale(1.8) rotate(-3deg)   translate(-2px, 0px); }
    10%   { transform: scale(1.8) rotate(-2.2deg) translate(-1.4px, -1px); }
    20%   { transform: scale(1.8) rotate(-0.5deg) translate(-0.4px, -1.4px); }
    30%   { transform: scale(1.8) rotate(1.5deg)  translate(0.8px, -0.8px); }
    40%   { transform: scale(1.8) rotate(2.8deg)  translate(1.9px, 0.3px); }
    50%   { transform: scale(1.8) rotate(3deg)    translate(2px, 1px); }
    60%   { transform: scale(1.8) rotate(2deg)    translate(1.4px, 1.3px); }
    70%   { transform: scale(1.8) rotate(0.4deg)  translate(0.4px, 1.4px); }
    80%   { transform: scale(1.8) rotate(-1.5deg) translate(-0.8px, 0.8px); }
    90%   { transform: scale(1.8) rotate(-2.7deg) translate(-1.8px, -0.3px); }
    100%  { transform: scale(1.8) rotate(-3deg)   translate(-2px, 0px); }
  }

  .food-item:not(.center):hover { opacity: 0.35; }
  .food-item:not(.center):active { opacity: 0.35; transform: scale(0.75); }
  .food-item.center:hover { opacity: 1; }

  .food-item.flying {
    animation: none !important;
    position: fixed !important;
    margin: 0 !important;
    z-index: 9999 !important;
    pointer-events: none !important;
    transform-origin: center center !important;
    will-change: left, top, transform, opacity;
    border-radius: 0 !important;
    overflow: visible !important;
  }

  .food-item.skipping {
    animation: skipOut 0.5s cubic-bezier(0.4, 0, 0.6, 1) forwards !important;
    pointer-events: none !important;
  }
  @keyframes skipOut {
    0%   { opacity: 1;   transform: scale(1.8); }
    40%  { opacity: 0.8; transform: scale(1.9); }
    100% { opacity: 0;   transform: scale(0.4); }
  }

  .crumb {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ffd966;
    pointer-events: none;
    z-index: 10000;
    animation: crumbFly 0.7s ease-out forwards;
  }
  @keyframes crumbFly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }

  .empty-hint {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #8a9a7e;
    font-size: 19px;
    font-weight: 600;
    text-align: center;
    pointer-events: none;
    opacity: 0.8;
    letter-spacing: 0.4px;
    z-index: 5;
  }
</style>
</head>
<body>

<!-- TOOLBAR — fixed, floating, unaffected by scene zoom -->
<div class="top-bar">
  <label for="photoUpload" title="Upload food photos">
    <span class="upload-btn">📷</span>
    <input type="file" id="photoUpload" accept="image/*" multiple>
  </label>

  <div class="color-picker-wrap" title="Background color">
    <input type="color" id="bgPicker" value="#eef4ec">
  </div>

  <button class="clear-btn" id="clearBtn" title="Clear all">✕</button>

  <div class="zoom-wrap" title="Zoom scene">
    <input type="range" id="zoomRange" min="50" max="200" step="1" value="100">
    <span class="zoom-value" id="zoomValue">100px</span>
  </div>
</div>

<!-- SCENE WRAP — fullscreen centering layer -->
<div class="stage-wrap">
  <div class="scene" id="scene">
    <div class="group">

      <div class="character-wrapper" id="characterWrapper">
        <div class="chibi" id="chibi">
          <div class="sparkle s1">✦</div>
          <div class="sparkle s2">✦</div>
          <div class="sparkle s3">✦</div>
          <div class="chibi-body"></div>
          <div class="chibi-foot left"></div>
          <div class="chibi-foot right"></div>
          <div class="chibi-head">
            <div class="hair-strand hs1">
              <svg viewBox="0 0 30 62" preserveAspectRatio="xMidYMax meet">
                <path d="M 15,62 C 13,45 8,30 4,14 C 3,10 2,6 4,3 C 7,1 11,4 12,8 C 13,22 15,40 15,62 Z"/>
              </svg>
            </div>
            <div class="hair-strand hs2">
              <svg viewBox="0 0 32 78" preserveAspectRatio="xMidYMax meet">
                <path d="M 16,78 C 15,58 14,36 15,18 C 16,12 16,6 18,3 C 21,1 24,5 23,10 C 22,30 20,55 16,78 Z"/>
              </svg>
            </div>
            <div class="hair-strand hs3">
              <svg viewBox="0 0 30 58" preserveAspectRatio="xMidYMax meet">
                <path d="M 15,58 C 15,40 13,24 18,10 C 19,6 21,3 24,2 C 27,3 27,8 25,12 C 21,26 18,42 15,58 Z"/>
              </svg>
            </div>

            <div class="chibi-eyes">
              <div class="chibi-eye"></div>
              <div class="chibi-eye"></div>
            </div>
            <div class="tear left"></div>
            <div class="tear right"></div>
            <div class="chibi-blush left"></div>
            <div class="chibi-blush right"></div>
            <div class="chibi-mouth">
              <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                <path class="mouth-smile"    d="M 8,20 Q 50,95 92,20" />
                <path class="mouth-bigsmile" d="M 5,15 Q 50,100 95,15" />
                <path class="mouth-frown"    d="M 5,80 Q 50,5 95,80" />
                <circle class="mouth-o" cx="50" cy="50" r="42" />
              </svg>
            </div>
          </div>
          <div class="chibi-arm left"></div>
          <div class="chibi-arm right"></div>

          <div class="question-bubble" id="questionBubble">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <text
                class="question-mark"
                x="50"
                y="54"
                text-anchor="middle"
                dominant-baseline="central">?</text>
            </svg>
          </div>
        </div>
      </div>

      <div class="carousel-section">
        <div class="stage" id="stage">
          <div class="plate-stand">
            <div class="plate" id="plate"></div>
          </div>
          <div class="carousel-strip" id="carouselStrip"></div>

          <div class="eaten-row" id="eatenRow"></div>

          <div class="empty-hint" id="emptyHint">Upload food photos 📷</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
(function() {
  const strip = document.getElementById('carouselStrip');
  const stage = document.getElementById('stage');
  const plate = document.getElementById('plate');
  const chibi = document.getElementById('chibi');
  const questionBubble = document.getElementById('questionBubble');
  const characterWrapper = document.getElementById('characterWrapper');
  const photoUpload = document.getElementById('photoUpload');
  const bgPicker = document.getElementById('bgPicker');
  const clearBtn = document.getElementById('clearBtn');
  const emptyHint = document.getElementById('emptyHint');
  const scene = document.getElementById('scene');
  const zoomRange = document.getElementById('zoomRange');
  const zoomValue = document.getElementById('zoomValue');
  const eatenRow = document.getElementById('eatenRow');

  const ITEM_PITCH = 230;
  const ITEM_VISUAL_WIDTH = 150;
  const PADDING_LEFT = 50;

  /* ---------- THE ONLY THING WE SAVE ---------- */
  const ZOOM_STORAGE_KEY = 'chibi_zoom';

  let FOODS = [];
  let EATEN = [];

  let currentIndex = 0;
  let stripOffset = 0;
  let animFrame = null;
  let isAnimating = false;

  let currentState = 'idle';
  let stateTimer = null;
  let isFeeding = false;

  // ---------- BLOCK NATIVE ZOOM GESTURES ----------
  document.addEventListener('gesturestart',  (e) => { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', (e) => { e.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend',    (e) => { e.preventDefault(); }, { passive: false });

  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 350) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  document.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  window.addEventListener('wheel', (e) => {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });

  // ---------- ZOOM ----------
  function applyZoom(px) {
    const scale = px / 100;
    scene.style.transform = `scale(${scale})`;
    zoomValue.textContent = px + 'px';
  }

  function loadZoom() {
    let saved = 100;
    try {
      const s = localStorage.getItem(ZOOM_STORAGE_KEY);
      if (s !== null) {
        const n = parseInt(s, 10);
        if (!isNaN(n)) saved = Math.max(50, Math.min(200, n));
      }
    } catch (_) {}
    zoomRange.value = saved;
    applyZoom(saved);
  }

  zoomRange.addEventListener('input', (e) => {
    const px = parseInt(e.target.value, 10);
    applyZoom(px);
    try {
      localStorage.setItem(ZOOM_STORAGE_KEY, String(px));
    } catch (_) {}
  });

  // ---------- EATEN ROW RENDER ----------
  function renderEaten() {
    eatenRow.innerHTML = '';
    EATEN.forEach(src => addEatenEntry(src, false));
  }

  function addEatenEntry(src, animateIn) {
    const entry = document.createElement('div');
    entry.className = 'eaten-entry';

    if (!animateIn) {
      entry.style.animation = 'none';
      entry.style.opacity = '0.35';
      entry.style.transform = 'scale(0.75)';
    }

    const img = document.createElement('img');
    img.src = src;
    img.alt = 'eaten';
    img.draggable = false;
    entry.appendChild(img);

    eatenRow.appendChild(entry);
  }

  // ---------- BUILD STRIP ----------
  function buildStrip() {
    strip.innerHTML = '';

    if (FOODS.length === 0) {
      emptyHint.style.display = 'block';
      return;
    }
    emptyHint.style.display = 'none';

    FOODS.forEach((src, i) => {
      const slot = document.createElement('div');
      slot.className = 'food-slot';
      slot.dataset.slotIndex = i;

      const item = document.createElement('div');
      item.className = 'food-item';
      item.dataset.slotIndex = i;

      const img = document.createElement('img');
      img.src = src;
      img.alt = 'food';
      img.draggable = false;
      item.appendChild(img);

      slot.appendChild(item);
      strip.appendChild(slot);
    });
  }

  function getSlots() {
    return Array.from(strip.querySelectorAll('.food-slot'));
  }
  function slotIndexOf(el) {
    if (!el) return -1;
    const slot = el.closest ? el.closest('.food-slot') : null;
    if (!slot) return -1;
    return parseInt(slot.dataset.slotIndex, 10);
  }

  function clearStateTimer() {
    if (stateTimer) { clearTimeout(stateTimer); stateTimer = null; }
  }

  function setCharacterState(state) {
    clearStateTimer();
    currentState = state;
    chibi.classList.remove('curious', 'excited', 'sad', 'happy', 'eating');
    questionBubble.classList.remove('show');

    if (state === 'curious') {
      chibi.classList.add('curious');
      questionBubble.classList.add('show');
    } else if (state === 'excited') {
      chibi.classList.add('excited');
    } else if (state === 'sad') {
      chibi.classList.add('sad');
    } else if (state === 'happy') {
      chibi.classList.add('happy');
    } else if (state === 'eating') {
      chibi.classList.add('eating');
    }
  }

  function getStageCenterX() { return stage.clientWidth / 2; }

  function getCenteredOffsetForIndex(idx) {
    const stageCenterX = getStageCenterX();
    const itemBoxCenter =
      PADDING_LEFT + (idx * ITEM_PITCH) + (ITEM_VISUAL_WIDTH / 2);
    return stageCenterX - itemBoxCenter;
  }

  function applyTransform() {
    strip.style.transform = `translate(${stripOffset}px, -50%)`;
  }

  function updateHighlight() {
    const slots = getSlots();
    if (slots.length === 0) return;

    const stageCenterX = getStageCenterX();
    let closest = currentIndex;
    let minDistance = Infinity;

    slots.forEach((slot, i) => {
      const slotCenter =
        stripOffset + PADDING_LEFT + (i * ITEM_PITCH) + (ITEM_VISUAL_WIDTH / 2);
      const dist = Math.abs(slotCenter - stageCenterX);

      if (dist < minDistance) {
        minDistance = dist;
        closest = i;
      }

      const isCentered = dist < ITEM_PITCH * 0.35;
      const item = slot.querySelector('.food-item');
      if (item && !item.classList.contains('flying') && !item.classList.contains('skipping')) {
        item.classList.toggle('center', isCentered);
      }
    });

    currentIndex = closest;
  }

  function animateToOffset(targetOffset, onComplete) {
    const startOff = stripOffset;
    const distance = targetOffset - startOff;
    const duration = 350;
    const startTime = performance.now();
    isAnimating = true;

    function step(now) {
      const elapsed = now - startTime;
      const t = Math.min(1, elapsed / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      stripOffset = startOff + distance * eased;
      applyTransform();
      updateHighlight();

      if (t < 1) {
        animFrame = requestAnimationFrame(step);
      } else {
        stripOffset = targetOffset;
        applyTransform();
        isAnimating = false;
        if (onComplete) onComplete();
      }
    }
    animFrame = requestAnimationFrame(step);
  }

  function snapToIndex(idx, onDone) {
    const slots = getSlots();
    if (slots.length === 0) return;
    idx = Math.max(0, Math.min(slots.length - 1, idx));
    const targetOffset = getCenteredOffsetForIndex(idx);
    animateToOffset(targetOffset, () => {
      currentIndex = idx;
      if (onDone) onDone();
    });
  }

  // ---------- SKIP CURRENT CENTERED FOOD ----------
  function skipCenteredFood() {
    const slots = getSlots();
    if (slots.length === 0) return -1;

    const stageCenterX = getStageCenterX();
    let centerIdx = -1;
    let minDist = Infinity;

    slots.forEach((slot, i) => {
      const slotCenter =
        stripOffset + PADDING_LEFT + (i * ITEM_PITCH) + (ITEM_VISUAL_WIDTH / 2);
      const dist = Math.abs(slotCenter - stageCenterX);
      if (dist < minDist) {
        minDist = dist;
        centerIdx = i;
      }
    });

    if (centerIdx < 0) return -1;
    if (minDist >= ITEM_PITCH * 0.35) return -1;

    const slot = slots[centerIdx];
    const item = slot.querySelector('.food-item');
    if (!item) return -1;

    item.classList.remove('center');
    item.classList.add('skipping');

    setTimeout(() => {
      FOODS.splice(centerIdx, 1);
      buildStrip();

      const newSlots = getSlots();
      if (newSlots.length > 0) {
        const next = Math.min(centerIdx, newSlots.length - 1);
        stripOffset = getCenteredOffsetForIndex(next);
        currentIndex = next;
      } else {
        stripOffset = 0;
        currentIndex = 0;
      }
      applyTransform();
      updateHighlight();
    }, 520);

    return centerIdx;
  }

  // ---------- FEEDING ----------
  function autoFeedFood(foodEl, src, indexInFoods) {
    if (isFeeding) return;
    isFeeding = true;

    const foodRect = foodEl.getBoundingClientRect();
    const charRect = characterWrapper.getBoundingClientRect();

    const mouthX = charRect.left + charRect.width / 2;
    const mouthY = charRect.top + charRect.height * 0.68;

    foodEl.classList.remove('center');
    foodEl.classList.add('flying');

    foodEl.style.left = foodRect.left + 'px';
    foodEl.style.top = foodRect.top + 'px';
    foodEl.style.width = foodRect.width + 'px';
    foodEl.style.height = foodRect.height + 'px';
    foodEl.style.transform = 'scale(1) rotate(0deg)';
    foodEl.style.opacity = '1';
    foodEl.style.transition = 'none';

    document.body.appendChild(foodEl);

    void foodEl.offsetWidth;

    foodEl.style.transition =
      'left 0.75s cubic-bezier(0.3, 0.0, 0.4, 1), ' +
      'top 0.75s cubic-bezier(0.3, 0.0, 0.4, 1), ' +
      'transform 0.75s cubic-bezier(0.4, 0.0, 0.6, 1), ' +
      'opacity 0.75s ease-in';

    const targetLeft = mouthX - foodRect.width / 2;
    const targetTop  = mouthY - foodRect.height / 2;

    foodEl.style.left = targetLeft + 'px';
    foodEl.style.top  = targetTop + 'px';
    foodEl.style.transform = 'scale(0.05) rotate(540deg)';
    foodEl.style.opacity = '0';

    setCharacterState('eating');
    spawnCrumbs(mouthX, mouthY);

    setTimeout(() => {
      if (foodEl.parentNode) foodEl.parentNode.removeChild(foodEl);
      if (typeof indexInFoods === 'number' && indexInFoods >= 0) {
        FOODS.splice(indexInFoods, 1);
        buildStrip();
        const slots = getSlots();
        if (slots.length > 0) {
          const next = Math.min(indexInFoods, slots.length - 1);
          stripOffset = getCenteredOffsetForIndex(next);
          currentIndex = next;
        } else {
          stripOffset = 0;
          currentIndex = 0;
        }
        applyTransform();
        updateHighlight();
      }

      if (src) {
        EATEN.push(src);
        addEatenEntry(src, true);
      }

      isFeeding = false;

      setCharacterState('idle');
      stateTimer = setTimeout(() => {
        setCharacterState('happy');
        stateTimer = setTimeout(() => setCharacterState('idle'), 1400);
      }, 180);
    }, 780);
  }

  function spawnCrumbs(cx, cy) {
    for (let i = 0; i < 10; i++) {
      const crumb = document.createElement('div');
      crumb.className = 'crumb';
      const angle = Math.random() * Math.PI * 2;
      const dist = 40 + Math.random() * 80;
      crumb.style.left = (cx - 5) + 'px';
      crumb.style.top  = (cy - 5) + 'px';
      crumb.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
      crumb.style.setProperty('--dy', (Math.sin(angle) * dist - 26) + 'px');
      crumb.style.background = ['#ffd966', '#ffb347', '#f4a460', '#e8c07a'][i % 4];
      document.body.appendChild(crumb);
      setTimeout(() => crumb.remove(), 750);
    }
  }

  strip.addEventListener('click', (e) => {
    const item = e.target.closest && e.target.closest('.food-item');
    if (!item) return;
    if (item.classList.contains('flying')) return;
    if (item.classList.contains('skipping')) return;
    e.stopPropagation();

    if (currentState === 'eating' || currentState === 'excited' || isFeeding) return;

    const idx = slotIndexOf(item);
    if (idx < 0) return;

    const isCentered = item.classList.contains('center');

    if (!isCentered) {
      skipCenteredFood();

      setTimeout(() => {
        const slots = getSlots();
        const clickedImg = item.querySelector('img');
        const clickedSrc = clickedImg ? clickedImg.src : null;
        let newIdx = -1;
        if (clickedSrc) {
          slots.forEach((s, i) => {
            const im = s.querySelector('img');
            if (im && im.src === clickedSrc) newIdx = i;
          });
        }
        if (newIdx >= 0) {
          snapToIndex(newIdx, () => {
            setCharacterState('curious');
          });
        } else {
          setCharacterState('curious');
        }
      }, 540);
    } else {
      if (currentState === 'happy') {
        clearStateTimer();
        const imgEl = item.querySelector('img');
        const src = imgEl ? imgEl.src : null;
        autoFeedFood(item, src, idx);
      } else {
        setCharacterState('happy');
        clearStateTimer();
        stateTimer = setTimeout(() => {
          setCharacterState('idle');
        }, 1800);
      }
    }
  });

  function isInsidePlate(clientX, clientY) {
    const rect = plate.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const r = rect.width / 2;
    const dx = clientX - cx;
    const dy = clientY - cy;
    return (dx * dx + dy * dy) <= r * r;
  }
  function isInsideCharacter(clientX, clientY) {
    const rect = characterWrapper.getBoundingClientRect();
    return clientX >= rect.left && clientX <= rect.right &&
           clientY >= rect.top  && clientY <= rect.bottom;
  }

  function handleOutsideClick(clientX, clientY) {
    if (currentState !== 'curious') return;
    const insidePlate = isInsidePlate(clientX, clientY);
    const insideChar  = isInsideCharacter(clientX, clientY);
    if (!insidePlate && !insideChar) {
      setCharacterState('sad');
    }
  }

  document.addEventListener('mousedown', (e) => {
    if (e.target.closest && e.target.closest('.top-bar')) return;
    const onFood = e.target.closest && e.target.closest('.food-item');
    if (onFood) return;
    handleOutsideClick(e.clientX, e.clientY);
  });

  document.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    if (!t) return;
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el && el.closest && el.closest('.top-bar')) return;
    if (el && el.closest && el.closest('.food-item')) return;
    handleOutsideClick(t.clientX, t.clientY);
  }, { passive: true });

  window.addEventListener('resize', () => {
    if (!isAnimating && FOODS.length > 0) {
      stripOffset = getCenteredOffsetForIndex(currentIndex);
      applyTransform();
      updateHighlight();
    }
  });

  // ---------- PHOTO UPLOAD (in-memory, not saved) ----------
  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  photoUpload.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;

    const results = await Promise.all(
      files
        .filter(f => f.type.startsWith('image/'))
        .map(f => fileToDataUrl(f).catch(() => null))
    );

    results.forEach(url => {
      if (typeof url === 'string') FOODS.push(url);
    });

    buildStrip();
    currentIndex = 0;
    stripOffset = getCenteredOffsetForIndex(0);
    applyTransform();
    updateHighlight();

    photoUpload.value = '';
  });

  // ---------- BACKGROUND COLOR (not saved) ----------
  bgPicker.addEventListener('input', (e) => {
    document.body.style.background = e.target.value;
  });

  clearBtn.addEventListener('click', () => {
    FOODS = [];
    EATEN = [];
    buildStrip();
    renderEaten();
    setCharacterState('idle');
    emptyHint.style.display = 'block';
    stripOffset = 0;
    applyTransform();
  });

  // ---------- INIT ----------
  loadZoom();

  buildStrip();
  stripOffset = getCenteredOffsetForIndex(0);
  applyTransform();
  updateHighlight();

  renderEaten();

})();
</script>
</body>
</html>
