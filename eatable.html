<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cute character · plate carousel</title>
<style>
  * { box-sizing: border-box; user-select: none; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #eef4ec;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif;
    overflow: hidden;
    transition: background 0.3s ease;
  }

  /* ---------- TINY TOP-LEFT CONTROL BAR ---------- */
  .top-bar {
    position: fixed;
    top: 8px;
    left: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(107, 74, 56, 0.12);
    border-radius: 999px;
    padding: 3px 6px;
    box-shadow: 0 2px 8px rgba(50, 60, 45, 0.08);
    z-index: 1000;
    opacity: 0.4;
    transition: opacity 0.25s ease, box-shadow 0.25s ease;
  }
  .top-bar:hover {
    opacity: 1;
    box-shadow: 0 4px 14px rgba(50, 60, 45, 0.15);
  }

  .top-bar input[type="file"] {
    display: none;
  }

  .upload-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    background: #a8bfa0;
    color: #2e3d28;
    border: none;
    border-radius: 50%;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .upload-btn:hover { background: #b8cfae; transform: scale(1.1); }
  .upload-btn:active { transform: scale(0.95); }

  .color-picker-wrap input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    background: none;
    padding: 0;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
    transition: transform 0.15s ease;
  }
  .color-picker-wrap input[type="color"]:hover { transform: scale(1.1); }
  .color-picker-wrap input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .color-picker-wrap input[type="color"]::-webkit-color-swatch {
    border: none;
    border-radius: 50%;
  }
  .color-picker-wrap input[type="color"]::-moz-color-swatch {
    border: none;
    border-radius: 50%;
  }

  .clear-btn {
    background: transparent;
    color: #6b4a38;
    border: none;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .clear-btn:hover { background: rgba(200, 150, 120, 0.25); transform: scale(1.1); }
  .clear-btn:active { transform: scale(0.95); }

  /* ---------- SCENE ---------- */
  .scene {
    position: relative;
    width: 900px;
    height: 620px;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 10px 0 0 0;
    overflow: visible;
  }

  /* ---------- CUTE CHIBI CHARACTER ---------- */
  .character-wrapper {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    height: 240px;
    z-index: 1;
    filter: drop-shadow(0 8px 6px rgba(50, 60, 45, 0.18));
    pointer-events: none;
  }

  .chibi {
    position: relative;
    width: 100%;
    height: 100%;
    transform-origin: 50% 90%;
    transition: transform 0.6s cubic-bezier(0.34, 1.4, 0.5, 1);
    animation: idleBreathe 3.4s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes idleBreathe {
    0%, 100% { transform: translateY(0px)  scale(1); }
    50%      { transform: translateY(-3px)  scale(1.012); }
  }

  .chibi.curious { animation: curiousSway 2.6s ease-in-out infinite; }
  @keyframes curiousSway {
    0%   { transform: translateY(0px)   rotate(0deg); }
    25%  { transform: translateY(-4px)  rotate(-4deg); }
    50%  { transform: translateY(-6px)  rotate(0deg); }
    75%  { transform: translateY(-3px)  rotate(4deg); }
    100% { transform: translateY(0px)   rotate(0deg); }
  }

  .chibi-body {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 176px;
    height: 147px;
    background: #a8bfa0;
    border-radius: 55% 55% 48% 48% / 60% 60% 40% 40%;
    box-shadow: inset -6px -8px 0 rgba(60, 80, 55, 0.18);
    transform-origin: 50% 100%;
    transition: transform 0.6s cubic-bezier(0.34, 1.4, 0.5, 1);
  }

  .chibi-head {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 208px;
    height: 189px;
    background: #f0dcbc;
    border-radius: 50% 50% 46% 46% / 55% 55% 45% 45%;
    box-shadow: inset -6px -8px 0 rgba(120, 90, 60, 0.15);
    z-index: 2;
    transform-origin: 50% 100%;
    transition: transform 0.6s cubic-bezier(0.34, 1.4, 0.5, 1);
  }

  .chibi.curious .chibi-head { animation: headThink 2.6s ease-in-out infinite; }
  @keyframes headThink {
    0%   { transform: translateX(-50%) rotate(-8deg) translateY(0px); }
    30%  { transform: translateX(-50%) rotate(-6deg) translateY(-3px); }
    55%  { transform: translateX(-50%) rotate(-9deg) translateY(0px); }
    80%  { transform: translateX(-50%) rotate(-5deg) translateY(-2px); }
    100% { transform: translateX(-50%) rotate(-8deg) translateY(0px); }
  }

  .chibi.curious .chibi-body { transform: translateX(-50%) rotate(3deg); }

  .chibi-hair {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 218px;
    height: 99px;
    background: #6b4a38;
    border-radius: 50% 50% 40% 40% / 70% 70% 30% 30%;
    box-shadow: inset 0 -4px 6px rgba(40, 25, 15, 0.25);
    z-index: 3;
  }
  .chibi-hair::before,
  .chibi-hair::after {
    content: '';
    position: absolute;
    top: 61px;
    width: 42px;
    height: 54px;
    background: #6b4a38;
    border-radius: 0 0 60% 60%;
  }
  .chibi-hair::before { left: 13px; transform: rotate(-8deg); }
  .chibi-hair::after  { right: 13px; transform: rotate(8deg); }

  .chibi-eyes {
    position: absolute;
    top: 99px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 42px;
    z-index: 4;
    transition: transform 0.4s ease;
  }
  .chibi-eye {
    width: 32px;
    height: 38px;
    background: #3a2a20;
    border-radius: 50%;
    position: relative;
    transition: height 0.4s ease, width 0.4s ease, transform 0.4s ease, background 0.4s ease;
  }
  .chibi-eye::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 6px;
    width: 13px;
    height: 16px;
    background: #fff;
    border-radius: 50%;
  }
  .chibi-eye::after {
    content: '';
    position: absolute;
    bottom: 6px;
    right: 5px;
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.8;
  }

  .chibi.curious .chibi-eye { width: 35px; height: 42px; }
  .chibi.curious .chibi-eyes {
    transform: translateX(-50%) translateY(-2px) translateX(-2px);
  }

  .chibi.sad { animation: sadSlouch 2s ease-in-out infinite; }
  @keyframes sadSlouch {
    0%, 100% { transform: translateY(0px)   rotate(0deg); }
    50%      { transform: translateY(4px)   rotate(0deg); }
  }
  .chibi.sad .chibi-head { transform: translateX(-50%) rotate(6deg); }
  .chibi.sad .chibi-eye { height: 13px; border-radius: 0 0 50% 50%; }
  .chibi.sad .chibi-eye::before,
  .chibi.sad .chibi-eye::after { display: none; }
  .chibi.sad .chibi-eyes { transform: translateX(-50%) translateY(4px); }
  .chibi.sad .chibi-blush { opacity: 0.2; }
  .chibi.sad .chibi-mouth {
    width: 29px;
    height: 16px;
    border-bottom: none;
    border-top: 4px solid #3a2a20;
    border-radius: 16px 16px 0 0;
    top: 170px;
  }
  .chibi.sad .chibi-arm.left  { transform: rotate(-5deg) translate(0, 4px); }
  .chibi.sad .chibi-arm.right { transform: rotate(5deg)  translate(0, 4px); }

  .tear {
    position: absolute;
    width: 16px;
    height: 22px;
    background: linear-gradient(180deg, #a8d4f0 0%, #6aaede 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 0 4px rgba(106, 174, 222, 0.5);
  }
  .tear.left  { top: 125px; left: 48px; }
  .tear.right { top: 125px; right: 48px; }
  .chibi.sad .tear { animation: tearDrop 1.2s ease-in infinite; }
  .chibi.sad .tear.left  { animation-delay: 0s; }
  .chibi.sad .tear.right { animation-delay: 0.5s; }
  @keyframes tearDrop {
    0%   { opacity: 0; transform: translateY(0) scaleY(0.6); }
    20%  { opacity: 1; transform: translateY(2px) scaleY(1); }
    80%  { opacity: 1; transform: translateY(18px) scaleY(1.1); }
    100% { opacity: 0; transform: translateY(26px) scaleY(0.8); }
  }

  .chibi.excited { animation: excitedBounce 0.55s ease-in-out infinite; }
  @keyframes excitedBounce {
    0%, 100% { transform: translateY(0px)   scale(1); }
    50%      { transform: translateY(-8px)  scale(1.03); }
  }
  .chibi.excited .chibi-mouth {
    width: 35px;
    height: 22px;
    border-bottom: 4px solid #3a2a20;
    border-radius: 0 0 22px 22px;
    top: 157px;
  }
  .chibi.excited .chibi-eye { width: 35px; height: 42px; }
  .chibi.excited .chibi-blush { opacity: 0.95; transform: scale(1.2); }
  .chibi.excited .chibi-arm.left  { animation: excitedArmL 0.7s ease-in-out infinite; }
  .chibi.excited .chibi-arm.right { animation: excitedArmR 0.7s ease-in-out infinite; }
  @keyframes excitedArmL {
    0%, 100% { transform: rotate(-60deg) translate(-3px, -6px); }
    50%      { transform: rotate(-80deg) translate(-5px, -10px); }
  }
  @keyframes excitedArmR {
    0%, 100% { transform: rotate(60deg) translate(3px, -6px); }
    50%      { transform: rotate(80deg) translate(5px, -10px); }
  }

  .chibi.happy { animation: happyJump 0.6s ease-in-out infinite; }
  @keyframes happyJump {
    0%, 100% { transform: translateY(0px)   scale(1); }
    50%      { transform: translateY(-18px) scale(1.04); }
  }
  .chibi.happy .chibi-mouth {
    width: 35px;
    height: 22px;
    border-bottom: 4px solid #3a2a20;
    border-radius: 0 0 22px 22px;
    top: 157px;
  }
  .chibi.happy .chibi-arm.left  { animation: happyArmL 0.6s ease-in-out infinite; }
  .chibi.happy .chibi-arm.right { animation: happyArmR 0.6s ease-in-out infinite; }
  @keyframes happyArmL {
    0%, 100% { transform: rotate(-50deg) translate(-4px, -8px); }
    50%      { transform: rotate(-75deg) translate(-6px, -12px); }
  }
  @keyframes happyArmR {
    0%, 100% { transform: rotate(50deg) translate(4px, -8px); }
    50%      { transform: rotate(75deg) translate(6px, -12px); }
  }

  /* ---------- EATING ---------- */
  .chibi.eating .chibi-mouth {
    width: 48px;
    height: 44px;
    top: 148px;
    border-bottom: none;
    border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
    background: radial-gradient(ellipse at 50% 35%, #8a3a3a 0%, #c97070 55%, #d98a8a 100%);
    box-shadow: inset 0 -3px 0 rgba(60, 20, 20, 0.35);
    overflow: hidden;
    animation: chewMouth 0.4s ease-in-out infinite;
  }
  .chibi.eating .chibi-mouth::before {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 4px;
    transform: translateX(-50%);
    width: 22px;
    height: 14px;
    background: #6b2a2a;
    border-radius: 50% 50% 40% 40%;
    opacity: 0.85;
  }
  .chibi.eating .chibi-mouth::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 6px;
    transform: translateX(-50%);
    width: 14px;
    height: 6px;
    background: #e88a8a;
    border-radius: 50%;
    opacity: 0.9;
  }
  @keyframes chewMouth {
    0%, 100% { transform: translateX(-50%) scaleY(1); }
    50%      { transform: translateX(-50%) scaleY(0.85); }
  }
  .chibi.eating .chibi-arm.left  { transform: rotate(-45deg) translate(2px, -4px); }
  .chibi.eating .chibi-arm.right { transform: rotate(45deg)  translate(-2px, -4px); }

  .chibi-blush {
    position: absolute;
    top: 147px;
    width: 29px;
    height: 16px;
    background: #c9a68a;
    border-radius: 50%;
    opacity: 0.65;
    filter: blur(0.5px);
    z-index: 4;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .chibi-blush.left  { left: 29px; }
  .chibi-blush.right { right: 29px; }
  .chibi.curious .chibi-blush { opacity: 0.95; transform: scale(1.2); }

  .chibi-mouth {
    position: absolute;
    top: 160px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 13px;
    border-bottom: 4px solid #3a2a20;
    border-radius: 0 0 16px 16px;
    z-index: 4;
    transition: all 0.4s ease;
  }
  .chibi.curious .chibi-mouth {
    width: 16px;
    height: 16px;
    border-radius: 50%;
  }

  .chibi-arm {
    position: absolute;
    top: 144px;
    width: 38px;
    height: 22px;
    background: #f0dcbc;
    border-radius: 20px;
    box-shadow: inset -2px -2px 0 rgba(120, 90, 60, 0.15);
    z-index: 6;
    transform-origin: 100% 50%;
    transition: transform 0.6s cubic-bezier(0.34, 1.4, 0.5, 1);
  }
  .chibi-arm.left  { left: -10px;  transform-origin: 100% 50%; transform: rotate(-20deg); }
  .chibi-arm.right { right: -10px; transform-origin: 0% 50%;   transform: rotate(20deg); }

  .chibi-foot {
    position: absolute;
    bottom: -10px;
    width: 35px;
    height: 22px;
    background: #f0dcbc;
    border-radius: 50%;
    box-shadow: inset -2px -2px 0 rgba(120, 90, 60, 0.15);
    z-index: 3;
  }
  .chibi-foot.left  { left: 48px; }
  .chibi-foot.right { right: 48px; }

  .sparkle {
    position: absolute;
    color: #b8c9a8;
    font-size: 20px;
    z-index: 6;
    animation: twinkle 2s ease-in-out infinite;
    text-shadow: 0 0 6px rgba(184, 201, 168, 0.6);
  }
  .sparkle.s1 { top: 4px; left: -6px; animation-delay: 0s; }
  .sparkle.s2 { top: 14px; right: -10px; animation-delay: 0.6s; }
  .sparkle.s3 { bottom: 40px; left: -14px; animation-delay: 1.2s; font-size: 16px; }

  @keyframes twinkle {
    0%, 100% { opacity: 0.4; transform: scale(0.85); }
    50%      { opacity: 1;   transform: scale(1.1); }
  }

  .question-bubble {
    position: absolute;
    top: -22px;
    right: -30px;
    width: 60px;
    height: 60px;
    background: #ffffff;
    border: 4px solid #6b4a38;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 800;
    color: #6b4a38;
    z-index: 10;
    opacity: 0;
    transform: scale(0.4) translateY(8px);
    transition: opacity 0.35s ease, transform 0.5s cubic-bezier(0.34, 1.6, 0.6, 1);
    pointer-events: none;
    box-shadow: 0 4px 10px rgba(50, 40, 30, 0.18);
  }
  .question-bubble::after {
    content: '';
    position: absolute;
    bottom: -13px;
    left: 10px;
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 15px solid #6b4a38;
    transform: rotate(18deg);
  }
  .question-bubble.show {
    opacity: 1;
    transform: scale(1) translateY(0);
    animation: bubbleBob 1.8s ease-in-out infinite;
  }
  @keyframes bubbleBob {
    0%, 100% { transform: scale(1)    translateY(0px); }
    50%      { transform: scale(1.08) translateY(-6px); }
  }

  /* ---------- STAGE & PLATE ---------- */
  .carousel-section {
    margin-top: 150px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 20;
  }

  .stage {
    position: relative;
    width: 880px;
    height: 400px;
    overflow: visible;
    -webkit-tap-highlight-color: transparent;
  }

  .plate-stand {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .plate {
    width: 340px;
    height: 340px;
    border-radius: 50%;
    background: radial-gradient(circle at 42% 38%, #ffffff 0%, #f4f4f4 45%, #e2e2e2 100%);
    border: 8px solid #1e1e1e;
    box-shadow:
      0 0 0 4px #fff inset,
      0 16px 30px rgba(0, 0, 0, 0.15),
      inset 0 0 30px rgba(0, 0, 0, 0.08);
    position: relative;
  }

  .plate::before {
    content: '';
    position: absolute;
    inset: 22px;
    border-radius: 50%;
    border: 3px dashed #d6d6d6;
    opacity: 0.85;
  }

  .plate::after {
    content: '';
    position: absolute;
    top: 18%; left: 22%;
    width: 42%; height: 34%;
    background: radial-gradient(ellipse, #ffffffdd 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  /* ---------- CAROUSEL STRIP ---------- */
  .carousel-strip {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 60px;
    padding: 0 40px;
    cursor: default;
    white-space: nowrap;
    will-change: transform;
    z-index: 15;
    height: 120px;
    pointer-events: none;
  }

  .food-slot {
    flex: 0 0 auto;
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    position: relative;
  }

  .food-item {
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 85px;
    line-height: 1;
    filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.2));
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.25s ease,
                filter 0.25s ease;
    cursor: pointer;
    will-change: transform;
    -webkit-user-drag: none;
    position: relative;
    z-index: 2;
    opacity: 0.35;
    transform: scale(0.75);
    transform-origin: center center;
    pointer-events: auto;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
    border-radius: 20%;
  }

  .food-item img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .food-item.center {
    opacity: 1 !important;
    z-index: 40 !important;
    filter: drop-shadow(0 16px 16px rgba(0, 0, 0, 0.25));
    animation: plateWobble 3s linear infinite;
  }

  @keyframes plateWobble {
    0%    { transform: scale(1.8) rotate(-3deg)   translate(-2px, 0px); }
    10%   { transform: scale(1.8) rotate(-2.2deg) translate(-1.4px, -1px); }
    20%   { transform: scale(1.8) rotate(-0.5deg) translate(-0.4px, -1.4px); }
    30%   { transform: scale(1.8) rotate(1.5deg)  translate(0.8px, -0.8px); }
    40%   { transform: scale(1.8) rotate(2.8deg)  translate(1.9px, 0.3px); }
    50%   { transform: scale(1.8) rotate(3deg)    translate(2px, 1px); }
    60%   { transform: scale(1.8) rotate(2deg)    translate(1.4px, 1.3px); }
    70%   { transform: scale(1.8) rotate(0.4deg)  translate(0.4px, 1.4px); }
    80%   { transform: scale(1.8) rotate(-1.5deg) translate(-0.8px, 0.8px); }
    90%   { transform: scale(1.8) rotate(-2.7deg) translate(-1.8px, -0.3px); }
    100%  { transform: scale(1.8) rotate(-3deg)   translate(-2px, 0px); }
  }

  .food-item:not(.center):hover { opacity: 0.6; }
  .food-item.center:hover { opacity: 1; }

  .food-item:active:not(.center) {
    opacity: 0.8;
    transform: scale(0.9);
  }

  /* Food flying into the mouth */
  .food-item.flying {
    animation: none !important;
    position: fixed !important;
    margin: 0 !important;
    z-index: 9999 !important;
    pointer-events: none !important;
    transform-origin: center center !important;
    will-change: left, top, transform, opacity;
    border-radius: 0 !important;
    overflow: visible !important;
  }

  .crumb {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ffd966;
    pointer-events: none;
    z-index: 10000;
    animation: crumbFly 0.7s ease-out forwards;
  }
  @keyframes crumbFly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }

  /* ---------- EMPTY STATE ---------- */
  .empty-hint {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #8a9a7e;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    pointer-events: none;
    opacity: 0.8;
    letter-spacing: 0.4px;
    z-index: 5;
  }
</style>
</head>
<body>

<!-- ============ TINY TOP-LEFT CONTROLS ============ -->
<div class="top-bar">
  <label for="photoUpload" title="Upload food photos">
    <span class="upload-btn">📷</span>
    <input type="file" id="photoUpload" accept="image/*" multiple>
  </label>

  <div class="color-picker-wrap" title="Background color">
    <input type="color" id="bgPicker" value="#eef4ec">
  </div>

  <button class="clear-btn" id="clearBtn" title="Clear all">✕</button>
</div>

<div class="scene">

  <div class="character-wrapper" id="characterWrapper">
    <div class="chibi" id="chibi">
      <div class="sparkle s1">✦</div>
      <div class="sparkle s2">✦</div>
      <div class="sparkle s3">✦</div>
      <div class="chibi-body"></div>
      <div class="chibi-foot left"></div>
      <div class="chibi-foot right"></div>
      <div class="chibi-head">
        <div class="chibi-hair"></div>
        <div class="chibi-eyes">
          <div class="chibi-eye"></div>
          <div class="chibi-eye"></div>
        </div>
        <div class="tear left"></div>
        <div class="tear right"></div>
        <div class="chibi-blush left"></div>
        <div class="chibi-blush right"></div>
        <div class="chibi-mouth"></div>
      </div>
      <div class="chibi-arm left"></div>
      <div class="chibi-arm right"></div>
      <div class="question-bubble" id="questionBubble">?</div>
    </div>
  </div>

  <div class="carousel-section">
    <div class="stage" id="stage">
      <div class="plate-stand">
        <div class="plate" id="plate"></div>
      </div>
      <div class="carousel-strip" id="carouselStrip"></div>
      <div class="empty-hint" id="emptyHint">Upload food photos 📷</div>
    </div>
  </div>
</div>

<script>
(function() {
  const strip = document.getElementById('carouselStrip');
  const stage = document.getElementById('stage');
  const plate = document.getElementById('plate');
  const chibi = document.getElementById('chibi');
  const questionBubble = document.getElementById('questionBubble');
  const characterWrapper = document.getElementById('characterWrapper');
  const photoUpload = document.getElementById('photoUpload');
  const bgPicker = document.getElementById('bgPicker');
  const clearBtn = document.getElementById('clearBtn');
  const emptyHint = document.getElementById('emptyHint');

  const ITEM_PITCH = 180;
  const ITEM_VISUAL_WIDTH = 120;
  const PADDING_LEFT = 40;

  let FOODS = [];

  let currentIndex = 0;
  let stripOffset = 0;
  let animFrame = null;
  let isAnimating = false;

  let currentState = 'idle';
  let stateTimer = null;
  let isFeeding = false;

  function buildStrip() {
    strip.innerHTML = '';

    if (FOODS.length === 0) {
      emptyHint.style.display = 'block';
      return;
    }
    emptyHint.style.display = 'none';

    FOODS.forEach((src, i) => {
      const slot = document.createElement('div');
      slot.className = 'food-slot';
      slot.dataset.slotIndex = i;

      const item = document.createElement('div');
      item.className = 'food-item';
      item.dataset.slotIndex = i;

      const img = document.createElement('img');
      img.src = src;
      img.alt = 'food';
      img.draggable = false;
      item.appendChild(img);

      slot.appendChild(item);
      strip.appendChild(slot);
    });
  }

  function getSlots() {
    return Array.from(strip.querySelectorAll('.food-slot'));
  }
  function slotIndexOf(el) {
    if (!el) return -1;
    const slot = el.closest ? el.closest('.food-slot') : null;
    if (!slot) return -1;
    return parseInt(slot.dataset.slotIndex, 10);
  }

  function clearStateTimer() {
    if (stateTimer) { clearTimeout(stateTimer); stateTimer = null; }
  }

  function setCharacterState(state) {
    clearStateTimer();
    currentState = state;
    chibi.classList.remove('curious', 'excited', 'sad', 'happy', 'eating');
    questionBubble.classList.remove('show');

    if (state === 'curious') {
      chibi.classList.add('curious');
      questionBubble.classList.add('show');
    } else if (state === 'excited') {
      chibi.classList.add('excited');
    } else if (state === 'sad') {
      chibi.classList.add('sad');
    } else if (state === 'happy') {
      chibi.classList.add('happy');
    } else if (state === 'eating') {
      chibi.classList.add('eating');
    }
  }

  function getStageCenterX() { return stage.clientWidth / 2; }

  function getCenteredOffsetForIndex(idx) {
    const stageCenterX = getStageCenterX();
    const itemBoxCenter =
      PADDING_LEFT + (idx * ITEM_PITCH) + (ITEM_VISUAL_WIDTH / 2);
    return stageCenterX - itemBoxCenter;
  }

  function applyTransform() {
    strip.style.transform = `translate(${stripOffset}px, -50%)`;
  }

  function updateHighlight() {
    const slots = getSlots();
    if (slots.length === 0) return;

    const stageCenterX = getStageCenterX();
    let closest = currentIndex;
    let minDistance = Infinity;

    slots.forEach((slot, i) => {
      const slotCenter =
        stripOffset + PADDING_LEFT + (i * ITEM_PITCH) + (ITEM_VISUAL_WIDTH / 2);
      const dist = Math.abs(slotCenter - stageCenterX);

      if (dist < minDistance) {
        minDistance = dist;
        closest = i;
      }

      const isCentered = dist < ITEM_PITCH * 0.35;
      const item = slot.querySelector('.food-item');
      if (item && !item.classList.contains('flying')) {
        item.classList.toggle('center', isCentered);
      }
    });

    currentIndex = closest;
  }

  function animateToOffset(targetOffset, onComplete) {
    const startOff = stripOffset;
    const distance = targetOffset - startOff;
    const duration = 350;
    const startTime = performance.now();
    isAnimating = true;

    function step(now) {
      const elapsed = now - startTime;
      const t = Math.min(1, elapsed / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      stripOffset = startOff + distance * eased;
      applyTransform();
      updateHighlight();

      if (t < 1) {
        animFrame = requestAnimationFrame(step);
      } else {
        stripOffset = targetOffset;
        applyTransform();
        isAnimating = false;
        if (onComplete) onComplete();
      }
    }
    animFrame = requestAnimationFrame(step);
  }

  function snapToIndex(idx, onDone) {
    const slots = getSlots();
    if (slots.length === 0) return;
    idx = Math.max(0, Math.min(slots.length - 1, idx));
    const targetOffset = getCenteredOffsetForIndex(idx);
    animateToOffset(targetOffset, () => {
      currentIndex = idx;
      if (onDone) onDone();
    });
  }

  function autoFeedFood(foodEl) {
    if (isFeeding) return;
    isFeeding = true;

    const foodRect = foodEl.getBoundingClientRect();
    const charRect = characterWrapper.getBoundingClientRect();

    const mouthX = charRect.left + charRect.width / 2;
    const mouthY = charRect.top + charRect.height * 0.62;

    foodEl.classList.remove('center');
    foodEl.classList.add('flying');

    foodEl.style.left = foodRect.left + 'px';
    foodEl.style.top = foodRect.top + 'px';
    foodEl.style.width = foodRect.width + 'px';
    foodEl.style.height = foodRect.height + 'px';
    foodEl.style.transform = 'scale(1) rotate(0deg)';
    foodEl.style.opacity = '1';
    foodEl.style.transition = 'none';

    document.body.appendChild(foodEl);

    void foodEl.offsetWidth;

    foodEl.style.transition =
      'left 0.75s cubic-bezier(0.3, 0.0, 0.4, 1), ' +
      'top 0.75s cubic-bezier(0.3, 0.0, 0.4, 1), ' +
      'transform 0.75s cubic-bezier(0.4, 0.0, 0.6, 1), ' +
      'opacity 0.75s ease-in';

    const targetLeft = mouthX - foodRect.width / 2;
    const targetTop  = mouthY - foodRect.height / 2;

    foodEl.style.left = targetLeft + 'px';
    foodEl.style.top  = targetTop + 'px';
    foodEl.style.transform = 'scale(0.05) rotate(540deg)';
    foodEl.style.opacity = '0';

    setCharacterState('eating');
    spawnCrumbs(mouthX, mouthY);

    setTimeout(() => {
      if (foodEl.parentNode) foodEl.parentNode.removeChild(foodEl);
      isFeeding = false;
      updateHighlight();

      setCharacterState('happy');
      stateTimer = setTimeout(() => setCharacterState('idle'), 1600);
    }, 780);
  }

  function spawnCrumbs(cx, cy) {
    for (let i = 0; i < 10; i++) {
      const crumb = document.createElement('div');
      crumb.className = 'crumb';
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 60;
      crumb.style.left = (cx - 4) + 'px';
      crumb.style.top  = (cy - 4) + 'px';
      crumb.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
      crumb.style.setProperty('--dy', (Math.sin(angle) * dist - 20) + 'px');
      crumb.style.background = ['#ffd966', '#ffb347', '#f4a460', '#e8c07a'][i % 4];
      document.body.appendChild(crumb);
      setTimeout(() => crumb.remove(), 750);
    }
  }

  strip.addEventListener('click', (e) => {
    const item = e.target.closest && e.target.closest('.food-item');
    if (!item) return;
    if (item.classList.contains('flying')) return;
    e.stopPropagation();

    if (currentState === 'eating' || currentState === 'excited' || isFeeding) return;

    const idx = slotIndexOf(item);
    if (idx < 0) return;

    const isCentered = item.classList.contains('center');

    if (!isCentered) {
      snapToIndex(idx, () => {
        setCharacterState('curious');
      });
    } else {
      if (currentState === 'happy') {
        clearStateTimer();
        autoFeedFood(item);
      } else {
        setCharacterState('happy');
        clearStateTimer();
        stateTimer = setTimeout(() => {
          setCharacterState('idle');
        }, 1800);
      }
    }
  });

  function isInsidePlate(clientX, clientY) {
    const rect = plate.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const r = rect.width / 2;
    const dx = clientX - cx;
    const dy = clientY - cy;
    return (dx * dx + dy * dy) <= r * r;
  }
  function isInsideCharacter(clientX, clientY) {
    const rect = characterWrapper.getBoundingClientRect();
    return clientX >= rect.left && clientX <= rect.right &&
           clientY >= rect.top  && clientY <= rect.bottom;
  }

  function handleOutsideClick(clientX, clientY) {
    if (currentState !== 'curious') return;
    const insidePlate = isInsidePlate(clientX, clientY);
    const insideChar  = isInsideCharacter(clientX, clientY);
    if (!insidePlate && !insideChar) {
      setCharacterState('sad');
    }
  }

  document.addEventListener('mousedown', (e) => {
    if (e.target.closest && e.target.closest('.top-bar')) return;
    const onFood = e.target.closest && e.target.closest('.food-item');
    if (onFood) return;
    handleOutsideClick(e.clientX, e.clientY);
  });

  document.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    if (!t) return;
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el && el.closest && el.closest('.top-bar')) return;
    if (el && el.closest && el.closest('.food-item')) return;
    handleOutsideClick(t.clientX, t.clientY);
  }, { passive: true });

  window.addEventListener('resize', () => {
    if (!isAnimating && FOODS.length > 0) {
      stripOffset = getCenteredOffsetForIndex(currentIndex);
      applyTransform();
      updateHighlight();
    }
  });

  photoUpload.addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;

    files.forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const url = URL.createObjectURL(file);
      FOODS.push(url);
    });

    buildStrip();
    currentIndex = 0;
    stripOffset = getCenteredOffsetForIndex(0);
    applyTransform();
    updateHighlight();

    photoUpload.value = '';
  });

  bgPicker.addEventListener('input', (e) => {
    document.body.style.background = e.target.value;
  });

  clearBtn.addEventListener('click', () => {
    FOODS.forEach(url => { try { URL.revokeObjectURL(url); } catch(_) {} });
    FOODS = [];
    buildStrip();
    setCharacterState('idle');
    emptyHint.style.display = 'block';
    stripOffset = 0;
    applyTransform();
  });

  buildStrip();
  stripOffset = getCenteredOffsetForIndex(0);
  applyTransform();
  updateHighlight();

})();
</script>
</body>
</html>
