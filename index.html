    // ============================================================
    // POINTER DOWN — PHOTO
    // ============================================================
    function onPhotoPointerDown(e) {
      if (isBusy) return;
      const item = e.currentTarget;
      if (isDragging) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      const uidVal = item.dataset.uid;
      dragItemData = photoItems.find(t => t.uid === uidVal);
      dragItemKind = 'photo';
      if (!dragItemData) return;
      const rect = item.getBoundingClientRect();
      dragOffsetX = e.clientX - rect.left;
      dragOffsetY = e.clientY - rect.top;
      if (dragItemData.attached) {
        dragItemData.attached = false;
        item.classList.remove('photo-attached');
        playAreaEl.appendChild(item);
        item.style.position = '';
        item.style.top = '';
        item.style.left = '';
        item.style.transform = '';
        item.style.zIndex = '';
      }
      item.classList.add('dragging');
      item.style.position = 'fixed';
      item.style.left = rect.left + 'px';
      item.style.top = rect.top + 'px';
      item.style.width = rect.width + 'px';
      item.style.height = rect.height + 'px';
      item.style.margin = '0';
      item.style.zIndex = '2147483646';
      item.style.transition = 'none';
      item.style.pointerEvents = 'none';
      document.body.appendChild(item);
      headDropIndicatorEl.classList.add('active');
      isDragging = true;
      dragEl = item;
      pointerId = e.pointerId;
      item.setPointerCapture(e.pointerId);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
    }

    // ============================================================
    // POINTER MOVE
    // ============================================================
    function onPointerMove(e) {
      if (!isDragging || !dragEl || e.pointerId !== pointerId) return;
      e.preventDefault();
      const x = e.clientX - dragOffsetX;
      const y = e.clientY - dragOffsetY;
      dragEl.style.left = x + 'px';
      dragEl.style.top = y + 'px';

      if (dragItemKind === 'food' && chopstickBackEl.classList.contains('active')) {
        updateChopsticksPosition(dragEl.getBoundingClientRect());
      }

      if (dragItemKind === 'food' || dragItemKind === 'drink') {
        updateEyeTracking(e.clientX, e.clientY);
      }

      const dragRect = dragEl.getBoundingClientRect();
      const mouthRect = mouthEl.getBoundingClientRect();
      const isOverMouth = rectsOverlap(dragRect, mouthRect);

      if (dragItemKind === 'photo') {
        const overHead = isPointInHeadZone(e.clientX, e.clientY);
        headDropIndicatorEl.classList.toggle('hovering', overHead);
        headDropIndicatorEl.classList.add('active');
        mouthEl.classList.remove('hint');
        mouthEl.classList.remove('mouth-wow');
        mouthEl.classList.remove('mouth-sip-bubble');
        characterEl.classList.remove('sipping');
        stopFizz();
        return;
      }
      if (isOverMouth && dragItemKind === 'drink') {
        if (!mouthEl.classList.contains('mouth-wow')) {
          mouthEl.classList.add('mouth-wow');
          mouthEl.classList.add('mouth-sip-bubble');
          characterEl.classList.add('sipping');
        }
        mouthEl.classList.remove('hint');
        startFizz(mouthRect);
      } else if (isOverMouth && dragItemKind === 'food') {
        mouthEl.classList.remove('mouth-wow');
        mouthEl.classList.remove('mouth-sip-bubble');
        characterEl.classList.remove('sipping');
        mouthEl.classList.add('hint');
        stopFizz();
      } else {
        mouthEl.classList.remove('hint');
        if (dragItemKind === 'drink') {
          mouthEl.classList.remove('mouth-wow');
          mouthEl.classList.remove('mouth-sip-bubble');
          characterEl.classList.remove('sipping');
        }
        stopFizz();
      }
    }

    // ============================================================
    // FIZZ
    // ============================================================
    function startFizz(mouthRect) {
      if (fizzInterval) return;
      const cx = mouthRect.left + mouthRect.width / 2;
      const cy = mouthRect.top + mouthRect.height / 2;
      spawnFizz(cx, cy);
      fizzInterval = setInterval(() => {
        const r = mouthEl.getBoundingClientRect();
        spawnFizz(r.left + r.width / 2, r.top + r.height / 2);
      }, 140);
    }

    function stopFizz() {
      if (fizzInterval) {
        clearInterval(fizzInterval);
        fizzInterval = null;
      }
    }

    function spawnFizz(x, y) {
      const bubbles = ['🫧', '💧', '·', '°', '✦'];
      const b = document.createElement('div');
      b.className = 'fizz';
      b.textContent = bubbles[Math.floor(Math.random() * bubbles.length)];
      b.style.left = (x + (Math.random() - 0.5) * 26) + 'px';
      b.style.top = y + 'px';
      b.style.color = ['#8ac0e6', '#c1e5ff', '#5a9ec9', '#a8e6ff'][Math.floor(Math.random() * 4)];
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 950);
    }

    // ============================================================
    // POINTER UP
    // ============================================================
    function onPointerUp(e) {
      if (!isDragging || !dragEl || e.pointerId !== pointerId) return;
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);
      const item = dragEl;
      const kind = dragItemKind;
      dragEl = null;
      dragItemKind = null;
      isDragging = false;
      pointerId = null;
      mouthEl.classList.remove('mouth-open');
      mouthEl.classList.remove('hint');
      headDropIndicatorEl.classList.remove('active', 'hovering');

      resetEyeTracking();

      const dragRect = item.getBoundingClientRect();
      const mouthRect = mouthEl.getBoundingClientRect();
      const isOverMouth = rectsOverlap(dragRect, mouthRect);

      if (kind === 'photo') {
        const dropX = dragRect.left + dragRect.width / 2;
        const dropY = dragRect.top + dragRect.height / 2;
        const overHead = isPointInHeadZone(dropX, dropY);
        returnPhotoToSpot(item, overHead);
        return;
      }
      if (kind === 'drink') {
        stopFizz();
        if (isOverMouth) {
          beginSip(item, mouthRect);
        } else {
          mouthEl.classList.remove('mouth-wow');
          mouthEl.classList.remove('mouth-sip-bubble');
          characterEl.classList.remove('sipping');
          returnDrinkToSpot(item);
        }
        return;
      }

      // FOOD
      if (isOverMouth) {
        eatFood(item, mouthRect);
      } else {
        if (chopstickBackEl.classList.contains('active')) {
          hideChopsticks();
        }
        returnFoodToTray(item);
      }
    }

    function returnFoodToTray(item) {
      item.classList.remove('dragging');
      const trayRect = trayEl.getBoundingClientRect();
      const itemRect = item.getBoundingClientRect();
      const itemCenterX = itemRect.left + itemRect.width / 2;
      const itemCenterY = itemRect.top + itemRect.height / 2;
      const insideTray = (
        itemCenterX >= trayRect.left && itemCenterX <= trayRect.right &&
        itemCenterY >= trayRect.top && itemCenterY <= trayRect.bottom
      );
      if (insideTray) {
        let newX = itemRect.left - trayRect.left;
        let newY = itemRect.top - trayRect.top;
        const maxX = Math.max(0, layout.trayW - itemRect.width);
        const maxY = Math.max(0, layout.trayH - itemRect.height);
        newX = Math.max(0, Math.min(maxX, newX));
        newY = Math.max(0, Math.min(maxY, newY));
        dragItemData.x = newX;
        dragItemData.y = newY;
      }
      item.style.position = 'absolute';
      item.style.left = dragItemData.x + 'px';
      item.style.top = dragItemData.y + 'px';
      item.style.width = '';
      item.style.height = '';
      item.style.margin = '';
      item.style.transform = '';
      item.style.transition = '';
      item.style.zIndex = '';
      item.style.opacity = '';
      item.style.pointerEvents = '';
      trayEl.appendChild(item);
    }

    function returnDrinkToSpot(item) {
      item.classList.remove('dragging');
      const playRect = playAreaEl.getBoundingClientRect();
      const itemRect = item.getBoundingClientRect();
      let newX = itemRect.left - playRect.left;
      let newY = itemRect.top - playRect.top;
      const maxX = Math.max(0, playRect.width - itemRect.width);
      const maxY = Math.max(0, playRect.height - itemRect.height);
      newX = Math.max(0, Math.min(maxX, newX));
      newY = Math.max(0, Math.min(maxY, newY));
      dragItemData.x = newX;
      dragItemData.y = newY;
      item.style.position = 'absolute';
      item.style.left = newX + 'px';
      item.style.top = newY + 'px';
      item.style.width = '';
      item.style.height = '';
      item.style.margin = '';
      item.style.transform = '';
      item.style.transition = '';
      item.style.zIndex = '';
      item.style.opacity = '';
      item.style.pointerEvents = '';
      playAreaEl.appendChild(item);
    }

    function returnPhotoToSpot(item, forceAttach) {
      item.classList.remove('dragging');
      const itemRect = item.getBoundingClientRect();
      const charRect = characterWrapEl.getBoundingClientRect();
      const dropX = itemRect.left + itemRect.width / 2;
      const dropY = itemRect.top + itemRect.height / 2;
      const charTop = charRect.top;
      const charHeadY = charRect.top + charRect.height * 0.3;
      const onHead = (typeof forceAttach === 'boolean') ? forceAttach : (
        dropX >= charRect.left - 20 && dropX <= charRect.right + 20 &&
        dropY >= charTop - 60 && dropY <= charHeadY + 30
      );
      if (onHead) {
        dragItemData.attached = true;
        item.style.position = '';
        item.style.left = '';
        item.style.top = '';
        item.style.width = '';
        item.style.height = '';
        item.style.margin = '';
        item.style.transform = '';
        item.style.transition = '';
        item.style.zIndex = '';
        item.style.pointerEvents = '';
        item.style.opacity = '';
        item.classList.remove('dragging');
        item.classList.add('photo-attached');
        characterEl.appendChild(item);
        const pos = dragItemData.position || 'center';
        applyHatPositionToElement(item, pos);
        return;
      }
      const playRect = playAreaEl.getBoundingClientRect();
      let newX = itemRect.left - playRect.left;
      let newY = itemRect.top - playRect.top;
      const maxX = Math.max(0, playRect.width - itemRect.width);
      const maxY = Math.max(0, playRect.height - itemRect.height);
      newX = Math.max(0, Math.min(maxX, newX));
      newY = Math.max(0, Math.min(maxY, newY));
      dragItemData.x = newX;
      dragItemData.y = newY;
      dragItemData.attached = false;
      item.classList.remove('photo-attached');
      item.style.position = 'absolute';
      item.style.left = newX + 'px';
      item.style.top = newY + 'px';
      item.style.width = '';
      item.style.height = '';
      item.style.margin = '';
      item.style.transform = '';
      item.style.transition = '';
      item.style.zIndex = '';
      item.style.pointerEvents = '';
      playAreaEl.appendChild(item);
    }

    function eatFood(item, mouthRect) {
      item.dataset.eaten = 'true';
      isBusy = true;
      characterEl.classList.remove('smiling');
      mouthEl.classList.remove('mouth-wow');

      const wasChopsticked = chopstickBackEl.classList.contains('active');

      const mouthCenterX = mouthRect.left + mouthRect.width / 2;
      const mouthCenterY = mouthRect.top + mouthRect.height / 2;
      item.classList.add('eating-now');
      const itemRect = item.getBoundingClientRect();
      const itemCenterX = itemRect.left + itemRect.width / 2;
      const itemCenterY = itemRect.top + itemRect.height / 2;
      const deltaX = mouthCenterX - itemCenterX;
      const deltaY = mouthCenterY - itemCenterY;
      item.style.transition = 'transform 0.4s cubic-bezier(0.55, 0, 1, 0.45), opacity 0.4s ease-in';
      item.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.15) rotate(15deg)`;
      item.style.opacity = '0.6';

      if (wasChopsticked) {
        const followInterval = setInterval(() => {
          const r = item.getBoundingClientRect();
          positionChopsticksAtFoodTop(r);
        }, 40);
        setTimeout(() => clearInterval(followInterval), 400);
      }

      spawnSparkles(mouthCenterX, mouthCenterY);

      setTimeout(() => {
        item.style.opacity = '0';
        setTimeout(() => item.remove(), 300);

        if (wasChopsticked) {
          positionChopsticksAtFoodTop({
            left: mouthRect.left,
            top: mouthRect.top - 8,
            width: mouthRect.width,
            height: mouthRect.height
          });
          chopstickBackEl.classList.add('sliding-away');
          chopstickFrontEl.classList.add('sliding-away');
          setTimeout(() => {
            hideChopsticks();
          }, 700);
        }

        characterEl.classList.add('eating', 'chewing');
        mouthEl.classList.add('mouth-chew');
        playSound('eating');

        const crumbInterval = setInterval(() => {
          spawnCrumb(mouthCenterX, mouthCenterY);
        }, 90);

        setTimeout(() => {
          clearInterval(crumbInterval);
          characterEl.classList.remove('chewing');
          mouthEl.classList.remove('mouth-chew');
          characterEl.classList.add('swallowing');
          mouthEl.classList.add('mouth-swallow');

          playSound('swallowing');

          const uidVal = item.dataset.uid;
          trayItems = trayItems.filter(t => t.uid !== uidVal);
          setTimeout(() => {
            characterEl.classList.remove('swallowing', 'eating');
            mouthEl.classList.remove('mouth-swallow');
            isBusy = false;
            if (trayItems.length === 0 && !hasBurped) {
              hasBurped = true;
              setTimeout(() => doBurp(), 400);
            }
          }, 500);
        }, 900);
      }, 380);
    }

    function beginSip(item, mouthRect) {
      item.dataset.eaten = 'true';
      isBusy = true;
      characterEl.classList.remove('swallowing');
      mouthEl.classList.remove('mouth-swallow');
      characterEl.classList.remove('smiling');
      const mouthCenterX = mouthRect.left + mouthRect.width / 2;
      const mouthCenterY = mouthRect.top + mouthRect.height / 2;
      const itemRect = item.getBoundingClientRect();
      const itemCenterX = itemRect.left + itemRect.width / 2;
      const itemCenterY = itemRect.top + itemRect.height / 2;
      const deltaX = mouthCenterX - itemCenterX;
      const deltaY = (mouthCenterY + mouthRect.height * 0.35) - itemCenterY;
      item.classList.add('eating-now');
      item.style.position = 'fixed';
      item.style.transition = 'transform 0.3s ease-out';
      item.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.85)`;
      item.style.opacity = '1';
      item.style.pointerEvents = 'none';
      mouthEl.classList.add('mouth-wow', 'mouth-sip-bubble');
      characterEl.classList.add('sipping', 'eating');

      playSound('sipping');

      startFizz(mouthRect);
      const swallowGuard = setInterval(() => {
        characterEl.classList.remove('swallowing');
        mouthEl.classList.remove('mouth-swallow');
      }, 50);
      setTimeout(() => {
        clearInterval(swallowGuard);
        stopFizz();
        characterEl.classList.remove('swallowing');
        mouthEl.classList.remove('mouth-swallow');
        item.style.transition = 'transform 0.5s ease-in, opacity 0.5s ease-in';
        item.style.transform += ' translateY(-55px) scale(0.5)';
        item.style.opacity = '0';
        characterEl.classList.remove('sipping', 'eating');
        mouthEl.classList.remove('mouth-wow', 'mouth-sip-bubble');
        const uidVal = item.dataset.uid;
        drinkItems = drinkItems.filter(t => t.uid !== uidVal);
        setTimeout(() => { item.remove(); }, 550);
        setTimeout(() => { isBusy = false; }, 200);
      }, 1600);
    }

    function doBurp() {
      if (characterEl.classList.contains('eating') ||
          characterEl.classList.contains('burping') ||
          characterEl.classList.contains('sipping') ||
          characterEl.classList.contains('laughing') ||
          characterEl.classList.contains('blushing')) return;
      characterEl.classList.remove('smiling');
      mouthEl.classList.remove('mouth-wow');
      characterEl.classList.add('burping');
      mouthEl.classList.add('mouth-burp');

      playSound('burping');

      const mouthRect = mouthEl.getBoundingClientRect();
      const mouthCenterX = mouthRect.left + mouthRect.width / 2;
      const mouthTopY = mouthRect.top;
      const burpText = document.createElement('div');
      burpText.className = 'burp-text';
      burpText.textContent = 'BURP!';
      burpText.style.left = mouthCenterX + 'px';
      burpText.style.top = (mouthTopY - 10) + 'px';
      document.body.appendChild(burpText);
      setTimeout(() => burpText.remove(), 1600);
      for (let i = 0; i < 5; i++) {
        const b = document.createElement('div');
        b.className = 'burp-bubble';
        b.textContent = '💨';
        const offsetX = (Math.random() - 0.5) * 80;
        b.style.left = (mouthCenterX + offsetX) + 'px';
        b.style.top = (mouthTopY - Math.random() * 10) + 'px';
        b.style.fontSize = (1.4 + Math.random() * 1.2) + 'rem';
        b.style.animationDelay = (Math.random() * 0.25) + 's';
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 1700);
      }
      spawnSparkles(mouthCenterX, mouthTopY - 30);
      setTimeout(() => {
        characterEl.classList.remove('burping');
        mouthEl.classList.remove('mouth-burp');
      }, 800);
    }

    function spawnSparkles(x, y) {
      const chars = ['✨', '⭐', '💫', '🌟'];
      for (let i = 0; i < 6; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.textContent = chars[Math.floor(Math.random() * chars.length)];
        s.style.left = (x + (Math.random() - 0.5) * 40) + 'px';
        s.style.top = (y + (Math.random() - 0.5) * 40) + 'px';
        s.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
        s.style.animationDelay = (Math.random() * 0.15) + 's';
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 700);
      }
    }

    function spawnCrumb(x, y) {
      const c = document.createElement('div');
      c.className = 'crumb';
      c.textContent = '·';
      c.style.left = x + 'px';
      c.style.top = y + 'px';
      c.style.color = ['#e0ab72', '#c98a4b', '#f0c48a'][Math.floor(Math.random() * 3)];
      c.style.fontSize = (14 + Math.random() * 10) + 'px';
      c.style.fontWeight = 'bold';
      const angle = (Math.random() - 0.5) * Math.PI;
      const dist = 30 + Math.random() * 40;
      c.style.setProperty('--cx', Math.cos(angle) * dist + 'px');
      c.style.setProperty('--cy', (Math.sin(angle) * dist - 20) + 'px');
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 600);
    }

    // ============================================================
    // ADD NEW ITEMS
    // ============================================================
    addBackgroundBtn.addEventListener('click', () => {
      backgrounds.push({
        id: uid(),
        name: 'New BG',
        url: '',
        color: '#fbe9d2',
        applied: false
      });
      buildBackgroundEditors();
      document.querySelector('.sidebar').scrollTop = 0;
    });
    addFoodBtn.addEventListener('click', () => {
      foods.push({ id: uid(), name: 'New Food', url: 'https://via.placeholder.com/200?text=Food', size: 90, chopstick: false });
      buildFoodEditors();
      document.querySelector('.sidebar').scrollTop = 9999;
    });
    addDrinkBtn.addEventListener('click', () => {
      drinks.push({ id: uid(), name: 'New Drink', url: 'https://via.placeholder.com/200?text=Drink', size: 90 });
      buildDrinkEditors();
      document.querySelector('.sidebar').scrollTop = 9999;
    });
    addPhotoBtn.addEventListener('click', () => {
      photos.push({
        id: uid(),
        name: 'New Photo',
        url: 'https://via.placeholder.com/300?text=Photo',
        size: 140,
        angle: 0,
        position: 'center'
      });
      buildPhotoEditors();
      document.querySelector('.sidebar').scrollTop = 9999;
    });

    document.getElementById('charSkinColor').addEventListener('input', (e) => { characterEl.style.background = e.target.value; });
    document.getElementById('charMouthColor').addEventListener('input', (e) => { mouthEl.style.background = e.target.value; });
    document.getElementById('charSize').addEventListener('input', (e) => { characterEl.style.setProperty('--user-scale', e.target.value); });
    document.getElementById('trayW').addEventListener('input', (e) => {
      layout.trayW = parseInt(e.target.value, 10);
      applyLayout();
      clampWrapperInside(trayWrapEl, 'trayX', 'trayY');
    });
    document.getElementById('trayH').addEventListener('input', (e) => {
      layout.trayH = parseInt(e.target.value, 10);
      applyLayout();
      clampWrapperInside(trayWrapEl, 'trayX', 'trayY');
    });
    document.getElementById('trayColor1').addEventListener('input', (e) => {
      trayEl.style.background = `linear-gradient(145deg, ${e.target.value}, ${document.getElementById('trayColor2').value})`;
    });
    document.getElementById('trayColor2').addEventListener('input', (e) => {
      trayEl.style.background = `linear-gradient(145deg, ${document.getElementById('trayColor1').value}, ${e.target.value})`;
    });
    document.getElementById('trayBorderColor').addEventListener('input', (e) => { trayEl.style.borderColor = e.target.value; });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'x' || e.key === 'X') {
        const tag = document.activeElement?.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        appEl.classList.toggle('sidebar-hidden');
        setTimeout(() => {
          applyLayout();
          clampWrapperInside(characterWrapEl, 'charX', 'charY');
          clampWrapperInside(trayWrapEl, 'trayX', 'trayY');
        }, 320);
      }
    });

    async function init() {
      buildBackgroundEditors();
      buildFoodEditors();
      buildDrinkEditors();
      buildPhotoEditors();
      applyLayout();

      try {
        soundDB = await openSoundDB();
        await loadAllSounds();
      } catch (err) {
        console.warn('Sound DB unavailable:', err);
      }
      buildSoundEditors();

      requestAnimationFrame(() => {
        layout.charX = 0.5;
        layout.charY = 0.25;
        layout.trayX = 0.5;
        layout.trayY = 0.75;
        applyLayout();
        makeDraggable(characterWrapEl, 'char');
        makeDraggable(trayWrapEl, 'tray');
      });
      window.addEventListener('resize', () => {
        applyLayout();
        clampWrapperInside(characterWrapEl, 'charX', 'charY');
        clampWrapperInside(trayWrapEl, 'trayX', 'trayY');
      });
    }

    init();
  })();
</script>
</body>
</html>
