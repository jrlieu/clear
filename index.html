<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>🍜 mukbang · photo edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-drag: none; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif;
      background: #2b1b0e; touch-action: none;
      -webkit-text-size-adjust: 100%; overscroll-behavior: none;
    }

    input, textarea { user-select: text; -webkit-user-select: text; }

    .app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

    .sidebar {
      position: absolute; top: 0; left: 0; bottom: 0;
      width: 20%; min-width: 240px; max-width: 340px;
      background: linear-gradient(180deg, #3a2414 0%, #241609 100%);
      border-right: 3px solid #b48c5c;
      padding: 18px 14px; overflow-y: auto; overflow-x: hidden;
      color: #fbe9d2; display: flex; flex-direction: column; gap: 12px;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
      z-index: 1000; box-shadow: 6px 0 24px rgba(0,0,0,0.5);
      -webkit-overflow-scrolling: touch;
    }

    .app.sidebar-hidden .sidebar {
      transform: translateX(-105%); opacity: 0; pointer-events: none;
    }

    .sidebar::-webkit-scrollbar { width: 8px; }
    .sidebar::-webkit-scrollbar-track { background: #241609; }
    .sidebar::-webkit-scrollbar-thumb { background: #7a5733; border-radius: 4px; }

    .side-title {
      font-size: 0.95rem; font-weight: 800; letter-spacing: 1.5px;
      text-transform: uppercase; color: #ffcf9e;
      padding-bottom: 6px; border-bottom: 2px solid #7a5733;
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 6px;
    }

    .food-editor {
      background: #4a2e1a; border: 2px solid #6e4a24;
      border-radius: 14px; padding: 8px;
      display: flex; flex-direction: column; gap: 6px;
    }

    .food-editor.drink-editor { border-color: #4a7ba5; background: #2e3d4a; }
    .food-editor.photo-editor { border-color: #7a4a8f; background: #3a2a4a; }
    .food-editor.background-editor { border-color: #4a8f7a; background: #2a3d3a; }

    .food-editor .preview-row { display: flex; align-items: center; gap: 8px; }

    .food-editor .preview-wrap {
      position: relative; width: 40px; height: 40px;
      flex-shrink: 0; cursor: pointer; border-radius: 8px; overflow: hidden;
      background-image:
        linear-gradient(45deg, #3a2a1a 25%, transparent 25%),
        linear-gradient(-45deg, #3a2a1a 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #3a2a1a 75%),
        linear-gradient(-45deg, transparent 75%, #3a2a1a 75%);
      background-size: 8px 8px;
      background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
      background-color: #2b1b0e; border: none;
    }
    .food-editor .preview-wrap::after {
      content: '📁'; position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.5); font-size: 1.1rem;
      opacity: 0; transition: opacity 0.15s; pointer-events: none;
    }
    .food-editor .preview-wrap:hover::after { opacity: 1; }

    .food-editor .preview {
      width: 100%; height: 100%; object-fit: contain;
      display: block; pointer-events: none;
    }

    .food-editor .preview-wrap input[type="file"] { display: none; }

    .food-editor .name-input {
      flex: 1; min-width: 0; background: #2b1b0e;
      border: 2px solid #6e4a24; border-radius: 8px;
      color: #fbe9d2; padding: 5px 7px;
      font-size: 0.8rem; font-family: inherit; font-weight: 600;
    }
    .food-editor .name-input:focus { outline: none; border-color: #ffcf9e; }

    .icon-btn {
      width: 28px; height: 28px; border-radius: 8px;
      border: 2px solid #6e4a24; background: #2b1b0e;
      color: #ffcf9e; font-weight: 800; font-size: 0.9rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      padding: 0; line-height: 1; flex-shrink: 0; font-family: inherit;
    }
    .icon-btn:hover { background: #6e4a24; color: #fff5e6; }
    .icon-btn.add { border-color: #4a8f4a; color: #a8e6a8; }
    .icon-btn.add:hover { background: #4a8f4a; color: #fff; }
    .icon-btn.delete { border-color: #8f2a2a; color: #ff9e9e; }
    .icon-btn.delete:hover { background: #8f2a2a; color: #fff; }
    .icon-btn.locked {
      border-color: #b06a2a !important; color: #ffcf9e !important;
      background: rgba(176, 106, 42, 0.55) !important;
    }

    .url-input {
      width: 100%; background: #2b1b0e;
      border: 2px solid #6e4a24; border-radius: 8px;
      color: #d6b28a; padding: 5px 7px;
      font-size: 0.65rem; font-family: monospace;
    }
    .url-input:focus { outline: none; border-color: #ffcf9e; color: #fbe9d2; }

    .range-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.75rem; font-weight: 700; color: #ffcf9e;
    }
    .range-row > label { flex-shrink: 0; width: 46px; }
    .range-stack {
      flex: 1; display: flex; flex-direction: column;
      gap: 3px; min-width: 0;
    }
    .range-stack .range-value {
      align-self: flex-end; text-align: right;
      font-family: monospace; color: #fff5e6;
      font-size: 0.68rem; font-weight: 700;
      background: rgba(0,0,0,0.35); border-radius: 5px;
      padding: 1px 6px; border: 1px solid #6e4a24; min-width: 52px;
    }
    .range-stack input[type="range"] { width: 100%; accent-color: #ffcf9e; }

    .size-row, .angle-row, .distance-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.7rem; font-weight: 700; color: #ffcf9e;
    }
    .size-row > label, .angle-row > label, .distance-row > label { flex-shrink: 0; width: 46px; }
    .size-row input[type="range"], .angle-row input[type="range"], .distance-row input[type="range"] { flex: 1; accent-color: #ffcf9e; }
    .size-row .size-value, .angle-row .angle-value, .distance-row .distance-value {
      flex-shrink: 0; width: 42px; text-align: right;
      font-family: monospace; color: #fff5e6; font-size: 0.7rem;
    }

    input[type="range"]:disabled {
      opacity: 0.35; cursor: not-allowed; accent-color: #7a5733;
    }

    .chopstick-row { display: flex; gap: 6px; font-size: 0.7rem; }
    .chopstick-row button {
      flex: 1; padding: 5px; border-radius: 8px;
      border: 2px solid #6e4a24; background: #2b1b0e;
      color: #d6b28a; font-weight: 800; font-family: inherit;
      cursor: pointer; font-size: 0.7rem;
    }
    .chopstick-row button.active { background: #8a5f30; color: #fbe9d2; border-color: #ffcf9e; }
    .chopstick-row button.toggle-chopsticks.active { background: #b06a2a; border-color: #ffcf9e; }

    .position-row { display: flex; gap: 6px; font-size: 0.7rem; }
    .position-row button {
      flex: 1; padding: 5px; border-radius: 8px;
      border: 2px solid #6e4a24; background: #2b1b0e;
      color: #d6b28a; font-weight: 800; font-family: inherit;
      cursor: pointer; font-size: 0.7rem;
    }
    .position-row button.active { background: #7a4a8f; color: #fbe9d2; border-color: #ffcf9e; }

    .color-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.7rem; font-weight: 700; color: #ffcf9e;
    }
    .color-row label { flex-shrink: 0; width: 46px; }
    .color-row input[type="color"] {
      flex: 1; height: 26px; border-radius: 6px;
      border: 2px solid #6e4a24; background: #2b1b0e;
      cursor: pointer; padding: 0;
    }

    .drink-tag, .photo-tag, .background-tag {
      font-size: 0.65rem; font-weight: 800; letter-spacing: 0.8px;
      border-radius: 6px; padding: 3px 6px; text-align: center;
    }
    .drink-tag { color: #8ac0e6; background: rgba(74, 123, 165, 0.2); border: 1px solid #4a7ba5; }
    .photo-tag { color: #d8a8e6; background: rgba(122, 74, 143, 0.2); border: 1px solid #7a4a8f; }
    .background-tag { color: #8ae6c1; background: rgba(74, 143, 122, 0.2); border: 1px solid #4a8f7a; }

    .char-editor, .tray-editor {
      background: #4a2e1a; border: 2px solid #6e4a24;
      border-radius: 14px; padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .char-editor .row, .tray-editor .row {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.8rem; font-weight: 700;
    }
    .char-editor label, .tray-editor label { flex-shrink: 0; width: 60px; color: #ffcf9e; }

    .pos-info {
      font-size: 0.62rem; font-family: monospace;
      color: #b8dcf5; background: rgba(74, 123, 165, 0.15);
      border: 1px solid #4a7ba5; border-radius: 6px;
      padding: 4px 6px; text-align: center;
    }

    .snap-guide {
      position: absolute; pointer-events: none; z-index: 400;
      opacity: 0; transition: opacity 0.12s ease;
      background: rgba(255, 105, 180, 0.9);
      box-shadow: 0 0 12px rgba(255, 105, 180, 0.8);
    }
    .snap-guide.vertical { top: 0; bottom: 0; width: 3px; transform: translateX(-50%); }
    .snap-guide.horizontal { left: 0; right: 0; height: 3px; transform: translateY(-50%); }
    .snap-guide.active { opacity: 1; }

    .play-area {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      background-color: #fbe9d2;
      background-image: radial-gradient(circle at 50% 20%, #fff5e6, #f0d5b0);
      overflow: hidden;
      background-size: cover; background-position: center;
      background-repeat: no-repeat; perspective: 1200px;
    }

    .character-wrap {
      position: absolute; top: 25%; left: 50%;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      cursor: grab; touch-action: none; z-index: 2;
    }
    .character-wrap.dragging { cursor: grabbing; z-index: 100; }
    .character-wrap.char-locked { cursor: default; }

    .character {
      --base-scale: 1.4; --user-scale: 1;
      background: #ffdbb5;
      border-radius: 180px 180px 120px 120px;
      padding: 32px 60px 18px 60px;
      box-shadow: 0 16px 0 #b48c5c, 0 30px 38px rgba(0, 0, 0, 0.32);
      border: 6px solid #a77b4b;
      transition: transform 0.15s ease;
      position: relative; transform-origin: center bottom;
      transform: scale(calc(var(--base-scale) * var(--user-scale)));
    }

    .character.chewing { animation: chew 0.28s ease-in-out infinite; }
    @keyframes chew {
      0%   { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(0) scale(1, 1); }
      50%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(-3px) scale(1.02, 0.97); }
      100% { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(0) scale(1, 1); }
    }
    .character.sipping { animation: sip 0.9s ease-in-out infinite; }
    @keyframes sip {
      0%   { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1, 1); }
      50%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1.005, 0.998); }
      100% { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1, 1); }
    }
    .character.swallowing { animation: swallow 0.45s cubic-bezier(0.4, 0, 0.6, 1); }
    @keyframes swallow {
      0%   { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1, 1); }
      30%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(0.94, 1.06) translateY(3px); }
      55%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1.03, 0.94) translateY(-3px); }
      100% { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1, 1); }
    }
    .character.burping { animation: burp 0.75s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes burp {
      0%   { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1, 1) translateY(0); }
      15%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1.08, 0.94) translateY(-10px); }
      30%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(0.96, 1.05) translateY(4px); }
      50%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1.04, 0.98) translateY(-4px); }
      70%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(0.99, 1.01) translateY(2px); }
      100% { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1, 1) translateY(0); }
    }
    .character.laughing { animation: laugh 0.32s ease-in-out infinite; }
    @keyframes laugh {
      0%   { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(0) rotate(0deg); }
      25%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(-6px) rotate(-2deg); }
      50%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(0) rotate(0deg); }
      75%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(-6px) rotate(2deg); }
      100% { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(0) rotate(0deg); }
    }

    .blush {
      position: absolute; width: 52px; height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle closest-side,
        rgba(255, 140, 160, 0.85) 0%,
        rgba(255, 140, 160, 0.55) 40%,
        rgba(255, 140, 160, 0.18) 70%,
        rgba(255, 140, 160, 0.04) 90%,
        rgba(255, 140, 160, 0) 100%);
      opacity: 0; pointer-events: none;
      transform: scale(0.4);
      transition: opacity 0.4s ease, transform 0.4s ease;
      border: none; box-shadow: none; overflow: visible; outline: none;
      -webkit-appearance: none; appearance: none;
      filter: blur(0.5px);
      -webkit-transform: translateZ(0); transform: translateZ(0);
    }

    .blush.left  { left: 2px;  top: 40%; }
    .blush.right { right: 2px; top: 40%; }

    .character.blushing .blush { opacity: 1; transform: translateZ(0) scale(1.1); }

    .face { position: relative; display: flex; flex-direction: column; align-items: center; }
    .eyes { display: flex; gap: 52px; margin-bottom: 12px; }

    /* ============================================================
       EYE — circle is ::before so the dash can crossfade over it.
       Blink is a pure crossfade with asymmetric timing:
         • CLOSING (dash fades IN):  0.14s  — smooth
         • OPENING (dash fades OUT): 0.06s  — snappy, no linger
       No resizing, no bulges.
       ============================================================ */
    .eye {
      width: 40px; height: 40px;
      position: relative;
      overflow: visible;
    }

    /* The dark circle of the eye (with its inset highlight + drop shadow) */
    .eye::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #3b2a1c;
      border-radius: 50%;
      box-shadow: inset -6px -6px 0 #1f140e, 0 5px 0 #6b4f32;
      transform: scaleY(1);
      opacity: 1;
      transform-origin: center center;
      /* OPENING transition: circle reappears snappily */
      transition:
        transform 0.1s cubic-bezier(0.4, 0, 0.2, 1),
        opacity 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .eye .pupil {
      position: absolute; top: 8px; left: 8px;
      width: 14px; height: 14px; background: white;
      border-radius: 50%; box-shadow: 0 0 6px white;
      transform: translate(var(--pupil-x, 0px), var(--pupil-y, 0px));
      /* OPENING: pupil comes back quickly */
      transition: transform 0.08s linear, opacity 0.08s ease;
      pointer-events: none;
      z-index: 2;
    }

    /* The clean dash — FIXED full width, only opacity animates.
       Default (open state) = fast fade OUT so it doesn't linger. */
    .eye .lash {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 38px;
      height: 4px;
      background: #3b2a1c;
      border-radius: 2px;
      box-shadow: none;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.06s cubic-bezier(0.4, 0, 1, 1); /* fast fade OUT */
      pointer-events: none;
      z-index: 3;
    }

    /* -------- CLOSED STATE --------
       Circle + its shadows fade out entirely,
       pupil fades out, and the flat dash fades in at full width.
       Closing timing is slightly slower (0.14s) so the eye-close
       feels smooth and readable; opening is fast (above).
    */
    .eye.blinking::before,
    .character.smiling .eye::before,
    .character.laughing .eye::before,
    .character.blushing .eye::before {
      opacity: 0;
      transform: scaleY(0.2);
      /* CLOSING: circle fades out over 0.14s */
      transition:
        transform 0.14s cubic-bezier(0.4, 0, 0.2, 1),
        opacity 0.14s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .eye.blinking .pupil,
    .character.smiling .eye .pupil,
    .character.laughing .eye .pupil,
    .character.blushing .eye .pupil {
      opacity: 0;
      transition: transform 0.08s linear, opacity 0.1s ease;
    }

    .eye.blinking .lash,
    .character.smiling .eye .lash,
    .character.laughing .eye .lash,
    .character.blushing .eye .lash {
      opacity: 1;
      transition: opacity 0.14s cubic-bezier(0.4, 0, 0.2, 1); /* slow fade IN */
    }

    /* Squint during eating / sipping — keep circle but shrink vertically a bit */
    .character.eating .eye { transform: scaleY(0.55); }
    .character.sipping .eye { transform: scaleY(0.28); }

    .mouth {
      width: 100px; height: 44px; background: #b13e3e;
      border-radius: 0 0 60px 60px; border: 0px solid #6e2a2a;
      border-top: none; margin-top: 6px;
      transition: height 0.18s, width 0.18s, border-radius 0.18s, box-shadow 0.18s, margin-top 0.18s;
      box-shadow: inset 0 -9px 0 #7e2a2a;
      position: relative; overflow: hidden;
      transform-origin: center top; cursor: pointer;
      pointer-events: auto; -webkit-tap-highlight-color: transparent;
    }

    .mouth:hover {
      box-shadow: inset 0 -9px 0 #7e2a2a, 0 0 18px rgba(255, 200, 120, 0.85);
      filter: brightness(1.08);
    }

    .mouth.mouth-open {
      height: 88px; width: 138px; background: #d14a4a;
      border-radius: 0 0 75px 75px;
      box-shadow: inset 0 -12px 0 #7e2a2a, 0 0 28px #ff8f8f;
    }
    .mouth.mouth-wow {
      height: 50px; width: 50px; border-radius: 50%; background: #a83434;
      box-shadow: inset 0 -8px 0 #7e2a2a; border: 0px solid #6e2a2a;
    }
    .mouth.mouth-laugh {
      height: 70px; width: 110px; border-radius: 0 0 70px 70px;
      background: #d14a4a; box-shadow: inset 0 -14px 0 #7e2a2a;
    }
    .mouth.mouth-chew { animation: mouthChew 0.28s ease-in-out infinite; }
    @keyframes mouthChew {
      0%   { height: 50px; width: 104px; border-radius: 0 0 60px 60px; }
      50%  { height: 32px; width: 114px; border-radius: 0 0 42px 42px; }
      100% { height: 50px; width: 104px; border-radius: 0 0 60px 60px; }
    }
    .mouth.mouth-swallow { animation: mouthSwallow 0.45s ease-in-out; }
    @keyframes mouthSwallow {
      0%   { height: 50px; width: 104px; border-radius: 0 0 60px 60px; }
      40%  { height: 24px; width: 60px;  border-radius: 0 0 30px 30px; }
      70%  { height: 32px; width: 46px;  border-radius: 0 0 22px 22px; }
      100% { height: 44px; width: 100px; border-radius: 0 0 60px 60px; }
    }
    .mouth.mouth-burp { animation: mouthBurp 0.75s ease-in-out; }
    @keyframes mouthBurp {
      0%   { height: 44px; width: 100px; border-radius: 0 0 60px 60px; }
      20%  { height: 95px; width: 130px; border-radius: 50% 50% 60px 60px; }
      55%  { height: 80px; width: 118px; border-radius: 50% 50% 60px 60px; }
      100% { height: 44px; width: 100px; border-radius: 0 0 60px 60px; }
    }
    .mouth.mouth-sip-bubble { animation: sipBubble 0.55s ease-in-out infinite; }
    @keyframes sipBubble {
      0%   { height: 50px; width: 50px; }
      50%  { height: 44px; width: 44px; }
      100% { height: 50px; width: 50px; }
    }

    .mouth::before {
      content: ''; position: absolute; bottom: 0; left: 50%;
      transform: translateX(-50%); width: 60%; height: 40%;
      background: #e86a6a; border-radius: 50% 50% 0 0;
      opacity: 0.7; pointer-events: none;
    }

    .mouth.hint::after {
      content: ''; position: absolute; bottom: -8px; left: 50%;
      transform: translateX(-50%); width: 16px; height: 16px;
      background: #ffb3b3; border-radius: 50%;
      animation: pulseHint 0.7s infinite alternate; z-index: 2;
    }
    @keyframes pulseHint {
      from { opacity: 0.4; transform: translateX(-50%) scale(0.8); }
      to { opacity: 1; transform: translateX(-50%) scale(1.3); }
    }

    .cheek-bulge {
      position: absolute; width: 34px; height: 34px;
      background: rgba(255, 180, 120, 0.7);
      border-radius: 50%; opacity: 0; pointer-events: none;
      box-shadow: inset -4px -4px 0 rgba(200, 130, 70, 0.5);
    }
    .cheek-bulge.left { left: 8px; top: 50%; transform: translateY(-50%); }
    .cheek-bulge.right { right: 8px; top: 50%; transform: translateY(-50%); }
    .character.chewing .cheek-bulge { animation: bulge 0.28s ease-in-out infinite; }
    .character.chewing .cheek-bulge.right { animation-delay: 0.14s; }
    @keyframes bulge {
      0%, 100% { opacity: 0; transform: translateY(-50%) scale(0.6); }
      50%      { opacity: 1; transform: translateY(-50%) scale(1); }
    }

    .tray-wrap {
      position: absolute; top: 75%; left: 50%;
      transform: translate(-50%, -50%);
      cursor: grab; touch-action: none; z-index: 1;
      perspective: 800px; transform-style: preserve-3d;
    }
    .tray-wrap.dragging { cursor: grabbing; z-index: 100; }
    .tray-wrap.tray-locked { cursor: default; }

    .tray {
      width: 640px; height: 320px;
      background: linear-gradient(145deg, #b48b5c, #8f623a);
      border-radius: 60px 60px 40px 40px;
      box-shadow: 0 14px 0 #6b4b2c, inset 0 8px 12px rgba(255, 255, 200, 0.4);
      border: 4px solid #7a5733;
      position: relative; overflow: visible;
      transition: background 0.2s, border-color 0.2s, transform 0.12s ease;
      transform-origin: center center; transform-style: preserve-3d;
    }

    /* ============================================================
       STACKING ORDER — DRINKS ALWAYS BEHIND FOOD
       .food-item   → z-index 5 (highest)
       .drink-item  → z-index 3 (below food)
       .drink hover → z-index 4 (above other drinks, still below food)
       ============================================================ */
    .food-item, .drink-item {
      position: absolute; display: flex; flex-direction: column;
      align-items: center; cursor: grab; touch-action: none;
    }
    .food-item { z-index: 5; }
    .drink-item { z-index: 3; }
    .drink-item:hover:not(.dragging):not(.eaten) { z-index: 4; }

    .food-item.dragging, .drink-item.dragging {
      cursor: grabbing; z-index: 2147483646 !important;
      transition: none; pointer-events: none; position: fixed !important;
    }
    .food-item.eating-now {
      transition: transform 0.5s cubic-bezier(0.55, 0, 1, 0.45), opacity 0.5s ease-in;
      pointer-events: none; z-index: 2147483646 !important; position: fixed !important;
    }
    .drink-item.eating-now {
      pointer-events: none; z-index: 2147483646 !important; position: fixed !important;
    }

    .food-img, .drink-img {
      object-fit: contain; pointer-events: none;
      display: block; border: none;
    }
    .food-img { filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.45)); }

    .photo-item {
      position: absolute; display: flex; flex-direction: column;
      align-items: center; cursor: grab; touch-action: none; z-index: 4;
    }
    .photo-item:hover:not(.dragging) { z-index: 10; }
    .photo-item.dragging {
      cursor: grabbing; z-index: 2147483646 !important;
      transition: none; pointer-events: none; position: fixed !important;
    }
    .photo-item.photo-attached {
      position: absolute; transform: translateX(-50%);
      transform-origin: center bottom; z-index: 5; cursor: grab;
    }
    .photo-img {
      object-fit: contain; pointer-events: none;
      display: block; border: none; transform-origin: center center;
    }

    .chopstick-single {
      position: fixed; top: 0; left: 0;
      pointer-events: none; opacity: 0;
      transform-origin: 50% 100%; rotate: -30deg;
      transform: translate(-50%, -100%) translateY(160px) scale(0.85);
      transition: transform 0.35s cubic-bezier(0.34, 1.3, 0.64, 1), opacity 0.25s ease-out;
    }
    .chopstick-single.active { opacity: 1; transform: translate(-50%, -100%) translateY(0) scale(1); }
    .chopstick-single.instant-hide { transition: none !important; }
    .chopstick-back-float { z-index: 3; }
    .chopstick-front-float { z-index: 2147483647; }
    .chopstick-back-float.dragging-back { z-index: 2147483645; }
    .chopstick-front-float.dragging-front { z-index: 2147483647; }

    .chopstick-single .chopstick {
      position: absolute; bottom: 0; left: 50%;
      width: 9px; height: 160px;
      background: linear-gradient(to bottom, #e8bd7f 0%, #d6a15f 25%, #b8834a 60%, #8a5f30 100%);
      border-radius: 5px 5px 3px 3px;
      box-shadow: inset -2px 0 0 #6e4a24, inset 2px 0 0 #f0c48a, 0 4px 8px rgba(0, 0, 0, 0.35);
      transform-origin: 50% 100%;
    }
    .chopstick-back-float .chopstick { transform: translateX(-50%) rotate(-10deg); }
    .chopstick-front-float .chopstick { transform: translateX(-50%) rotate(10deg); }
    .chopstick-back-float.holding .chopstick { transform: translateX(-50%) rotate(-4deg); }
    .chopstick-front-float.holding .chopstick { transform: translateX(-50%) rotate(4deg); }

    .sparkle {
      position: fixed; pointer-events: none;
      font-size: 1.4rem;
      animation: sparkleOut 0.6s ease-out forwards;
      z-index: 2147483645;
    }
    @keyframes sparkleOut {
      0% { opacity: 1; transform: scale(0.5) rotate(0deg); }
      100% { opacity: 0; transform: scale(1.8) rotate(30deg) translateY(-40px); }
    }

    .crumb {
      position: fixed; pointer-events: none;
      font-size: 0.8rem; z-index: 2147483645;
      animation: crumbFly 0.55s ease-out forwards;
    }
    @keyframes crumbFly {
      0%   { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--cx), var(--cy)) scale(0.3); }
    }

    .fizz {
      position: fixed; pointer-events: none;
      font-size: 1.3rem; z-index: 2147483645;
      animation: fizzRise 0.9s ease-out forwards;
    }
    @keyframes fizzRise {
      0%   { opacity: 0; transform: translate(-50%, 0) scale(0.4); }
      20%  { opacity: 1; transform: translate(-50%, -10px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -65px) scale(1.4); }
    }

    .burp-bubble {
      position: fixed; pointer-events: none;
      font-size: 2rem; animation: burpFloat 1.4s ease-out forwards;
      z-index: 2147483645;
    }
    @keyframes burpFloat {
      0%   { opacity: 0; transform: translate(-50%, 0) scale(0.3); }
      15%  { opacity: 1; transform: translate(-50%, -10px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -120px) scale(1.6); }
    }

    .burp-text {
      position: fixed; pointer-events: none;
      font-weight: 900; font-size: 1.6rem; color: #fff5e6;
      text-shadow: 2px 2px 0 #6e4a24, -1px -1px 0 #2b1b0e, 0 0 12px #ffcf9e;
      animation: burpText 1.5s ease-out forwards;
      z-index: 2147483645; letter-spacing: 2px;
    }
    @keyframes burpText {
      0%   { opacity: 0; transform: translate(-50%, 0) scale(0.5) rotate(-8deg); }
      20%  { opacity: 1; transform: translate(-50%, -20px) scale(1.15) rotate(-4deg); }
      60%  { opacity: 1; transform: translate(-50%, -60px) scale(1.05) rotate(2deg); }
      100% { opacity: 0; transform: translate(-50%, -110px) scale(1.2) rotate(6deg); }
    }

    .laugh-text {
      position: fixed; pointer-events: none;
      font-weight: 900; font-size: 1.4rem; color: #fff5e6;
      text-shadow: 2px 2px 0 #b06a2a, -1px -1px 0 #6e4a24, 0 0 10px #ffcf9e;
      animation: laughText 1.2s ease-out forwards;
      z-index: 2147483645; letter-spacing: 1px;
    }
    @keyframes laughText {
      0%   { opacity: 0; transform: translate(-50%, 0) scale(0.5) rotate(-10deg); }
      25%  { opacity: 1; transform: translate(-50%, -25px) scale(1.2) rotate(4deg); }
      60%  { opacity: 1; transform: translate(-50%, -55px) scale(1.05) rotate(-3deg); }
      100% { opacity: 0; transform: translate(-50%, -95px) scale(1.15) rotate(6deg); }
    }

    .mouth-hint-bubble {
      position: fixed; pointer-events: none;
      background: rgba(74, 46, 26, 0.95); color: #ffcf9e;
      padding: 6px 12px; border-radius: 10px;
      border: 2px solid #b48c5c; font-weight: 800;
      font-size: 0.75rem; letter-spacing: 0.5px;
      z-index: 2000; box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      animation: hintBubble 2.4s ease-out forwards;
      transform: translate(-50%, 0);
    }
    @keyframes hintBubble {
      0%   { opacity: 0; transform: translate(-50%, 10px) scale(0.8); }
      15%  { opacity: 1; transform: translate(-50%, -8px) scale(1); }
      80%  { opacity: 1; transform: translate(-50%, -14px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -22px) scale(1); }
    }
  </style>
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-title">
      <span>🖼️ BACKGROUND</span>
      <button class="icon-btn add" id="addBackgroundBtn" title="Add a new background" style="border-color: #4a8f7a; color: #8ae6c1;">＋</button>
    </div>
    <div id="backgroundEditors"></div>

    <div class="side-title">
      <span>🍽️ FOOD</span>
      <button class="icon-btn add" id="addFoodBtn" title="Add a new food">＋</button>
    </div>
    <div id="foodEditors"></div>

    <div class="side-title">
      <span>🥤 DRINKS</span>
      <button class="icon-btn add" id="addDrinkBtn" title="Add a new drink" style="border-color: #4a7ba5; color: #8ac0e6;">＋</button>
    </div>
    <div id="drinkEditors"></div>

    <div class="side-title">
      <span>🖼️ PHOTOS</span>
      <button class="icon-btn add" id="addPhotoBtn" title="Add a new photo" style="border-color: #7a4a8f; color: #d8a8e6;">＋</button>
    </div>
    <div id="photoEditors"></div>

    <div class="side-title">
      <span>😋 CHARACTER</span>
      <button class="icon-btn" id="charLockBtn" title="Lock / unlock character" style="border-color: #4a8f4a; color: #a8e6a8;">🔓</button>
    </div>
    <div class="char-editor">
      <div class="range-row">
        <label>Size</label>
        <div class="range-stack">
          <span class="range-value" id="charSizeValue">1.00×</span>
          <input type="range" id="charSize" min="0.6" max="1.6" step="0.05" value="1">
        </div>
      </div>
      <div class="range-row">
        <label>X</label>
        <div class="range-stack">
          <span class="range-value" id="charXValue">50%</span>
          <input type="range" id="charXSlider" min="0" max="100" step="1" value="50">
        </div>
      </div>
      <div class="range-row">
        <label>Y</label>
        <div class="range-stack">
          <span class="range-value" id="charYValue">25%</span>
          <input type="range" id="charYSlider" min="0" max="100" step="1" value="25">
        </div>
      </div>
      <div class="pos-info" id="charPosInfo">X: 50% · Y: 25%</div>
      <div style="display:flex; gap:6px; margin-top:4px;">
        <button class="icon-btn" id="saveCharPresetBtn" style="flex:1; border-color:#a8e6a8; color:#a8e6a8; font-size:0.7rem; padding:4px;">💾 Save</button>
        <button class="icon-btn" id="loadCharPresetBtn" style="flex:1; border-color:#ffcf9e; color:#ffcf9e; font-size:0.7rem; padding:4px;">📂 Use</button>
      </div>
    </div>

    <div class="side-title">
      <span>🥘 TRAY</span>
      <button class="icon-btn" id="trayLockBtn" title="Lock / unlock tray position" style="border-color: #4a8f4a; color: #a8e6a8;">🔓</button>
    </div>
    <div class="tray-editor">
      <div class="range-row">
        <label>Width</label>
        <div class="range-stack">
          <span class="range-value" id="trayWValue">640px</span>
          <input type="range" id="trayW" min="300" max="1400" step="10" value="640">
        </div>
      </div>
      <div class="range-row">
        <label>Height</label>
        <div class="range-stack">
          <span class="range-value" id="trayHValue">320px</span>
          <input type="range" id="trayH" min="180" max="700" step="10" value="320">
        </div>
      </div>
      <div class="range-row">
        <label>Tilt</label>
        <div class="range-stack">
          <span class="range-value" id="trayTiltValue">0°</span>
          <input type="range" id="trayTilt" min="-45" max="45" step="1" value="0">
        </div>
      </div>
      <div class="range-row">
        <label>X</label>
        <div class="range-stack">
          <span class="range-value" id="trayXValue">50%</span>
          <input type="range" id="trayXSlider" min="0" max="100" step="1" value="50">
        </div>
      </div>
      <div class="range-row">
        <label>Y</label>
        <div class="range-stack">
          <span class="range-value" id="trayYValue">75%</span>
          <input type="range" id="trayYSlider" min="0" max="100" step="1" value="75">
        </div>
      </div>
      <div class="pos-info" id="trayPosInfo">X: 50% · Y: 75%</div>
      <div style="display:flex; gap:6px; margin-top:4px;">
        <button class="icon-btn" id="saveTrayPresetBtn" style="flex:1; border-color:#a8e6a8; color:#a8e6a8; font-size:0.7rem; padding:4px;">💾 Save</button>
        <button class="icon-btn" id="loadTrayPresetBtn" style="flex:1; border-color:#ffcf9e; color:#ffcf9e; font-size:0.7rem; padding:4px;">📂 Use</button>
      </div>
    </div>
  </aside>

  <main class="play-area" id="playArea">
    <div class="snap-guide vertical" id="snapGuideV"></div>
    <div class="snap-guide horizontal" id="snapGuideH"></div>

    <div class="tray-wrap" id="trayWrap">
      <div class="tray" id="tray"></div>
    </div>

    <div class="character-wrap" id="characterWrap">
      <div class="character" id="character">
        <div class="face">
          <div class="eyes">
            <div class="eye" id="eyeLeft">
              <div class="pupil"></div>
              <div class="lash"></div>
            </div>
            <div class="eye" id="eyeRight">
              <div class="pupil"></div>
              <div class="lash"></div>
            </div>
          </div>
          <div class="mouth" id="mouth" title="Tap to open / close the panel">
            <div class="cheek-bulge left"></div>
            <div class="cheek-bulge right"></div>
          </div>
        </div>
        <div class="blush left"></div>
        <div class="blush right"></div>
      </div>
    </div>
  </main>
</div>

<div class="chopstick-single chopstick-back-float" id="chopstickBack">
  <div class="chopstick"></div>
</div>

<div class="chopstick-single chopstick-front-float" id="chopstickFront">
  <div class="chopstick"></div>
</div>

<script>
  (function() {
    function uid() { return 'x_' + Math.random().toString(36).substr(2, 9); }

    let backgrounds = [];
    let foods = [];
    let drinks = [];
    let photos = [];

    let trayItems = [];
    let drinkItems = [];
    let photoItems = [];

    let isBusy = false;
    let trayLocked = false;
    let charLocked = false;

    let isDragging = false;
    let dragEl = null;
    let dragItemData = null;
    let dragItemKind = null;
    let dragOffsetX = 0, dragOffsetY = 0;
    let pointerId = null;

    let fizzInterval = null;

    let drinkSippedThisDrag = false;
    let drinkIsCurrentlySipping = false;
    let burpDelayTimer = null;

    document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
    document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
    document.addEventListener('gestureend', e => e.preventDefault(), { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    document.addEventListener('touchmove', function(e) {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    const appEl = document.getElementById('app');
    const playAreaEl = document.getElementById('playArea');
    const trayEl = document.getElementById('tray');
    const trayWrapEl = document.getElementById('trayWrap');
    const characterWrapEl = document.getElementById('characterWrap');
    const characterEl = document.getElementById('character');
    const mouthEl = document.getElementById('mouth');
    const chopstickBackEl = document.getElementById('chopstickBack');
    const chopstickFrontEl = document.getElementById('chopstickFront');
    const backgroundEditorsEl = document.getElementById('backgroundEditors');
    const foodEditorsEl = document.getElementById('foodEditors');
    const drinkEditorsEl = document.getElementById('drinkEditors');
    const photoEditorsEl = document.getElementById('photoEditors');
    const addBackgroundBtn = document.getElementById('addBackgroundBtn');
    const addFoodBtn = document.getElementById('addFoodBtn');
    const addDrinkBtn = document.getElementById('addDrinkBtn');
    const addPhotoBtn = document.getElementById('addPhotoBtn');
    const eyeLeft = document.getElementById('eyeLeft');
    const eyeRight = document.getElementById('eyeRight');
    const pupilLeft = eyeLeft.querySelector('.pupil');
    const pupilRight = eyeRight.querySelector('.pupil');
    const snapGuideVEl = document.getElementById('snapGuideV');
    const snapGuideHEl = document.getElementById('snapGuideH');
    const trayLockBtn = document.getElementById('trayLockBtn');
    const charLockBtn = document.getElementById('charLockBtn');

    const saveCharPresetBtn = document.getElementById('saveCharPresetBtn');
    const loadCharPresetBtn = document.getElementById('loadCharPresetBtn');
    const saveTrayPresetBtn = document.getElementById('saveTrayPresetBtn');
    const loadTrayPresetBtn = document.getElementById('loadTrayPresetBtn');

    const charSizeSlider = document.getElementById('charSize');
    const trayWSlider = document.getElementById('trayW');
    const trayHSlider = document.getElementById('trayH');
    const trayTiltSlider = document.getElementById('trayTilt');

    const layout = {
      charX: 0.5, charY: 0.25,
      trayX: 0.5, trayY: 0.75,
      trayW: 640, trayH: 320,
      trayTilt: 0
    };

    const SNAP_DISTANCE = 18;

    // ============================================================
    // PERSISTENCE
    // ============================================================
    const STORAGE_KEY = 'mukbang_state_v1';
    let saveTimer = null;
    let pendingSpawnedItems = null;

    function saveState() {
      try {
        const pw = playAreaEl.clientWidth || 1;
        const ph = playAreaEl.clientHeight || 1;

        const trayItemsSaved = trayItems.map(t => ({
          uid: t.uid, foodId: t.foodId,
          xPct: t.x / pw, yPct: t.y / ph
        }));
        const drinkItemsSaved = drinkItems.map(t => ({
          uid: t.uid, drinkId: t.drinkId,
          xPct: t.x / pw, yPct: t.y / ph
        }));
        const photoItemsSaved = photoItems.map(t => ({
          uid: t.uid, photoId: t.photoId,
          xPct: t.x / pw, yPct: t.y / ph,
          attached: !!t.attached,
          position: t.position || 'center'
        }));

        const payload = {
          backgrounds: backgrounds,
          foods: foods,
          drinks: drinks,
          photos: photos,
          trayItems: trayItemsSaved,
          drinkItems: drinkItemsSaved,
          photoItems: photoItemsSaved,
          layout: { ...layout },
          charSize: charSizeSlider.value,
          charLocked: charLocked,
          trayLocked: trayLocked
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch(e) {
        console.warn('Save failed (probably quota exceeded)', e);
        flashMessage('⚠️ Storage full — some data not saved', true);
      }
    }

    function scheduleSave() {
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        saveTimer = null;
        saveState();
      }, 250);
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (Array.isArray(data.backgrounds)) backgrounds = data.backgrounds;
        if (Array.isArray(data.foods)) foods = data.foods;
        if (Array.isArray(data.drinks)) drinks = data.drinks;
        if (Array.isArray(data.photos)) photos = data.photos;
        if (data.layout && typeof data.layout === 'object') {
          Object.assign(layout, data.layout);
        }
        if (typeof data.charLocked === 'boolean') charLocked = data.charLocked;
        if (typeof data.trayLocked === 'boolean') trayLocked = data.trayLocked;
        if (data.charSize) {
          charSizeSlider.value = data.charSize;
          characterEl.style.setProperty('--user-scale', data.charSize);
          if (charSizeValueEl) charSizeValueEl.textContent = parseFloat(data.charSize).toFixed(2) + '×';
        }
        pendingSpawnedItems = {
          trayItems: Array.isArray(data.trayItems) ? data.trayItems : [],
          drinkItems: Array.isArray(data.drinkItems) ? data.drinkItems : [],
          photoItems: Array.isArray(data.photoItems) ? data.photoItems : []
        };
      } catch(e) {
        console.warn('Load failed', e);
      }
    }

    function restoreSpawnedItems() {
      if (!pendingSpawnedItems) return;
      const pw = playAreaEl.clientWidth;
      const ph = playAreaEl.clientHeight;
      const p = pendingSpawnedItems;

      trayItems = (p.trayItems || [])
        .filter(t => foods.some(f => f.id === t.foodId))
        .map(t => ({
          uid: t.uid || uid(),
          foodId: t.foodId,
          x: (typeof t.xPct === 'number' ? t.xPct : 0) * pw,
          y: (typeof t.yPct === 'number' ? t.yPct : 0) * ph
        }));

      drinkItems = (p.drinkItems || [])
        .filter(t => drinks.some(d => d.id === t.drinkId))
        .map(t => ({
          uid: t.uid || uid(),
          drinkId: t.drinkId,
          x: (typeof t.xPct === 'number' ? t.xPct : 0) * pw,
          y: (typeof t.yPct === 'number' ? t.yPct : 0) * ph
        }));

      photoItems = (p.photoItems || [])
        .filter(t => photos.some(ph => ph.id === t.photoId))
        .map(t => ({
          uid: t.uid || uid(),
          photoId: t.photoId,
          x: (typeof t.xPct === 'number' ? t.xPct : 0) * pw,
          y: (typeof t.yPct === 'number' ? t.yPct : 0) * ph,
          attached: !!t.attached,
          position: t.position || 'center'
        }));

      renderTray();
      renderDrinks();
      renderPhotos();
      pendingSpawnedItems = null;
    }

    // ============================================================
    // SIDEBAR TOGGLE
    // ============================================================
    function toggleSidebar() {
      appEl.classList.toggle('sidebar-hidden');
    }

    function showMouthHintOnce() {
      if (sessionStorage.getItem('mukbang_mouth_hint_shown')) return;
      sessionStorage.setItem('mukbang_mouth_hint_shown', '1');
      setTimeout(() => {
        const r = mouthEl.getBoundingClientRect();
        const hint = document.createElement('div');
        hint.className = 'mouth-hint-bubble';
        hint.textContent = '👆 tap the mouth to open / close the panel';
        hint.style.left = (r.left + r.width / 2) + 'px';
        hint.style.top = (r.bottom + 12) + 'px';
        document.body.appendChild(hint);
        setTimeout(() => hint.remove(), 2500);
      }, 800);
    }

    // ============================================================
    // PRESET SAVE / LOAD
    // ============================================================
    function saveCharacterPreset() {
      const preset = {
        size: charSizeSlider.value,
        x: layout.charX,
        y: layout.charY
      };
      localStorage.setItem('mukbang_char_preset', JSON.stringify(preset));
      flashMessage('Character preset saved!');
    }

    function loadCharacterPreset() {
      const raw = localStorage.getItem('mukbang_char_preset');
      if (!raw) { flashMessage('No character preset saved yet.', true); return; }
      try {

    // RANDOM EMOTIONS
    // ============================================================
    function canDoExpressiveEmotion() {
      if (isBusy) return false;
      if (characterEl.classList.contains('eating')) return false;
      if (characterEl.classList.contains('chewing')) return false;
      if (characterEl.classList.contains('swallowing')) return false;
      if (characterEl.classList.contains('sipping')) return false;
      if (characterEl.classList.contains('burping')) return false;
      if (characterEl.classList.contains('laughing')) return false;
      if (characterEl.classList.contains('blushing')) return false;
      if (characterEl.classList.contains('smiling')) return false;
      if (mouthEl.classList.contains('mouth-open')) return false;
      if (mouthEl.classList.contains('mouth-chew')) return false;
      if (mouthEl.classList.contains('mouth-swallow')) return false;
      if (mouthEl.classList.contains('mouth-wow')) return false;
      if (mouthEl.classList.contains('mouth-sip-bubble')) return false;
      if (mouthEl.classList.contains('mouth-burp')) return false;
      if (mouthEl.classList.contains('mouth-laugh')) return false;
      return true;
    }

    const BLINK_EMOTIONS = [{ play: doBlinkOnce }, { play: doBlinkOnce }, { play: doBlinkOnce }, { play: doBlinkOnce }];
    const EXPRESSIVE_EMOTIONS = [{ play: doSmileOnce }, { play: doLaughOnce }, { play: doBlushOnce }];

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }

    let blinkQueue = shuffle(BLINK_EMOTIONS);
    let expressiveQueue = shuffle(EXPRESSIVE_EMOTIONS);

    function scheduleNextEmotion() {
      const delay = 900 + Math.random() * 2400;
      setTimeout(() => {
        if (blinkQueue.length === 0) blinkQueue = shuffle(BLINK_EMOTIONS);
        blinkQueue.shift().play();

        if (canDoExpressiveEmotion()) {
          if (expressiveQueue.length === 0) expressiveQueue = shuffle(EXPRESSIVE_EMOTIONS);
          if (Math.random() < 0.45) expressiveQueue.shift().play();
        }

        scheduleNextEmotion();
      }, delay);
    }

    function doBlinkOnce() {
      if (eyeLeft.classList.contains('blinking')) return;
      eyeLeft.classList.add('blinking'); eyeRight.classList.add('blinking');
      const doubleBlink = Math.random() < 0.3;
      setTimeout(() => {
        eyeLeft.classList.remove('blinking'); eyeRight.classList.remove('blinking');
        if (doubleBlink) setTimeout(() => {
          eyeLeft.classList.add('blinking'); eyeRight.classList.add('blinking');
          setTimeout(() => { eyeLeft.classList.remove('blinking'); eyeRight.classList.remove('blinking'); }, 90);
        }, 130);
      }, 100);
    }
    function doSmileOnce() {
      if (!canDoExpressiveEmotion()) return;
      characterEl.classList.add('smiling'); mouthEl.classList.add('mouth-wow');
      setTimeout(() => { characterEl.classList.remove('smiling'); mouthEl.classList.remove('mouth-wow'); }, 700 + Math.random() * 900);
    }
    function doLaughOnce() {
      if (!canDoExpressiveEmotion()) return;
      characterEl.classList.add('laughing'); mouthEl.classList.add('mouth-laugh');
      const laughTexts = ['HA!', 'HEHE!', 'HAHA!', '😄', 'HOHO!', '😂'];
      const laughCount = 3 + Math.floor(Math.random() * 3);
      const r = mouthEl.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top;
      for (let i = 0; i < laughCount; i++) setTimeout(() => {
        const t = document.createElement('div');
        t.className = 'laugh-text';
        t.textContent = laughTexts[Math.floor(Math.random() * laughTexts.length)];
        t.style.left = (cx + (Math.random() - 0.5) * 60) + 'px';
        t.style.top = (cy - Math.random() * 20) + 'px';
        document.body.appendChild(t); setTimeout(() => t.remove(), 1300);
      }, i * 180);
      setTimeout(() => { characterEl.classList.remove('laughing'); mouthEl.classList.remove('mouth-laugh'); }, 1000);
    }
    function doBlushOnce() {
      if (!canDoExpressiveEmotion()) return;
      characterEl.classList.add('blushing');
      setTimeout(() => characterEl.classList.remove('blushing'), 1400 + Math.random() * 1000);
    }
    scheduleNextEmotion();

    // ============================================================
    // EYE TRACKING
    // ============================================================
    const MAX_PUPIL_OFFSET = 8;
    function updateEyeTracking(targetX, targetY) {
      const eyeRect = eyeLeft.getBoundingClientRect();
      const eyeCenterX = eyeRect.left + eyeRect.width / 2;
      const eyeCenterY = eyeRect.top + eyeRect.height / 2;
      const dx = targetX - eyeCenterX, dy = targetY - eyeCenterY;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const scale = Math.min(1, dist / 250);
      const offX = (dx / dist) * MAX_PUPIL_OFFSET * scale;
      const offY = (dy / dist) * MAX_PUPIL_OFFSET * scale;
      pupilLeft.style.setProperty('--pupil-x', offX.toFixed(2) + 'px');
      pupilLeft.style.setProperty('--pupil-y', offY.toFixed(2) + 'px');
      pupilRight.style.setProperty('--pupil-x', offX.toFixed(2) + 'px');
      pupilRight.style.setProperty('--pupil-y', offY.toFixed(2) + 'px');
    }
    function resetEyeTracking() {
      pupilLeft.style.setProperty('--pupil-x', '0px');
      pupilLeft.style.setProperty('--pupil-y', '0px');
      pupilRight.style.setProperty('--pupil-x', '0px');
      pupilRight.style.setProperty('--pupil-y', '0px');

    // ============================================================
    // DRAG CHARACTER / TRAY
    // ============================================================
    function makeDraggable(wrapEl, keyPrefix) {
      let dragging = false;
      let startX = 0, startY = 0, startLeft = 0, startTop = 0;
      let dragPointerId = null;

      wrapEl.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.food-item')) return;
        if (e.target.closest('.drink-item')) return;
        if (e.target.closest('.photo-item')) return;
        if (e.target.closest('.blush')) return;
        if (e.target.closest('.mouth')) return;
        if (isBusy) return;
        if (keyPrefix === 'tray' && trayLocked) return;
        if (keyPrefix === 'char' && charLocked) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        e.preventDefault();
        e.stopPropagation();
        dragging = true;
        dragPointerId = e.pointerId;
        wrapEl.classList.add('dragging');

        const rect = wrapEl.getBoundingClientRect();
        const playRect = playAreaEl.getBoundingClientRect();
        startX = e.clientX; startY = e.clientY;
        startLeft = rect.left - playRect.left + rect.width / 2;
        startTop = rect.top - playRect.top + rect.height / 2;

        wrapEl.setPointerCapture(e.pointerId);
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
      });

      function onMove(e) {
        if (!dragging || e.pointerId !== dragPointerId) return;
        e.preventDefault();
        const dx = e.clientX - startX, dy = e.clientY - startY;
        const playRect = playAreaEl.getBoundingClientRect();
        const wrapRect = wrapEl.getBoundingClientRect();
        const halfW = wrapRect.width / 2, halfH = wrapRect.height / 2;
        let cx = Math.max(halfW, Math.min(playRect.width - halfW, startLeft + dx));
        let cy = Math.max(halfH, Math.min(playRect.height - halfH, startTop + dy));
        const centerX = playRect.width / 2, centerY = playRect.height / 2;
        const snappedX = Math.abs(cx - centerX) <= SNAP_DISTANCE;
        const snappedY = Math.abs(cy - centerY) <= SNAP_DISTANCE;
        if (snappedX) cx = centerX;
        if (snappedY) cy = centerY;
        if (snappedX) showSnapGuide('v'); else snapGuideVEl.classList.remove('active');
        if (snappedY) showSnapGuide('h'); else snapGuideHEl.classList.remove('active');
        wrapEl.style.left = cx + 'px';
        wrapEl.style.top = cy + 'px';
        layout[keyPrefix + 'X'] = cx / playRect.width;
        layout[keyPrefix + 'Y'] = cy / playRect.height;
        refreshPositionUI();
      }

      function onUp(e) {
        if (!dragging || e.pointerId !== dragPointerId) return;
        dragging = false; dragPointerId = null;
        wrapEl.classList.remove('dragging');
        hideSnapGuides();
        refreshPositionUI();
        scheduleSave();
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
      }
    }

    function clampWrapperInside(wrapEl, keyX, keyY) {
      const playRect = playAreaEl.getBoundingClientRect();
      const wrapRect = wrapEl.getBoundingClientRect();
      const halfW = wrapRect.width / 2, halfH = wrapRect.height / 2;
      let cx = wrapRect.left - playRect.left + wrapRect.width / 2;
      let cy = wrapRect.top - playRect.top + wrapRect.height / 2;
      cx = Math.max(halfW, Math.min(playRect.width - halfW, cx));
      cy = Math.max(halfH, Math.min(playRect.height - halfH, cy));
      wrapEl.style.left = cx + 'px';
      wrapEl.style.top = cy + 'px';
      layout[keyX] = cx / playRect.width;
      layout[keyY] = cy / playRect.height;
      refreshPositionUI();
    }

    function rectsOverlap(a, b) {
      return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
    }
    function isPointOverCharacterHead(clientX, clientY) {
      const charRect = characterWrapEl.getBoundingClientRect();
      return clientX >= charRect.left - 20 && clientX <= charRect.right + 20 &&
             clientY >= charRect.top - 100 && clientY <= charRect.top + charRect.height * 0.4 + 20;
    }

    function wirePreviewUpload(previewWrap, itemData, previewImg, urlInput, onUpdate) {
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      previewWrap.appendChild(fileInput);
      previewWrap.addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const dataUrl = ev.target.result;
          itemData.url = dataUrl;
          previewImg.src = dataUrl;
          urlInput.value = '';
          urlInput.placeholder = '📁 ' + file.name;
          scheduleSave();
          if (onUpdate) onUpdate(dataUrl);
        };
        reader.readAsDataURL(file);
        fileInput.value = '';
      });
    }

      });
      card.appendChild(row);
    }
    function wireDistanceSlider(card, itemData, onDistanceChange) {
      const row = document.createElement('div');
      row.className = 'distance-row';
      const initDist = (typeof itemData.distance === 'number') ? itemData.distance : 120;
      row.innerHTML = `<label>Dist</label><input type="range" min="0" max="300" step="5" value="${initDist}"><span class="distance-value">${initDist}px</span>`;
      const slider = row.querySelector('input[type="range"]');
      const valueEl = row.querySelector('.distance-value');
      slider.addEventListener('input', () => {
        const val = parseInt(slider.value, 10);
        itemData.distance = val;
        valueEl.textContent = val + 'px';
        scheduleSave();
        if (onDistanceChange) onDistanceChange(val);
      });
      card.appendChild(row);
    }
    function wirePositionRow(card, itemData, onPositionChange) {
      const row = document.createElement('div');
      row.className = 'position-row';
      const current = itemData.position || 'center';
      row.innerHTML = `
        <button class="pos-left ${current === 'left' ? 'active' : ''}">⬅ Left</button>
        <button class="pos-center ${current === 'center' ? 'active' : ''}">🎯 Center</button>
        <button class="pos-right ${current === 'right' ? 'active' : ''}">➡ Right</button>
      `;
      const l = row.querySelector('.pos-left'), c = row.querySelector('.pos-center'), r = row.querySelector('.pos-right');
      function setActive(pos) {
        l.classList.toggle('active', pos === 'left');
        c.classList.toggle('active', pos === 'center');
        r.classList.toggle('active', pos === 'right');
      }
      l.addEventListener('click', () => { itemData.position = 'left'; setActive('left'); scheduleSave(); if (onPositionChange) onPositionChange('left'); });
      c.addEventListener('click', () => { itemData.position = 'center'; setActive('center'); scheduleSave(); if (onPositionChange) onPositionChange('center'); });
      r.addEventListener('click', () => { itemData.position = 'right'; setActive('right'); scheduleSave(); if (onPositionChange) onPositionChange('right'); });
      card.appendChild(row);
    }

        return;
      }
      if (bg.url && bg.url.length > 0) {
        playAreaEl.style.backgroundColor = bg.color || '#fbe9d2';
        playAreaEl.style.backgroundImage = `url("${bg.url}")`;
        playAreaEl.style.backgroundSize = 'cover';
        playAreaEl.style.backgroundPosition = 'center';
        playAreaEl.style.backgroundRepeat = 'no-repeat';
