<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍜 mukbang · photo edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif;
      background: #2b1b0e;
    }

    .app {
      display: grid;
      grid-template-columns: 20% 80%;
      width: 100vw;
      height: 100vh;
      transition: grid-template-columns 0.3s ease;
    }

    .app.sidebar-hidden {
      grid-template-columns: 0% 100%;
    }

    /* ================= SIDEBAR ================= */
    .sidebar {
      background: linear-gradient(180deg, #3a2414 0%, #241609 100%);
      border-right: 3px solid #b48c5c;
      padding: 18px 14px;
      overflow-y: auto;
      overflow-x: hidden;
      color: #fbe9d2;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: padding 0.3s ease, border-color 0.3s ease;
    }

    .app.sidebar-hidden .sidebar {
      padding: 0;
      border-right: none;
      overflow: hidden;
    }

    .sidebar::-webkit-scrollbar { width: 8px; }
    .sidebar::-webkit-scrollbar-track { background: #241609; }
    .sidebar::-webkit-scrollbar-thumb { background: #7a5733; border-radius: 4px; }

    .side-title {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffcf9e;
      padding-bottom: 6px;
      border-bottom: 2px solid #7a5733;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }

    .food-editor {
      background: #4a2e1a;
      border: 2px solid #6e4a24;
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .food-editor.drink-editor {
      border-color: #4a7ba5;
      background: #2e3d4a;
    }

    .food-editor.photo-editor {
      border-color: #7a4a8f;
      background: #3a2a4a;
    }

    .food-editor.background-editor {
      border-color: #4a8f7a;
      background: #2a3d3a;
    }

    .food-editor .preview-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .food-editor .preview-wrap {
      position: relative;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      background-image:
        linear-gradient(45deg, #3a2a1a 25%, transparent 25%),
        linear-gradient(-45deg, #3a2a1a 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #3a2a1a 75%),
        linear-gradient(-45deg, transparent 75%, #3a2a1a 75%);
      background-size: 8px 8px;
      background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
      background-color: #2b1b0e;
      transition: transform 0.1s;
      border: none;
    }

    .food-editor .preview-wrap:hover {
      transform: scale(1.05);
    }

    .food-editor .preview-wrap::after {
      content: '📁';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
      font-size: 1.1rem;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }

    .food-editor .preview-wrap:hover::after {
      opacity: 1;
    }

    .food-editor .preview {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      border: none;
      box-shadow: none;
      background: transparent;
    }

    .food-editor .preview-wrap input[type="file"] {
      display: none;
    }

    .food-editor .name-input {
      flex: 1;
      min-width: 0;
      background: #2b1b0e;
      border: 2px solid #6e4a24;
      border-radius: 8px;
      color: #fbe9d2;
      padding: 5px 7px;
      font-size: 0.8rem;
      font-family: inherit;
      font-weight: 600;
    }

    .food-editor .name-input:focus { outline: none; border-color: #ffcf9e; }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 2px solid #6e4a24;
      background: #2b1b0e;
      color: #ffcf9e;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
      transition: 0.1s;
      font-family: inherit;
    }

    .icon-btn:hover { background: #6e4a24; color: #fff5e6; }
    .icon-btn.add { border-color: #4a8f4a; color: #a8e6a8; }
    .icon-btn.add:hover { background: #4a8f4a; color: #fff; }
    .icon-btn.delete { border-color: #8f2a2a; color: #ff9e9e; }
    .icon-btn.delete:hover { background: #8f2a2a; color: #fff; }

    .url-input {
      width: 100%;
      background: #2b1b0e;
      border: 2px solid #6e4a24;
      border-radius: 8px;
      color: #d6b28a;
      padding: 5px 7px;
      font-size: 0.65rem;
      font-family: monospace;
    }

    .url-input:focus { outline: none; border-color: #ffcf9e; color: #fbe9d2; }

    .size-row, .angle-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #ffcf9e;
    }

    .size-row label, .angle-row label {
      flex-shrink: 0;
      width: 30px;
    }

    .size-row input[type="range"], .angle-row input[type="range"] {
      flex: 1;
      accent-color: #ffcf9e;
    }

    .size-row .size-value, .angle-row .angle-value {
      flex-shrink: 0;
      width: 42px;
      text-align: right;
      font-family: monospace;
      color: #fff5e6;
      font-size: 0.7rem;
    }

    .chopstick-row {
      display: flex;
      gap: 6px;
      font-size: 0.7rem;
    }

    .chopstick-row button {
      flex: 1;
      padding: 5px;
      border-radius: 8px;
      border: 2px solid #6e4a24;
      background: #2b1b0e;
      color: #d6b28a;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.5px;
      font-size: 0.7rem;
      transition: 0.12s;
    }

    .chopstick-row button:hover {
      background: #5a381f;
    }

    .chopstick-row button.active {
      background: #8a5f30;
      color: #fbe9d2;
      border-color: #ffcf9e;
    }

    .chopstick-row button.toggle-chopsticks.active {
      background: #b06a2a;
      border-color: #ffcf9e;
    }

    /* hat position row for photos */
    .position-row {
      display: flex;
      gap: 6px;
      font-size: 0.7rem;
    }

    .position-row button {
      flex: 1;
      padding: 5px;
      border-radius: 8px;
      border: 2px solid #6e4a24;
      background: #2b1b0e;
      color: #d6b28a;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.5px;
      font-size: 0.7rem;
      transition: 0.12s;
    }

    .position-row button:hover {
      background: #5a381f;
    }

    .position-row button.active {
      background: #7a4a8f;
      color: #fbe9d2;
      border-color: #ffcf9e;
    }

    /* Simple label + color picker row (used inside editors) */
    .color-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #ffcf9e;
    }

    .color-row label {
      flex-shrink: 0;
      width: 46px;
    }

    .color-row input[type="color"] {
      flex: 1;
      height: 26px;
      border-radius: 6px;
      border: 2px solid #6e4a24;
      background: #2b1b0e;
      cursor: pointer;
      padding: 0;
    }

    .drink-tag {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #8ac0e6;
      background: rgba(74, 123, 165, 0.2);
      border: 1px solid #4a7ba5;
      border-radius: 6px;
      padding: 3px 6px;
      text-align: center;
    }

    .photo-tag {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #d8a8e6;
      background: rgba(122, 74, 143, 0.2);
      border: 1px solid #7a4a8f;
      border-radius: 6px;
      padding: 3px 6px;
      text-align: center;
    }

    .background-tag {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #8ae6c1;
      background: rgba(74, 143, 122, 0.2);
      border: 1px solid #4a8f7a;
      border-radius: 6px;
      padding: 3px 6px;
      text-align: center;
    }

    .char-editor, .tray-editor {
      background: #4a2e1a;
      border: 2px solid #6e4a24;
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .char-editor .row, .tray-editor .row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .char-editor label, .tray-editor label {
      flex-shrink: 0;
      width: 60px;
      color: #ffcf9e;
    }

    .char-editor input[type="color"],
    .tray-editor input[type="color"] {
      width: 40px;
      height: 30px;
      border: 2px solid #6e4a24;
      border-radius: 6px;
      background: #2b1b0e;
      cursor: pointer;
      padding: 0;
    }

    .char-editor input[type="range"], .tray-editor input[type="range"] {
      flex: 1; accent-color: #ffcf9e;
    }

    /* ================= SOUNDS EDITOR ================= */
    .sound-editor {
      background: #2a3d4a;
      border: 2px solid #4a7ba5;
      border-radius: 14px;
      padding: 8px 8px 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sound-editor .sound-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sound-editor .sound-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .sound-editor .sound-label {
      flex: 1;
      font-size: 0.72rem;
      font-weight: 800;
      color: #b8dcf5;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sound-editor .sound-count {
      font-size: 0.62rem;
      font-family: monospace;
      background: rgba(138, 192, 230, 0.2);
      color: #8ac0e6;
      border: 1px solid #4a7ba5;
      border-radius: 6px;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .sound-editor .sound-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 130px;
      overflow-y: auto;
    }

    .sound-editor .sound-list::-webkit-scrollbar { width: 6px; }
    .sound-editor .sound-list::-webkit-scrollbar-track { background: #1e2a33; }
    .sound-editor .sound-list::-webkit-scrollbar-thumb { background: #4a7ba5; border-radius: 3px; }

    .sound-editor .sound-empty {
      font-size: 0.65rem;
      color: #5a7a8f;
      font-style: italic;
      text-align: center;
      padding: 4px 0;
    }

    .sound-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1e2a33;
      border: 1px solid #35506a;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 0.65rem;
      color: #d4e8f5;
    }

    .sound-row .sound-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
      cursor: pointer;
    }

    .sound-row .sound-name:hover {
      color: #ffcf9e;
      text-decoration: underline;
    }

    .sound-row .sound-play {
      background: none;
      border: none;
      color: #8ac0e6;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0 2px;
      line-height: 1;
    }

    .sound-row .sound-play:hover { color: #ffcf9e; }

    .sound-row .sound-del {
      background: none;
      border: none;
      color: #ff9e9e;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0 2px;
      line-height: 1;
      font-weight: 800;
    }

    .sound-row .sound-del:hover { color: #fff; }

    .sound-editor .sound-add-btn {
      width: 100%;
      padding: 5px;
      border-radius: 8px;
      border: 2px dashed #4a7ba5;
      background: rgba(74, 123, 165, 0.15);
      color: #8ac0e6;
      font-weight: 800;
      font-family: inherit;
      font-size: 0.68rem;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: 0.12s;
    }

    .sound-editor .sound-add-btn:hover {
      background: rgba(74, 123, 165, 0.35);
      color: #d4e8f5;
      border-style: solid;
    }

    /* ================= PLAY AREA ================= */
    .play-area {
      display: flex;
      flex-direction: column;
      background-color: #fbe9d2;
      background-image: radial-gradient(circle at 50% 20%, #fff5e6, #f0d5b0);
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .character-wrap {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      cursor: grab;
      touch-action: none;
      z-index: 2;
    }

    .character-wrap.dragging {
      cursor: grabbing;
      z-index: 100;
    }

    .character {
      --base-scale: 1.4;
      --user-scale: 1;

      background: #ffdbb5;
      border-radius: 180px 180px 120px 120px;
      padding: 32px 60px 18px 60px;
      box-shadow: 0 16px 0 #b48c5c, 0 30px 38px rgba(0, 0, 0, 0.32);
      border: 6px solid #a77b4b;
      transition: transform 0.15s ease;
      position: relative;
      transform-origin: center bottom;
      transform: scale(calc(var(--base-scale) * var(--user-scale)));
    }

    .character.chewing { animation: chew 0.28s ease-in-out infinite; }
    @keyframes chew {
      0%   { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(0) scale(1, 1); }
      50%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(-3px) scale(1.02, 0.97); }
      100% { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(0) scale(1, 1); }
    }

    .character.sipping { animation: sip 0.9s ease-in-out infinite; }
    @keyframes sip {
      0%   { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1, 1); }
      50%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1.005, 0.998); }
      100% { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1, 1); }
    }

    .character.swallowing { animation: swallow 0.45s cubic-bezier(0.4, 0, 0.6, 1); }
    @keyframes swallow {
      0%   { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1, 1); }
      30%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(0.94, 1.06) translateY(3px); }
      55%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1.03, 0.94) translateY(-3px); }
      100% { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1, 1); }
    }

    .character.burping { animation: burp 0.75s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes burp {
      0%   { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1, 1) translateY(0); }
      15%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1.08, 0.94) translateY(-10px); }
      30%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(0.96, 1.05) translateY(4px); }
      50%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1.04, 0.98) translateY(-4px); }
      70%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(0.99, 1.01) translateY(2px); }
      100% { transform: scale(calc(var(--base-scale) * var(--user-scale))) scale(1, 1) translateY(0); }
    }

    .character.laughing { animation: laugh 0.32s ease-in-out infinite; }
    @keyframes laugh {
      0%   { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(0) rotate(0deg); }
      25%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(-6px) rotate(-2deg); }
      50%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(0) rotate(0deg); }
      75%  { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(-6px) rotate(2deg); }
      100% { transform: scale(calc(var(--base-scale) * var(--user-scale))) translateY(0) rotate(0deg); }
    }

    .mouth.mouth-happy {
      height: 60px;
      width: 118px;
      border-radius: 0 0 80px 80px;
      background: #d14a4a;
      box-shadow: inset 0 -12px 0 #7e2a2a;
    }

    .blush {
      position: absolute;
      width: 40px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 140, 160, 0.75), rgba(255, 140, 160, 0));
      opacity: 0;
      pointer-events: none;
      transform: scale(0.4);
      transition: opacity 0.4s ease, transform 0.4s ease;
      filter: blur(2px);
    }

    .blush.left  { left: 2px;  top: 42%; }
    .blush.right { right: 2px; top: 42%; }

    .character.blushing .blush {
      opacity: 1;
      transform: scale(1.1);
    }

    .character.blushing .eye {
      transform: scaleY(0.3);
      transition: transform 0.15s ease-in-out;
    }

    .face { position: relative; display: flex; flex-direction: column; align-items: center; }
    .eyes { display: flex; gap: 52px; margin-bottom: 12px; }

    .eye {
      width: 40px;
      height: 40px;
      background: #3b2a1c;
      border-radius: 50%;
      position: relative;
      box-shadow: inset -6px -6px 0 #1f140e, 0 5px 0 #6b4f32;
      transition: transform 0.12s ease-in-out;
      transform-origin: center center;
      overflow: hidden;
    }

    .eye .pupil {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 14px;
      height: 14px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 6px white;
      transform: translate(var(--pupil-x, 0px), var(--pupil-y, 0px));
      transition: transform 0.08s linear;
      will-change: transform;
      pointer-events: none;
    }

    .eye.blinking { transform: scaleY(0.08); }
    .character.eating .eye { transform: scaleY(0.55); }

    .character.smiling .eye {
      transform: scaleY(0.35);
      transition: transform 0.15s ease-in-out;
    }

    .character.sipping .eye {
      transform: scaleY(0.28);
      transition: transform 0.15s ease-in-out;
    }

    .character.laughing .eye {
      transform: scaleY(0.1);
      transition: transform 0.15s ease-in-out;
    }

    .mouth {
      width: 100px;
      height: 44px;
      background: #b13e3e;
      border-radius: 0 0 60px 60px;
      border: 5px solid #6e2a2a;
      border-top: none;
      margin-top: 6px;
      transition: height 0.18s ease-in-out, width 0.18s ease-in-out,
                  border-radius 0.18s ease-in-out, box-shadow 0.18s ease-in-out,
                  margin-top 0.18s ease-in-out;
      box-shadow: inset 0 -9px 0 #7e2a2a;
      position: relative;
      overflow: hidden;
      transform-origin: center top;
    }

    .mouth.mouth-open {
      height: 88px;
      width: 138px;
      background: #d14a4a;
      border-radius: 0 0 75px 75px;
      box-shadow: inset 0 -12px 0 #7e2a2a, 0 0 28px #ff8f8f;
    }

    .mouth.mouth-wow {
      height: 50px;
      width: 50px;
      border-radius: 50%;
      background: #a83434;
      box-shadow: inset 0 -8px 0 #7e2a2a, 0 0 12px rgba(255, 143, 143, 0.5);
      margin-top: 6px;
      border: 5px solid #6e2a2a;
    }

    .mouth.mouth-laugh {
      height: 70px;
      width: 110px;
      border-radius: 0 0 70px 70px;
      background: #d14a4a;
      box-shadow: inset 0 -14px 0 #7e2a2a;
    }

    .mouth.mouth-chew { animation: mouthChew 0.28s ease-in-out infinite; }
    @keyframes mouthChew {
      0%   { height: 50px; width: 104px; border-radius: 0 0 60px 60px; }
      50%  { height: 32px; width: 114px; border-radius: 0 0 42px 42px; }
      100% { height: 50px; width: 104px; border-radius: 0 0 60px 60px; }
    }

    .mouth.mouth-swallow { animation: mouthSwallow 0.45s ease-in-out; }
    @keyframes mouthSwallow {
      0%   { height: 50px; width: 104px; border-radius: 0 0 60px 60px; }
      40%  { height: 24px; width: 60px;  border-radius: 0 0 30px 30px; }
      70%  { height: 32px; width: 46px;  border-radius: 0 0 22px 22px; }
      100% { height: 44px; width: 100px; border-radius: 0 0 60px 60px; }
    }

    .mouth.mouth-burp { animation: mouthBurp 0.75s ease-in-out; }
    @keyframes mouthBurp {
      0%   { height: 44px; width: 100px; border-radius: 0 0 60px 60px; }
      20%  { height: 95px; width: 130px; border-radius: 50% 50% 60px 60px; }
      55%  { height: 80px; width: 118px; border-radius: 50% 50% 60px 60px; }
      100% { height: 44px; width: 100px; border-radius: 0 0 60px 60px; }
    }

    .mouth.mouth-sip-bubble { animation: sipBubble 0.55s ease-in-out infinite; }
    @keyframes sipBubble {
      0%   { height: 50px; width: 50px; }
      50%  { height: 44px; width: 44px; }
      100% { height: 50px; width: 50px; }
    }

    .mouth::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 40%;
      background: #e86a6a;
      border-radius: 50% 50% 0 0;
      opacity: 0.7;
      pointer-events: none;
    }

    .mouth.hint::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      background: #ffb3b3;
      border-radius: 50%;
      animation: pulseHint 0.7s infinite alternate;
      z-index: 2;
    }

    @keyframes pulseHint {
      from { opacity: 0.4; transform: translateX(-50%) scale(0.8); }
      to { opacity: 1; transform: translateX(-50%) scale(1.3); }
    }

    .head-drop-indicator {
      position: absolute;
      top: -140px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 4px dashed #d8a8e6;
      background: radial-gradient(circle, rgba(216, 168, 230, 0.25), rgba(216, 168, 230, 0.05));
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #d8a8e6;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .head-drop-indicator::after {
      content: '🎩';
      font-size: 2.4rem;
      opacity: 0.8;
    }

    .head-drop-indicator.active {
      opacity: 1;
      animation: pulseHead 1s ease-in-out infinite;
    }

    .head-drop-indicator.hovering {
      transform: translateX(-50%) scale(1.1);
      border-color: #ffcf9e;
      background: radial-gradient(circle, rgba(255, 207, 158, 0.35), rgba(255, 207, 158, 0.1));
    }

    @keyframes pulseHead {
      0%, 100% { border-color: #d8a8e6; }
      50% { border-color: #ffcf9e; }
    }

    .cheek-bulge {
      position: absolute;
      width: 34px;
      height: 34px;
      background: rgba(255, 180, 120, 0.7);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      box-shadow: inset -4px -4px 0 rgba(200, 130, 70, 0.5);
    }

    .cheek-bulge.left { left: 8px; top: 50%; transform: translateY(-50%); }
    .cheek-bulge.right { right: 8px; top: 50%; transform: translateY(-50%); }

    .character.chewing .cheek-bulge { animation: bulge 0.28s ease-in-out infinite; }
    .character.chewing .cheek-bulge.right { animation-delay: 0.14s; }

    @keyframes bulge {
      0%, 100% { opacity: 0; transform: translateY(-50%) scale(0.6); }
      50%      { opacity: 1; transform: translateY(-50%) scale(1); }
    }

    .tray-wrap {
      position: absolute;
      top: 75%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
      z-index: 1;
    }

    .tray-wrap.dragging {
      cursor: grabbing;
      z-index: 100;
    }

    .tray {
      width: 640px;
      height: 320px;
      background: linear-gradient(145deg, #b48b5c, #8f623a);
      border-radius: 60px 60px 40px 40px;
      box-shadow: 0 14px 0 #6b4b2c, inset 0 8px 12px rgba(255, 255, 200, 0.4);
      border: 4px solid #7a5733;
      position: relative;
      transition: background 0.2s, border-color 0.2s;
    }

    .drink-item {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      touch-action: none;
      transition: filter 0.15s;
      z-index: 3;
    }

    .drink-item:hover:not(.dragging):not(.eaten) {
      z-index: 10;
    }

    .drink-item:active:not(.dragging) { cursor: grabbing; }

    .drink-item.dragging {
      cursor: grabbing;
      z-index: 2147483646 !important;
      transition: none;
      pointer-events: none;
      position: fixed !important;
    }

    .drink-item.eating-now {
      pointer-events: none;
      z-index: 2147483646 !important;
      position: fixed !important;
    }

    .drink-img {
      object-fit: contain;
      pointer-events: none;
      display: block;
      border: none;
      box-shadow: none;
      background: transparent;
    }

    .photo-item {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      touch-action: none;
      transition: filter 0.15s;

    }

    .photo-item:hover:not(.dragging) {
      z-index: 10;
    }

    .photo-item:active:not(.dragging) { cursor: grabbing; }

    .photo-item.dragging {
      cursor: grabbing;
      z-index: 2147483646 !important;
      transition: none;
      pointer-events: none;
      position: fixed !important;
    }

    .photo-item.photo-attached {
      position: absolute;

      transform-origin: center bottom;
      z-index: 5;
      cursor: grab;
    }

    .photo-img {
      object-fit: contain;
      pointer-events: none;
      display: block;
      border: none;

      transform-origin: center center;
    }

    .food-item {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      touch-action: none;
      transition: filter 0.15s;
      z-index: 4;
    }

    .food-item:hover:not(.dragging):not(.eaten) {
      z-index: 10;
    }

    .food-item.dragging {
      cursor: grabbing;
      z-index: 2147483646 !important;
      transition: none;
      pointer-events: none;
      position: fixed !important;
    }

      transition: transform 0.5s cubic-bezier(0.55, 0, 1, 0.45),
                  opacity 0.5s ease-in;

      z-index: 2147483646 !important;
      position: fixed !important;
    }

    .food-item.eaten {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    .food-img {
      object-fit: contain;
      pointer-events: none;
      display: block;
      border: none;
      box-shadow: none;
      background: transparent;
    }

    .chopstick-single {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      opacity: 0;
      will-change: transform, left, top, opacity;
      transform-origin: 50% 100%;
      isolation: isolate;
      rotate: -30deg;
      transform: translate(-50%, -100%) translateY(160px) scale(0.85);
      transition: transform 0.35s cubic-bezier(0.34, 1.3, 0.64, 1),
                  opacity 0.25s ease-out;
    }

    .chopstick-single.active {
      opacity: 1;
      transform: translate(-50%, -100%) translateY(0) scale(1);
    }

    .chopstick-single.instant-hide {
      transition: none !important;
    }

    .chopstick-back-float {
      z-index: 3;
    }
    .chopstick-front-float {
      z-index: 2147483647;
    }
    .chopstick-back-float.dragging-back {
      z-index: 2147483645;
    }
    .chopstick-front-float.dragging-front {
      z-index: 2147483647;
    }

    .chopstick-single .chopstick {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 9px;
      height: 160px;
      background: linear-gradient(to bottom,
        #e8bd7f 0%,
        #d6a15f 25%,
        #b8834a 60%,
        #8a5f30 100%);
      border-radius: 5px 5px 3px 3px;
      box-shadow:
        inset -2px 0 0 #6e4a24,
        inset 2px 0 0 #f0c48a,
        0 4px 8px rgba(0, 0, 0, 0.35);
      transform-origin: 50% 100%;
    }

    .chopstick-single .chopstick::before {
      content: '';
      position: absolute;
      left: 3px;
      top: 10%;
      width: 1px;
      height: 80%;
      background: rgba(110, 74, 36, 0.4);
      border-radius: 2px;
    }

    .chopstick-back-float .chopstick {
      transform: translateX(-50%) rotate(-10deg);
    }
    .chopstick-front-float .chopstick {
      transform: translateX(-50%) rotate(10deg);
    }

    .chopstick-back-float.holding .chopstick {
      transform: translateX(-50%) rotate(-4deg);
    }
    .chopstick-front-float.holding .chopstick {
      transform: translateX(-50%) rotate(4deg);
    }

    .chopstick-back-float.pinching .chopstick {
      animation: chopPinchBack 0.22s ease-out;
    }
    .chopstick-front-float.pinching .chopstick {
      animation: chopPinchFront 0.22s ease-out;
    }

    @keyframes chopPinchBack {
      0%   { transform: translateX(-50%) rotate(-10deg); }
      60%  { transform: translateX(-50%) rotate(-2deg); }
      100% { transform: translateX(-50%) rotate(-4deg); }
    }
    @keyframes chopPinchFront {
      0%   { transform: translateX(-50%) rotate(10deg); }
      60%  { transform: translateX(-50%) rotate(2deg); }
      100% { transform: translateX(-50%) rotate(4deg); }
    }

    .chopstick-single.sliding-away {
      transition: transform 0.5s ease-in, opacity 0.4s ease-in 0.1s;
      transform: translate(-50%, 0) translateY(120vh) rotate(-30deg);
      opacity: 0;
    }

    .sparkle {
      position: fixed;
      pointer-events: none;
      font-size: 1.4rem;
      animation: sparkleOut 0.6s ease-out forwards;
      z-index: 2147483645;
    }

    @keyframes sparkleOut {
      0% { opacity: 1; transform: scale(0.5) rotate(0deg); }
      100% { opacity: 0; transform: scale(1.8) rotate(30deg) translateY(-40px); }
    }

    .crumb {
      position: fixed;
      pointer-events: none;
      font-size: 0.8rem;
      z-index: 2147483645;
      animation: crumbFly 0.55s ease-out forwards;
    }

    @keyframes crumbFly {
      0%   { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--cx), var(--cy)) scale(0.3); }
    }

    .fizz {
      position: fixed;
      pointer-events: none;
      font-size: 1.3rem;
      z-index: 2147483645;
      animation: fizzRise 0.9s ease-out forwards;
    }

    @keyframes fizzRise {
      0%   { opacity: 0; transform: translate(-50%, 0) scale(0.4); }
      20%  { opacity: 1; transform: translate(-50%, -10px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -65px) scale(1.4); }
    }

    .burp-bubble {
      position: fixed;
      pointer-events: none;
      font-size: 2rem;
      animation: burpFloat 1.4s ease-out forwards;
      z-index: 2147483645;
    }

    @keyframes burpFloat {
      0%   { opacity: 0; transform: translate(-50%, 0) scale(0.3); }
      15%  { opacity: 1; transform: translate(-50%, -10px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -120px) scale(1.6); }
    }

    .burp-text {
      position: fixed;
      pointer-events: none;
      font-weight: 900;
      font-size: 1.6rem;
      color: #fff5e6;
      text-shadow: 2px 2px 0 #6e4a24, -1px -1px 0 #2b1b0e, 0 0 12px #ffcf9e;
      animation: burpText 1.5s ease-out forwards;
      z-index: 2147483645;
      font-family: 'Segoe UI', system-ui, sans-serif;
      letter-spacing: 2px;
    }

    @keyframes burpText {
      0%   { opacity: 0; transform: translate(-50%, 0) scale(0.5) rotate(-8deg); }
      20%  { opacity: 1; transform: translate(-50%, -20px) scale(1.15) rotate(-4deg); }
      60%  { opacity: 1; transform: translate(-50%, -60px) scale(1.05) rotate(2deg); }
      100% { opacity: 0; transform: translate(-50%, -110px) scale(1.2) rotate(6deg); }
    }

    .laugh-text {
      position: fixed;
      pointer-events: none;
      font-weight: 900;
      font-size: 1.4rem;
      color: #fff5e6;
      text-shadow: 2px 2px 0 #b06a2a, -1px -1px 0 #6e4a24, 0 0 10px #ffcf9e;
      animation: laughText 1.2s ease-out forwards;
      z-index: 2147483645;
      font-family: 'Segoe UI', system-ui, sans-serif;
      letter-spacing: 1px;
    }

    @keyframes laughText {
      0%   { opacity: 0; transform: translate(-50%, 0) scale(0.5) rotate(-10deg); }
      25%  { opacity: 1; transform: translate(-50%, -25px) scale(1.2) rotate(4deg); }
      60%  { opacity: 1; transform: translate(-50%, -55px) scale(1.05) rotate(-3deg); }
      100% { opacity: 0; transform: translate(-50%, -95px) scale(1.15) rotate(6deg); }
    }
  </style>
</head>

<script>
  (function() {
    function uid() { return 'x_' + Math.random().toString(36).substr(2, 9); }

    // ============================================================
    // SOUND SYSTEM — IndexedDB storage, in-app upload, shuffle bag
    // ============================================================
    // Audio file extensions accepted in the file picker.
    // This works better on iPadOS/iOS where `audio/*` alone is unreliable.
    const AUDIO_ACCEPT = 'audio/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.opus,.flac,.mp4,.m4b,.caf,.aiff,.aif,.weba';

    const SOUND_EMOTIONS = [
      { key: 'blink',      label: 'Blink',       icon: '👁️' },
      { key: 'smile',      label: 'Smile',       icon: '😊' },
      { key: 'laugh',      label: 'Laugh',       icon: '😂' },
      { key: 'blush',      label: 'Blush',       icon: '😳' },
      { key: 'eating',     label: 'Eating',      icon: '🍽️' },
      { key: 'swallowing', label: 'Swallowing',  icon: '😮‍💨' },
      { key: 'burping',    label: 'Burping',     icon: '💨' },
      { key: 'sipping',    label: 'Sipping',     icon: '🥤' }
    ];

    let soundDB = null;
    const soundCache = {};          // { emotion: [ {id, name, url}, ... ] }
    const soundBags  = {};          // { emotion: [soundId, ...] shuffled }

    function openSoundDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('mukbang_sounds', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('sounds')) {
            const store = db.createObjectStore('sounds', { keyPath: 'id' });
            store.createIndex('emotion', 'emotion', { unique: false });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function dbGetAll() {
      return new Promise((resolve, reject) => {
        const tx = soundDB.transaction('sounds', 'readonly');
        const req = tx.objectStore('sounds').getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function dbAdd(record) {
      return new Promise((resolve, reject) => {
        const tx = soundDB.transaction('sounds', 'readwrite');
        const req = tx.objectStore('sounds').put(record);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function dbDelete(id) {
      return new Promise((resolve, reject) => {
        const tx = soundDB.transaction('sounds', 'readwrite');
        const req = tx.objectStore('sounds').delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function loadAllSounds() {
      const rows = await dbGetAll();
      SOUND_EMOTIONS.forEach(e => { soundCache[e.key] = []; });
      rows.forEach(r => {
        if (!soundCache[r.emotion]) soundCache[r.emotion] = [];
        const url = URL.createObjectURL(r.blob);
        soundCache[r.emotion].push({ id: r.id, name: r.name, url });
      });
      SOUND_EMOTIONS.forEach(e => { soundBags[e.key] = []; });
    }

    function shuffleArr(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function playSound(emotionKey) {
      const list = soundCache[emotionKey];
      if (!list || list.length === 0) return;

      if (!soundBags[emotionKey] || soundBags[emotionKey].length === 0) {
        soundBags[emotionKey] = shuffleArr(list.map(s => s.id));
      }
      const id = soundBags[emotionKey].shift();
      const entry = list.find(s => s.id === id);
      if (!entry) return;
      const audio = new Audio(entry.url);
      audio.volume = 0.85;
      audio.play().catch(() => { /* autoplay blocked until first user interaction */ });
    }

    // ============================================================
    // SOUND UI BUILDER
    // ============================================================
    const soundEditorsEl = document.getElementById('soundEditors');

    function buildSoundEditors() {
      soundEditorsEl.innerHTML = '';
      SOUND_EMOTIONS.forEach(emotion => {
        const list = soundCache[emotion.key] || [];

        const card = document.createElement('div');
        card.className = 'sound-editor';
        card.dataset.emotion = emotion.key;

        const head = document.createElement('div');
        head.className = 'sound-head';
        head.innerHTML = `
          <span class="sound-icon">${emotion.icon}</span>
          <span class="sound-label">${emotion.label}</span>
          <span class="sound-count">${list.length}</span>
        `;
        card.appendChild(head);

        const listEl = document.createElement('div');
        listEl.className = 'sound-list';

        if (list.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'sound-empty';
          empty.textContent = 'No sounds yet';
          listEl.appendChild(empty);
        } else {
          list.forEach(sound => {
            const row = document.createElement('div');
            row.className = 'sound-row';

            const nameEl = document.createElement('span');
            nameEl.className = 'sound-name';
            nameEl.textContent = sound.name;
            nameEl.title = 'Click to preview';
            nameEl.addEventListener('click', () => {
              const a = new Audio(sound.url);
              a.volume = 0.85;
              a.play().catch(() => {});
            });

            const playBtn = document.createElement('button');
            playBtn.className = 'sound-play';
            playBtn.title = 'Preview';
            playBtn.textContent = '▶';
            playBtn.addEventListener('click', () => {
              const a = new Audio(sound.url);
              a.volume = 0.85;
              a.play().catch(() => {});
            });

            const delBtn = document.createElement('button');
            delBtn.className = 'sound-del';
            delBtn.title = 'Delete';
            delBtn.textContent = '✕';
            delBtn.addEventListener('click', async () => {
              await dbDelete(sound.id);
              URL.revokeObjectURL(sound.url);
              await loadAllSounds();
              buildSoundEditors();
            });

    const EMOTION_BUSY_CLASSES = ['eating', 'smiling', 'burping', 'sipping', 'laughing', 'blushing'];

    function isCharacterFree() {
      if (isBusy) return false;
      for (const c of EMOTION_BUSY_CLASSES) {
        if (characterEl.classList.contains(c)) return false;
      }
      return true;

    const EMOTIONS = [
      { name: 'blink',  play: doBlinkOnce },
      { name: 'blink',  play: doBlinkOnce },
      { name: 'blink',  play: doBlinkOnce },
      { name: 'blink',  play: doBlinkOnce },

      { name: 'laugh',  play: doLaughOnce },
      { name: 'blush',  play: doBlushOnce }
    ];

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    let emotionQueue = shuffle(EMOTIONS);

    function scheduleNextEmotion() {
      const delay = 900 + Math.random() * 2400;
      setTimeout(() => {
        if (!isCharacterFree()) {
          scheduleNextEmotion();
          return;
        }
        if (emotionQueue.length === 0) {
          emotionQueue = shuffle(EMOTIONS);
        }
        const emotion = emotionQueue.shift();
        emotion.play();
        scheduleNextEmotion();
      }, delay);
    }

      eyeLeft.classList.add('blinking');

            setTimeout(() => {

    const MAX_PUPIL_OFFSET = 8;

    function updateEyeTracking(targetX, targetY) {
      const eyeRect = eyeLeft.getBoundingClientRect();
      const eyeCenterX = eyeRect.left + eyeRect.width / 2;
      const eyeCenterY = eyeRect.top + eyeRect.height / 2;

      const dx = targetX - eyeCenterX;
      const dy = targetY - eyeCenterY;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;

      const scale = Math.min(1, dist / 250);
      const offX = (dx / dist) * MAX_PUPIL_OFFSET * scale;
      const offY = (dy / dist) * MAX_PUPIL_OFFSET * scale;

      pupilLeft.style.setProperty('--pupil-x', offX.toFixed(2) + 'px');
      pupilLeft.style.setProperty('--pupil-y', offY.toFixed(2) + 'px');
      pupilRight.style.setProperty('--pupil-x', offX.toFixed(2) + 'px');
      pupilRight.style.setProperty('--pupil-y', offY.toFixed(2) + 'px');
    }

      pupilLeft.style.setProperty('--pupil-x', '0px');

    // ============================================================
    // DRAG CHARACTER / TRAY
    // ============================================================
    function makeDraggable(wrapEl, keyPrefix) {
      let dragging = false;
      let startX = 0, startY = 0;
      let startLeft = 0, startTop = 0;
      let dragPointerId = null;

      wrapEl.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.food-item')) return;
        if (e.target.closest('.drink-item')) return;
        if (e.target.closest('.photo-item')) return;
        if (e.target.closest('.head-drop-indicator')) return;
        if (e.target.closest('.blush')) return;
        if (isBusy) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        e.preventDefault();
        e.stopPropagation();
        dragging = true;
        dragPointerId = e.pointerId;
        wrapEl.classList.add('dragging');

        const rect = wrapEl.getBoundingClientRect();
        const playRect = playAreaEl.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        startLeft = rect.left - playRect.left + rect.width / 2;
        startTop = rect.top - playRect.top + rect.height / 2;

        wrapEl.setPointerCapture(e.pointerId);
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
      });

      function onMove(e) {
        if (!dragging || e.pointerId !== dragPointerId) return;
        e.preventDefault();
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const playRect = playAreaEl.getBoundingClientRect();
        const wrapRect = wrapEl.getBoundingClientRect();
        const halfW = wrapRect.width / 2;
        const halfH = wrapRect.height / 2;
        let cx = startLeft + dx;
        let cy = startTop + dy;
        cx = Math.max(halfW, Math.min(playRect.width - halfW, cx));
        cy = Math.max(halfH, Math.min(playRect.height - halfH, cy));
        wrapEl.style.left = cx + 'px';
        wrapEl.style.top = cy + 'px';
        layout[keyPrefix + 'X'] = cx / playRect.width;
        layout[keyPrefix + 'Y'] = cy / playRect.height;
      }

      function onUp(e) {
        if (!dragging || e.pointerId !== dragPointerId) return;
        dragging = false;
        dragPointerId = null;
        wrapEl.classList.remove('dragging');
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
      }
    }

    function clampWrapperInside(wrapEl, keyX, keyY) {
      const playRect = playAreaEl.getBoundingClientRect();
      const wrapRect = wrapEl.getBoundingClientRect();
      const halfW = wrapRect.width / 2;
      const halfH = wrapRect.height / 2;
      const rect = wrapEl.getBoundingClientRect();
      let cx = rect.left - playRect.left + rect.width / 2;
      let cy = rect.top - playRect.top + rect.height / 2;
      cx = Math.max(halfW, Math.min(playRect.width - halfW, cx));
      cy = Math.max(halfH, Math.min(playRect.height - halfH, cy));
      wrapEl.style.left = cx + 'px';
      wrapEl.style.top = cy + 'px';
      layout[keyX] = cx / playRect.width;
      layout[keyY] = cy / playRect.height;
    }

    function rectsOverlap(a, b) {
      return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
    }

    function getHeadZone() {
      const charRect = characterWrapEl.getBoundingClientRect();
      return {
        left: charRect.left - 30,
        right: charRect.right + 30,
        top: charRect.top - 100,
        bottom: charRect.top + charRect.height * 0.35 + 20,
        centerX: charRect.left + charRect.width / 2,
        centerY: charRect.top - 60
      };
    }

    function isPointInHeadZone(clientX, clientY) {
      const z = getHeadZone();
      return clientX >= z.left && clientX <= z.right && clientY >= z.top && clientY <= z.bottom;
    }

    function wirePreviewUpload(previewWrap, itemData, previewImg, urlInput, onUpdate) {
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      previewWrap.appendChild(fileInput);
      previewWrap.addEventListener('click', (e) => {
        e.stopPropagation();
        fileInput.click();
      });
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const dataUrl = ev.target.result;
          itemData.url = dataUrl;
          previewImg.src = dataUrl;
          urlInput.value = '';
          urlInput.placeholder = '📁 ' + file.name;
          if (onUpdate) onUpdate(dataUrl);
        };
        reader.readAsDataURL(file);
        fileInput.value = '';
      });
    }

    // ============================================================
    // TRAY SPAWN / RENDER
    // ============================================================
    function spawnTrayItem(foodId) {
      const food = foods.find(f => f.id === foodId);
      if (!food) return;
      const itemSize = food.size || 90;
      const pad = 20;
      let x, y, tries = 0;
      do {
        x = pad + Math.random() * Math.max(10, layout.trayW - itemSize - pad * 2);
        y = pad + Math.random() * Math.max(10, layout.trayH - itemSize - pad * 2);
        tries++;
      } while (overlapsExisting(x, y, itemSize) && tries < 60);
      trayItems.push({ uid: uid(), foodId, x, y });
      renderTray();
      hasBurped = false;
    }

    function overlapsExisting(x, y, size) {
      const minDist = size * 0.75;
      return trayItems.some(t => {
        const dx = t.x - x;
        const dy = t.y - y;
        return Math.sqrt(dx * dx + dy * dy) < minDist;
      });
    }

    function renderTray() {
      trayEl.innerHTML = '';
      trayItems.forEach(t => {
        const food = foods.find(f => f.id === t.foodId);
        if (!food) return;
        const itemSize = food.size || 90;
        const itemDiv = document.createElement('div');
        itemDiv.className = 'food-item';
        itemDiv.dataset.uid = t.uid;
        itemDiv.dataset.foodId = food.id;
        itemDiv.dataset.kind = 'food';
        itemDiv.style.left = t.x + 'px';
        itemDiv.style.top = t.y + 'px';

        const img = document.createElement('img');
        img.className = 'food-img';
        img.src = food.url;
        img.alt = food.name;
        img.draggable = false;
        img.style.width = itemSize + 'px';
        img.style.height = itemSize + 'px';
        img.onerror = function() { this.src = 'https://via.placeholder.com/90?text=?'; };

        itemDiv.appendChild(img);
        itemDiv.addEventListener('pointerdown', onPointerDown);
        trayEl.appendChild(itemDiv);
      });
    }

    // ============================================================
    // DRINK SPAWN / RENDER
    // ============================================================
    function spawnDrinkItem(drinkId) {
      const drink = drinks.find(d => d.id === drinkId);
      if (!drink) return;
      const pw = playAreaEl.clientWidth;
      const ph = playAreaEl.clientHeight;
      const charX = layout.charX * pw;
      const charY = layout.charY * ph;
      const itemSize = drink.size || 90;
      let x, y, tries = 0;
      do {
        const side = Math.random() < 0.5 ? -1 : 1;
        x = charX + side * (140 + Math.random() * 100);
        y = charY + (Math.random() - 0.5) * 180;
        tries++;
      } while (drinkOverlaps(x, y, itemSize) && tries < 30);
      x = Math.max(20, Math.min(pw - itemSize - 20, x - itemSize / 2));
      y = Math.max(20, Math.min(ph - itemSize - 20, y - itemSize / 2));
      drinkItems.push({ uid: uid(), drinkId, x, y });
      renderDrinks();
    }

    function drinkOverlaps(x, y, size) {
      const minDist = size * 0.75;
      return drinkItems.some(t => {
        const dx = t.x - x;
        const dy = t.y - y;
        return Math.sqrt(dx * dx + dy * dy) < minDist;
      });
    }

    function renderDrinks() {
      playAreaEl.querySelectorAll('.drink-item').forEach(el => el.remove());
      drinkItems.forEach(t => {
        const drink = drinks.find(d => d.id === t.drinkId);
        if (!drink) return;
        const itemSize = drink.size || 90;
        const itemDiv = document.createElement('div');
        itemDiv.className = 'drink-item';
        itemDiv.dataset.uid = t.uid;
        itemDiv.dataset.drinkId = drink.id;
        itemDiv.dataset.kind = 'drink';
        itemDiv.style.left = t.x + 'px';
        itemDiv.style.top = t.y + 'px';
        const img = document.createElement('img');
        img.className = 'drink-img';
        img.src = drink.url;
        img.alt = drink.name;
        img.draggable = false;
        img.style.width = itemSize + 'px';
        img.style.height = itemSize + 'px';
        img.onerror = function() { this.src = 'https://via.placeholder.com/90?text=?'; };
        itemDiv.appendChild(img);
        itemDiv.addEventListener('pointerdown', onDrinkPointerDown);
        playAreaEl.appendChild(itemDiv);
      });
    }

    // ============================================================
    // PHOTO SPAWN / RENDER
    // ============================================================
    function spawnPhotoItem(photoId) {
      const photo = photos.find(p => p.id === photoId);
      if (!photo) return;
      const pw = playAreaEl.clientWidth;
      const ph = playAreaEl.clientHeight;
      const size = photo.size || 140;
      let x, y, tries = 0;
      do {
        x = 40 + Math.random() * Math.max(10, pw - size - 80);
        y = 40 + Math.random() * Math.max(10, ph - size - 80);
        tries++;
      } while (photoOverlaps(x, y, size) && tries < 40);
      photoItems.push({
        uid: uid(),
        photoId,
        x,
        y,
        attached: false,
        position: photo.position || 'center'
      });
      renderPhotos();
    }

    function photoOverlaps(x, y, size) {
      const minDist = size * 0.7;
      return photoItems.some(t => {
        const dx = t.x - x;
        const dy = t.y - y;
        return Math.sqrt(dx * dx + dy * dy) < minDist;
      });
    }

    function renderPhotos() {
      playAreaEl.querySelectorAll('.photo-item').forEach(el => {
        const uidVal = el.dataset.uid;
        const data = photoItems.find(t => t.uid === uidVal);
        if (!data || !data.attached) el.remove();
      });
      characterEl.querySelectorAll('.photo-item').forEach(el => {
        const uidVal = el.dataset.uid;
        const data = photoItems.find(t => t.uid === uidVal);
        if (!data) el.remove();
      });
      photoItems.forEach(t => {
        const photo = photos.find(p => p.id === t.photoId);
        if (!photo) return;
        const itemSize = photo.size || 140;
        const angle = photo.angle || 0;
        const position = t.position || photo.position || 'center';

        if (t.attached) {
          const existing = characterEl.querySelector(`[data-uid="${t.uid}"]`);
          if (existing) {
            const img = existing.querySelector('.photo-img');
            if (img) {
              img.src = photo.url;
              img.style.width = itemSize + 'px';
              img.style.height = itemSize + 'px';
              img.style.transform = `rotate(${angle}deg)`;
            }
            applyHatPositionToElement(existing, position);
          }
          return;
        }
        if (playAreaEl.querySelector(`[data-uid="${t.uid}"]`)) return;
        const itemDiv = document.createElement('div');
        itemDiv.className = 'photo-item';
        itemDiv.dataset.uid = t.uid;
        itemDiv.dataset.photoId = photo.id;
        itemDiv.dataset.kind = 'photo';
        itemDiv.style.left = t.x + 'px';
        itemDiv.style.top = t.y + 'px';
        const img = document.createElement('img');
        img.className = 'photo-img';
        img.src = photo.url;
        img.alt = photo.name;
        img.draggable = false;
        img.style.width = itemSize + 'px';
        img.style.height = itemSize + 'px';
        img.style.transform = `rotate(${angle}deg)`;
        img.onerror = function() { this.src = 'https://via.placeholder.com/140?text=Photo'; };
        itemDiv.appendChild(img);
        itemDiv.addEventListener('pointerdown', onPhotoPointerDown);
        playAreaEl.appendChild(itemDiv);
      });
    }

    // ============================================================
    // POINTER DOWN — FOOD
    // ============================================================
    function onPointerDown(e) {
      if (isBusy) return;
      const item = e.currentTarget;
      if (item.dataset.eaten === 'true') return;
      if (isDragging) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      characterEl.classList.remove('smiling');
      mouthEl.classList.remove('mouth-wow');
      const uidVal = item.dataset.uid;
      dragItemData = trayItems.find(t => t.uid === uidVal);
      dragItemKind = 'food';
      if (!dragItemData) return;
      const food = foods.find(f => f.id === dragItemData.foodId);

      const rect = item.getBoundingClientRect();
      dragOffsetX = e.clientX - rect.left;
      dragOffsetY = e.clientY - rect.top;

      item.classList.add('dragging');
      item.style.position = 'fixed';
      item.style.left = rect.left + 'px';
      item.style.top = rect.top + 'px';
      item.style.width = rect.width + 'px';
      item.style.height = rect.height + 'px';
      item.style.margin = '0';
      item.style.zIndex = '2147483646';
      item.style.transform = 'scale(1.1)';
      item.style.transition = 'none';
      item.style.pointerEvents = 'none';
      document.body.appendChild(item);

      if (food && food.chopstick) {
        const newRect = item.getBoundingClientRect();
        showChopsticks(newRect);
        chopstickBackEl.classList.add('dragging-back');
        chopstickFrontEl.classList.add('dragging-front');
      }

      mouthEl.classList.add('mouth-open');
      updateEyeTracking(e.clientX, e.clientY);

      isDragging = true;
      dragEl = item;
      pointerId = e.pointerId;
      item.setPointerCapture(e.pointerId);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
    }

    // ============================================================
    // POINTER DOWN — DRINK
    // ============================================================
    function onDrinkPointerDown(e) {

      document.body.appendChild(item);
      updateEyeTracking(e.clientX, e.clientY);

      pointerId = e.pointerId;
      item.setPointerCapture(e.pointerId);

      window.addEventListener('pointerup', onPointerUp);
