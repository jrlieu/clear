    // ============================================================
    // SPAWN
    // ============================================================
    function spawnFoodItem(foodId) {
      const food = foods.find(f => f.id === foodId);
      if (!food) return;
      const itemSize = food.size || 90;
      const trayRect = trayEl.getBoundingClientRect();
      const playRect = playAreaEl.getBoundingClientRect();
      const trayCenterX = trayRect.left - playRect.left + trayRect.width / 2;
      const trayCenterY = trayRect.top - playRect.top + trayRect.height / 2;
      let x, y, tries = 0;
      do {
        x = trayCenterX + (Math.random() - 0.5) * Math.max(80, trayRect.width * 0.7) - itemSize / 2;
        y = trayCenterY + (Math.random() - 0.5) * Math.max(80, trayRect.height * 0.7) - itemSize / 2;
        tries++;
      } while (foodOverlaps(x, y, itemSize) && tries < 60);
      const newItem = { uid: uid(), foodId, x, y };
      trayItems.push(newItem);
      renderSingleFoodItem(newItem);
      scheduleSave();
    }
    function foodOverlaps(x, y, size) {
      const minDist = size * 0.75;
      return trayItems.some(t => Math.sqrt((t.x - x) ** 2 + (t.y - y) ** 2) < minDist);
    }
    function renderTray() {
      playAreaEl.querySelectorAll('.food-item').forEach(el => el.remove());
      trayItems.forEach(t => renderSingleFoodItem(t));
    }

    function spawnDrinkItem(drinkId) {
      const drink = drinks.find(d => d.id === drinkId);
      if (!drink) return;
      const pw = playAreaEl.clientWidth, ph = playAreaEl.clientHeight;
      const charX = layout.charX * pw, charY = layout.charY * ph;
      const itemSize = drink.size || 90;
      let x, y, tries = 0;
      do {
        const side = Math.random() < 0.5 ? -1 : 1;
        x = charX + side * (140 + Math.random() * 100) - itemSize / 2;
        y = charY + (Math.random() - 0.5) * 180 - itemSize / 2;
        tries++;
      } while (drinkOverlaps(x, y, itemSize) && tries < 30);
      const newItem = { uid: uid(), drinkId, x, y };
      drinkItems.push(newItem);
      renderSingleDrinkItem(newItem);
      scheduleSave();
    }
    function drinkOverlaps(x, y, size) {
      const minDist = size * 0.75;
      return drinkItems.some(t => Math.sqrt((t.x - x) ** 2 + (t.y - y) ** 2) < minDist);
    }
    function renderDrinks() {
      playAreaEl.querySelectorAll('.drink-item').forEach(el => el.remove());
      drinkItems.forEach(t => renderSingleDrinkItem(t));
    }

    function spawnPhotoItem(photoId) {
      const photo = photos.find(p => p.id === photoId);
      if (!photo) return;
      const pw = playAreaEl.clientWidth, ph = playAreaEl.clientHeight;
      const size = photo.size || 140;
      let x, y, tries = 0;
      do {
        x = 40 + Math.random() * Math.max(10, pw - size - 80);
        y = 40 + Math.random() * Math.max(10, ph - size - 80);
        tries++;
      } while (photoOverlaps(x, y, size) && tries < 40);
      const newItem = { uid: uid(), photoId, x, y, attached: false, position: photo.position || 'center' };
      photoItems.push(newItem);
      renderSinglePhotoItem(newItem);
      scheduleSave();
    }
    function photoOverlaps(x, y, size) {
      const minDist = size * 0.7;
      return photoItems.some(t => Math.sqrt((t.x - x) ** 2 + (t.y - y) ** 2) < minDist);
    }
    function renderPhotos() {
      playAreaEl.querySelectorAll('.photo-item').forEach(el => {
        const data = photoItems.find(t => t.uid === el.dataset.uid);
        if (!data || !data.attached) el.remove();
      });
      characterEl.querySelectorAll('.photo-item').forEach(el => {
        const data = photoItems.find(t => t.uid === el.dataset.uid);
        if (!data) el.remove();
      });
      photoItems.forEach(t => {
        if (t.attached) {
          const photo = photos.find(p => p.id === t.photoId);
          if (!photo) return;
          const existing = characterEl.querySelector(`[data-uid="${t.uid}"]`);
          if (existing) {
            const img = existing.querySelector('.photo-img');
            if (img) {
              img.src = photo.url;
              img.style.width = (photo.size || 140) + 'px';
              img.style.height = (photo.size || 140) + 'px';
              img.style.transform = `rotate(${photo.angle || 0}deg)`;
            }
            applyHatPositionToElement(existing, t.position || photo.position || 'center', photo.distance || 120);
          }
        } else {
          if (playAreaEl.querySelector(`[data-uid="${t.uid}"]`)) return;
          renderSinglePhotoItem(t);
        }
      });
    }

    // ============================================================
    // POINTER DOWN
    // ============================================================
    function onPointerDown(e) {
      if (isBusy) return;
      const item = e.currentTarget;
      if (item.dataset.eaten === 'true') return;
      if (isDragging) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      const uidVal = item.dataset.uid;
      dragItemData = trayItems.find(t => t.uid === uidVal);
      dragItemKind = 'food';
      if (!dragItemData) return;
      const food = foods.find(f => f.id === dragItemData.foodId);
      const rect = item.getBoundingClientRect();
      dragOffsetX = e.clientX - rect.left;
      dragOffsetY = e.clientY - rect.top;
      item.classList.add('dragging');
      item.style.position = 'fixed';
      item.style.left = rect.left + 'px';
      item.style.top = rect.top + 'px';
      item.style.width = rect.width + 'px';
      item.style.height = rect.height + 'px';
      item.style.margin = '0';
      item.style.zIndex = '2147483646';
      item.style.transform = 'scale(1.1)';
      item.style.transition = 'none';
      item.style.pointerEvents = 'none';
      document.body.appendChild(item);
      if (food && food.chopstick) {
        const newRect = item.getBoundingClientRect();
        showChopsticks(newRect);
        chopstickBackEl.classList.add('dragging-back');
        chopstickFrontEl.classList.add('dragging-front');
      }
      mouthEl.classList.add('mouth-open');
      updateEyeTracking(e.clientX, e.clientY);
      isDragging = true;
      dragEl = item;
      pointerId = e.pointerId;
      item.setPointerCapture(e.pointerId);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
    }

    function onDrinkPointerDown(e) {
      if (isBusy) return;
      const item = e.currentTarget;
      if (item.dataset.eaten === 'true') return;
      if (isDragging) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      const uidVal = item.dataset.uid;
      dragItemData = drinkItems.find(t => t.uid === uidVal);
      dragItemKind = 'drink';
      if (!dragItemData) return;
      drinkSippedThisDrag = false;
      drinkIsCurrentlySipping = false;
      if (burpDelayTimer) { clearTimeout(burpDelayTimer); burpDelayTimer = null; }
      const rect = item.getBoundingClientRect();
      dragOffsetX = e.clientX - rect.left;
      dragOffsetY = e.clientY - rect.top;
      item.classList.add('dragging');
      item.style.position = 'fixed';
      item.style.left = rect.left + 'px';
      item.style.top = rect.top + 'px';
      item.style.width = rect.width + 'px';
      item.style.height = rect.height + 'px';
      item.style.margin = '0';
      item.style.zIndex = '2147483646';
      item.style.transform = 'scale(1.1)';
      item.style.transition = 'none';
      item.style.pointerEvents = 'none';
      document.body.appendChild(item);
      updateEyeTracking(e.clientX, e.clientY);
      isDragging = true;
      dragEl = item;
      pointerId = e.pointerId;
      item.setPointerCapture(e.pointerId);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
    }

    function onPhotoPointerDown(e) {
      if (isBusy) return;
      const item = e.currentTarget;
      if (isDragging) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      const uidVal = item.dataset.uid;
      dragItemData = photoItems.find(t => t.uid === uidVal);
      dragItemKind = 'photo';
      if (!dragItemData) return;
      const rect = item.getBoundingClientRect();
      dragOffsetX = e.clientX - rect.left;
      dragOffsetY = e.clientY - rect.top;
      if (dragItemData.attached) {
        dragItemData.attached = false;
        item.classList.remove('photo-attached');
        playAreaEl.appendChild(item);
        item.style.position = '';
        item.style.top = '';
        item.style.left = '';
        item.style.transform = '';
        item.style.zIndex = '';
      }
      item.classList.add('dragging');
      item.style.position = 'fixed';
      item.style.left = rect.left + 'px';
      item.style.top = rect.top + 'px';
      item.style.width = rect.width + 'px';
      item.style.height = rect.height + 'px';
      item.style.margin = '0';
      item.style.zIndex = '2147483646';
      item.style.transition = 'none';
      item.style.pointerEvents = 'none';
      document.body.appendChild(item);
      isDragging = true;
      dragEl = item;
      pointerId = e.pointerId;
      item.setPointerCapture(e.pointerId);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
    }

    // ============================================================
    // POINTER MOVE
    // ============================================================
    function onPointerMove(e) {
      if (!isDragging || !dragEl || e.pointerId !== pointerId) return;
      e.preventDefault();
      const x = e.clientX - dragOffsetX;
      const y = e.clientY - dragOffsetY;
      dragEl.style.left = x + 'px';
      dragEl.style.top = y + 'px';
      if (dragItemKind === 'food' && chopstickBackEl.classList.contains('active')) {
        updateChopsticksPosition(dragEl.getBoundingClientRect());
      }
      if (dragItemKind === 'food' || dragItemKind === 'drink') updateEyeTracking(e.clientX, e.clientY);
      const dragRect = dragEl.getBoundingClientRect();
      const mouthRect = mouthEl.getBoundingClientRect();
      const isOverMouth = rectsOverlap(dragRect, mouthRect);

      if (dragItemKind === 'photo') {
        mouthEl.classList.remove('hint', 'mouth-wow', 'mouth-sip-bubble');
        characterEl.classList.remove('sipping');
        stopFizz();
        return;
      }

      if (dragItemKind === 'drink') {
        if (isOverMouth) {
          if (burpDelayTimer) { clearTimeout(burpDelayTimer); burpDelayTimer = null; }
          if (!drinkIsCurrentlySipping) {
            drinkIsCurrentlySipping = true;
            drinkSippedThisDrag = true;
            mouthEl.classList.add('mouth-wow', 'mouth-sip-bubble');
            characterEl.classList.add('sipping');
          }
          startFizz(mouthRect);
        } else {
          if (drinkIsCurrentlySipping) {
            drinkIsCurrentlySipping = false;
            stopFizz();
            mouthEl.classList.remove('mouth-wow', 'mouth-sip-bubble');
            characterEl.classList.remove('sipping');
            if (burpDelayTimer) clearTimeout(burpDelayTimer);
            burpDelayTimer = setTimeout(() => {
              burpDelayTimer = null;
              doBurp();
              drinkSippedThisDrag = false;
            }, 500);
          } else {
            stopFizz();
          }
        }
        return;
      }

      // FOOD
      if (isOverMouth) {
        mouthEl.classList.remove('mouth-wow', 'mouth-sip-bubble');
        characterEl.classList.remove('sipping');
        mouthEl.classList.add('hint');
        stopFizz();
      } else {
        mouthEl.classList.remove('hint');
        stopFizz();
      }
    }

    // ============================================================
    // FIZZ
    // ============================================================
    function startFizz(mouthRect) {
      if (fizzInterval) return;
      spawnFizz(mouthRect.left + mouthRect.width / 2, mouthRect.top + mouthRect.height / 2);
      fizzInterval = setInterval(() => {
        const r = mouthEl.getBoundingClientRect();
        spawnFizz(r.left + r.width / 2, r.top + r.height / 2);
      }, 140);
    }
    function stopFizz() {
      if (fizzInterval) { clearInterval(fizzInterval); fizzInterval = null; }
    }
    function spawnFizz(x, y) {
      const bubbles = ['🫧', '💧', '·', '°', '✦'];
      const b = document.createElement('div');
      b.className = 'fizz';
      b.textContent = bubbles[Math.floor(Math.random() * bubbles.length)];
      b.style.left = (x + (Math.random() - 0.5) * 26) + 'px';
      b.style.top = y + 'px';
      b.style.color = ['#8ac0e6', '#c1e5ff', '#5a9ec9', '#a8e6ff'][Math.floor(Math.random() * 4)];
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 950);
    }

    // ============================================================
    // POINTER UP
    // ============================================================
    function onPointerUp(e) {
      if (!isDragging || !dragEl || e.pointerId !== pointerId) return;
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);
      const item = dragEl;
      const kind = dragItemKind;
      dragEl = null; dragItemKind = null;
      isDragging = false; pointerId = null;
      mouthEl.classList.remove('mouth-open');
      mouthEl.classList.remove('hint');
      resetEyeTracking();
      const dragRect = item.getBoundingClientRect();
      const mouthRect = mouthEl.getBoundingClientRect();
      const isOverMouth = rectsOverlap(dragRect, mouthRect);
      if (kind === 'photo') {
        const dropX = dragRect.left + dragRect.width / 2;
        const dropY = dragRect.top + dragRect.height / 2;
        returnPhotoToSpot(item, isPointOverCharacterHead(dropX, dropY));
        return;
      }
      if (kind === 'drink') {
        if (drinkIsCurrentlySipping) {
          drinkIsCurrentlySipping = false;
          stopFizz();
          mouthEl.classList.remove('mouth-wow', 'mouth-sip-bubble');
          characterEl.classList.remove('sipping');
          if (burpDelayTimer) { clearTimeout(burpDelayTimer); burpDelayTimer = null; }
          burpDelayTimer = setTimeout(() => {
            burpDelayTimer = null;
            doBurp();
            drinkSippedThisDrag = false;
          }, 500);
        } else {
          stopFizz();
          mouthEl.classList.remove('mouth-wow', 'mouth-sip-bubble');
          characterEl.classList.remove('sipping');
        }
        returnDrinkToSpot(item);
        return;
      }
      if (isOverMouth) eatFood(item, mouthRect);
      else {
        if (chopstickBackEl.classList.contains('active')) hideChopsticks();
        returnFoodToSpot(item);
      }
    }

    function returnFoodToSpot(item) {
      item.classList.remove('dragging');
      const playRect = playAreaEl.getBoundingClientRect();
      const itemRect = item.getBoundingClientRect();
      const newX = itemRect.left - playRect.left;
      const newY = itemRect.top - playRect.top;
      dragItemData.x = newX;
      dragItemData.y = newY;
      item.style.position = 'absolute';
      item.style.left = newX + 'px';
      item.style.top = newY + 'px';
      item.style.width = ''; item.style.height = '';
      item.style.margin = ''; item.style.transform = '';
      item.style.transition = ''; item.style.zIndex = '';
      item.style.opacity = ''; item.style.pointerEvents = '';
      playAreaEl.appendChild(item);
      scheduleSave();
    }
    function returnDrinkToSpot(item) {
      item.classList.remove('dragging');
      const playRect = playAreaEl.getBoundingClientRect();
      const itemRect = item.getBoundingClientRect();
      const newX = itemRect.left - playRect.left;
      const newY = itemRect.top - playRect.top;
      dragItemData.x = newX; dragItemData.y = newY;
      item.style.position = 'absolute';
      item.style.left = newX + 'px'; item.style.top = newY + 'px';
      item.style.width = ''; item.style.height = '';
      item.style.margin = ''; item.style.transform = '';
      item.style.transition = ''; item.style.zIndex = '';
      item.style.opacity = ''; item.style.pointerEvents = '';
      playAreaEl.appendChild(item);
      scheduleSave();
    }
    function returnPhotoToSpot(item, forceAttach) {
      item.classList.remove('dragging');
      const itemRect = item.getBoundingClientRect();
      const dropX = itemRect.left + itemRect.width / 2;
      const dropY = itemRect.top + itemRect.height / 2;
      const onHead = (typeof forceAttach === 'boolean') ? forceAttach : isPointOverCharacterHead(dropX, dropY);
      if (onHead) {
        const photo = photos.find(p => p.id === dragItemData.photoId);
        const distance = (photo && typeof photo.distance === 'number') ? photo.distance : 120;
        dragItemData.attached = true;
        item.style.position = ''; item.style.left = ''; item.style.top = '';
        item.style.width = ''; item.style.height = ''; item.style.margin = '';
        item.style.transform = ''; item.style.transition = ''; item.style.zIndex = '';
        item.style.pointerEvents = ''; item.style.opacity = '';
        item.classList.remove('dragging');
        item.classList.add('photo-attached');
        characterEl.appendChild(item);
        applyHatPositionToElement(item, dragItemData.position || 'center', distance);
        scheduleSave();
        return;
      }
      const playRect = playAreaEl.getBoundingClientRect();
      const newX = itemRect.left - playRect.left;
      const newY = itemRect.top - playRect.top;
      dragItemData.x = newX; dragItemData.y = newY;
      dragItemData.attached = false;
      item.classList.remove('photo-attached');
      item.style.position = 'absolute';
      item.style.left = newX + 'px'; item.style.top = newY + 'px';
      item.style.width = ''; item.style.height = ''; item.style.margin = '';
      item.style.transform = ''; item.style.transition = ''; item.style.zIndex = '';
      item.style.pointerEvents = '';
      playAreaEl.appendChild(item);
      scheduleSave();
    }

    // ============================================================
    // EAT FOOD
    // ============================================================
    function eatFood(item, mouthRect) {
      item.dataset.eaten = 'true';
      isBusy = true;
      const wasChopsticked = chopstickBackEl.classList.contains('active');
      const mouthCenterX = mouthRect.left + mouthRect.width / 2;
      const mouthCenterY = mouthRect.top + mouthRect.height / 2;
      item.classList.add('eating-now');
      const itemRect = item.getBoundingClientRect();
      const itemCenterX = itemRect.left + itemRect.width / 2;
      const itemCenterY = itemRect.top + itemRect.height / 2;
      const deltaX = mouthCenterX - itemCenterX;
      const deltaY = mouthCenterY - itemCenterY;
      item.style.transition = 'transform 0.4s cubic-bezier(0.55, 0, 1, 0.45), opacity 0.4s ease-in';
      item.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.15) rotate(15deg)`;
      item.style.opacity = '0.6';
      if (wasChopsticked) {
        const followInterval = setInterval(() => positionChopsticksAtFoodTop(item.getBoundingClientRect()), 40);
        setTimeout(() => clearInterval(followInterval), 400);
      }
      spawnSparkles(mouthCenterX, mouthCenterY);
      setTimeout(() => {
        item.style.opacity = '0';
        setTimeout(() => item.remove(), 300);
        if (wasChopsticked) {
          positionChopsticksAtFoodTop({ left: mouthRect.left, top: mouthRect.top - 8, width: mouthRect.width, height: mouthRect.height });
          chopstickBackEl.classList.add('sliding-away');
          chopstickFrontEl.classList.add('sliding-away');
          setTimeout(() => hideChopsticks(), 700);
        }
        characterEl.classList.add('eating', 'chewing');
        mouthEl.classList.add('mouth-chew');
        const crumbInterval = setInterval(() => spawnCrumb(mouthCenterX, mouthCenterY), 90);
        setTimeout(() => {
          clearInterval(crumbInterval);
          characterEl.classList.remove('chewing');
          mouthEl.classList.remove('mouth-chew');
          characterEl.classList.add('swallowing');
          mouthEl.classList.add('mouth-swallow');
          const uidVal = item.dataset.uid;
          trayItems = trayItems.filter(t => t.uid !== uidVal);
          scheduleSave();
          setTimeout(() => {
            characterEl.classList.remove('swallowing', 'eating');
            mouthEl.classList.remove('mouth-swallow');
            isBusy = false;
          }, 500);
        }, 900);
      }, 380);
    }

    // ============================================================
    // BURP
    // ============================================================
    function doBurp() {
      if (characterEl.classList.contains('burping') ||
          characterEl.classList.contains('eating') ||
          characterEl.classList.contains('chewing') ||
          characterEl.classList.contains('swallowing') ||
          characterEl.classList.contains('sipping') ||
          characterEl.classList.contains('laughing') ||
          characterEl.classList.contains('blushing')) return;
      characterEl.classList.remove('smiling');
      mouthEl.classList.remove('mouth-wow');
      characterEl.classList.add('burping');
      mouthEl.classList.add('mouth-burp');
      const mouthRect = mouthEl.getBoundingClientRect();
      const mouthCenterX = mouthRect.left + mouthRect.width / 2;
      const mouthTopY = mouthRect.top;
      const burpText = document.createElement('div');
      burpText.className = 'burp-text';
      burpText.textContent = 'BURP!';
      burpText.style.left = mouthCenterX + 'px';
      burpText.style.top = (mouthTopY - 10) + 'px';
      document.body.appendChild(burpText);
      setTimeout(() => burpText.remove(), 1600);
      for (let i = 0; i < 5; i++) {
        const b = document.createElement('div');
        b.className = 'burp-bubble';
        b.textContent = '💨';
        b.style.left = (mouthCenterX + (Math.random() - 0.5) * 80) + 'px';
        b.style.top = (mouthTopY - Math.random() * 10) + 'px';
        b.style.fontSize = (1.4 + Math.random() * 1.2) + 'rem';
        b.style.animationDelay = (Math.random() * 0.25) + 's';
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 1700);
      }
      spawnSparkles(mouthCenterX, mouthTopY - 30);
      setTimeout(() => {
        characterEl.classList.remove('burping');
        mouthEl.classList.remove('mouth-burp');
      }, 800);
    }

    function spawnSparkles(x, y) {
      const chars = ['✨', '⭐', '💫', '🌟'];
      for (let i = 0; i < 6; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.textContent = chars[Math.floor(Math.random() * chars.length)];
        s.style.left = (x + (Math.random() - 0.5) * 40) + 'px';
        s.style.top = (y + (Math.random() - 0.5) * 40) + 'px';
        s.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
        s.style.animationDelay = (Math.random() * 0.15) + 's';
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 700);
      }
    }
    function spawnCrumb(x, y) {
      const c = document.createElement('div');
      c.className = 'crumb';
      c.textContent = '·';
      c.style.left = x + 'px';
      c.style.top = y + 'px';
      c.style.color = ['#e0ab72', '#c98a4b', '#f0c48a'][Math.floor(Math.random() * 3)];
      c.style.fontSize = (14 + Math.random() * 10) + 'px';
      c.style.fontWeight = 'bold';
      const angle = (Math.random() - 0.5) * Math.PI;
      const dist = 30 + Math.random() * 40;
      c.style.setProperty('--cx', Math.cos(angle) * dist + 'px');
      c.style.setProperty('--cy', (Math.sin(angle) * dist - 20) + 'px');
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 600);
    }

    // ============================================================
    // MOUTH CLICK → TOGGLE SIDEBAR
    // ============================================================
    let mouthPointerDownTime = 0;
    let mouthMoved = false;

    mouthEl.addEventListener('pointerdown', (e) => {
      mouthPointerDownTime = Date.now();
      mouthMoved = false;
    });
    mouthEl.addEventListener('pointermove', (e) => {
      if (Date.now() - mouthPointerDownTime < 500) {
        mouthMoved = true;
      }
    });
    mouthEl.addEventListener('pointerup', (e) => {
      if (mouthMoved) return;
      if (Date.now() - mouthPointerDownTime > 600) return;
      e.preventDefault();
      e.stopPropagation();
      toggleSidebar();
    });
    mouthEl.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (Date.now() - mouthPointerDownTime < 600) return;
      toggleSidebar();
    });

    // ============================================================
    // ADD NEW ITEMS
    // ============================================================
    addBackgroundBtn.addEventListener('click', () => {
      backgrounds.unshift({ id: uid(), name: 'New BG', url: '', color: '#fbe9d2', applied: false });
      scheduleSave();
      buildBackgroundEditors();
    });
    addFoodBtn.addEventListener('click', () => {
      foods.unshift({ id: uid(), name: 'New Food', url: 'https://via.placeholder.com/200?text=Food', size: 90, chopstick: false });
      scheduleSave();
      buildFoodEditors();
    });
    addDrinkBtn.addEventListener('click', () => {
      drinks.unshift({ id: uid(), name: 'New Drink', url: 'https://via.placeholder.com/200?text=Drink', size: 90 });
      scheduleSave();
      buildDrinkEditors();
    });
    addPhotoBtn.addEventListener('click', () => {
      photos.unshift({ id: uid(), name: 'New Photo', url: 'https://via.placeholder.com/300?text=Photo', size: 140, angle: 0, distance: 120, position: 'center' });
      scheduleSave();
      buildPhotoEditors();
    });

    charSizeSlider.addEventListener('input', e => {
      if (charLocked) return;
      characterEl.style.setProperty('--user-scale', e.target.value);
      if (charSizeValueEl) charSizeValueEl.textContent = parseFloat(e.target.value).toFixed(2) + '×';
      scheduleSave();
    });
    trayWSlider.addEventListener('input', e => {
      if (trayLocked) return;
      layout.trayW = parseInt(e.target.value, 10);
      applyLayout();
      clampWrapperInside(trayWrapEl, 'trayX', 'trayY');
      scheduleSave();
    });
    trayHSlider.addEventListener('input', e => {
      if (trayLocked) return;
      layout.trayH = parseInt(e.target.value, 10);
      applyLayout();
      clampWrapperInside(trayWrapEl, 'trayX', 'trayY');
      scheduleSave();
    });
    trayTiltSlider.addEventListener('input', e => applyTrayTilt(parseInt(e.target.value, 10)));

    // ============================================================
    // INIT
    // ============================================================
    function init() {
      loadState();
      buildBackgroundEditors();
      buildFoodEditors();
      buildDrinkEditors();
      buildPhotoEditors();
      applyLayout();
      refreshPositionUI();

      if (charLocked) {
        charLockBtn.textContent = '🔒';
        charLockBtn.classList.add('locked');
        charLockBtn.title = 'Unlock character';
        characterWrapEl.classList.add('char-locked');
        characterWrapEl.style.cursor = 'default';
        charSizeSlider.disabled = true;
        charXSlider.disabled = true;
        charYSlider.disabled = true;
      }
      if (trayLocked) {
        trayLockBtn.textContent = '🔒';
        trayLockBtn.classList.add('locked');
        trayLockBtn.title = 'Unlock tray';
        trayWrapEl.classList.add('tray-locked');
        trayWrapEl.style.cursor = 'default';
        trayWSlider.disabled = true;
        trayHSlider.disabled = true;
        trayTiltSlider.disabled = true;
        trayXSlider.disabled = true;
        trayYSlider.disabled = true;
      }

      const applied = backgrounds.find(b => b.applied);
      if (applied) applyBackground(applied);

      requestAnimationFrame(() => {
        applyLayout();
        restoreSpawnedItems();
        makeDraggable(characterWrapEl, 'char');
        makeDraggable(trayWrapEl, 'tray');
        showMouthHintOnce();
      });

      window.addEventListener('resize', () => {
        const pw = playAreaEl.clientWidth, ph = playAreaEl.clientHeight;
        if (!charLocked) {
          characterWrapEl.style.left = (layout.charX * pw) + 'px';
          characterWrapEl.style.top = (layout.charY * ph) + 'px';
        }
        if (!trayLocked) {
          trayWrapEl.style.left = (layout.trayX * pw) + 'px';
          trayWrapEl.style.top = (layout.trayY * ph) + 'px';
        }
        refreshPositionUI();
      });
    }

    init();
  })();
</script>

</body>
</html>
