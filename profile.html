<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #ffffff;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #bgPicker {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.9);
    padding: 10px 14px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    font-size: 0.85rem;
    font-weight: 700;
    color: #333;
  }
  #bgPicker input[type="color"] {
    width: 42px;
    height: 32px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: none;
    padding: 0;
  }
  #bgPicker input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  #bgPicker input[type="color"]::-webkit-color-swatch {
    border: 2px solid #ccc;
    border-radius: 8px;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>

<div id="bgPicker">
  <label for="bgColor">Background</label>
  <input type="color" id="bgColor" value="#ffffff">
</div>

<canvas id="canvas"></canvas>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const bgColorInput = document.getElementById('bgColor');

  let CANVAS_W = window.innerWidth;
  let CANVAS_H = window.innerHeight;
  let bgColor = '#ffffff';

  // Big character zoom
  const ZOOM = 5.5;
  const BASE_RADIUS = 34 * ZOOM;

  const GROUND_FRACTION = 0.90;
  const FOOT_OFFSET = 37 * ZOOM;

  let GROUND_Y = CANVAS_H * GROUND_FRACTION;

  function resizeCanvas() {
    CANVAS_W = window.innerWidth;
    CANVAS_H = window.innerHeight;
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;
    GROUND_Y = CANVAS_H * GROUND_FRACTION;
  }
  window.addEventListener('resize', resizeCanvas);

  bgColorInput.addEventListener('input', (e) => {
    bgColor = e.target.value;
    document.body.style.background = bgColor;
  });

  function drawCharacter() {
    const cx = CANVAS_W * 0.5;
    const cy = GROUND_Y - FOOT_OFFSET;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(ZOOM, ZOOM);

    // Feet
    ctx.fillStyle = '#ffb07c';
    ctx.beginPath();
    ctx.ellipse(-16, 30, 10, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(16, 30, 10, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = '#ffc896';
    ctx.beginPath();
    ctx.arc(0, 0, 34, 0, Math.PI * 2);
    ctx.fill();

    // Belly
    ctx.fillStyle = '#ffe0b9';
    ctx.beginPath();
    ctx.ellipse(0, 10, 20, 17, 0, 0, Math.PI * 2);
    ctx.fill();

    // Left arm
    ctx.fillStyle = '#e8a46e';
    ctx.save();
    ctx.translate(-30, 4);
    ctx.rotate(-0.2);
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 7, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Left ear
    ctx.fillStyle = '#ffb07c';
    ctx.beginPath();
    ctx.ellipse(-20, -40, 14, 16, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff9f7c';
    ctx.beginPath();
    ctx.ellipse(-20, -42, 7, 9, -0.2, 0, Math.PI * 2);
    ctx.fill();

    // Right ear
    ctx.fillStyle = '#ffb07c';
    ctx.beginPath();
    ctx.ellipse(20, -40, 14, 16, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff9f7c';
    ctx.beginPath();
    ctx.ellipse(20, -42, 7, 9, 0.2, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    const eyeSpacing = 13;
    const eyeY = -10;

    ctx.fillStyle = '#2e1b0e';
    ctx.beginPath();
    ctx.ellipse(-eyeSpacing, eyeY, 5.5, 6.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(eyeSpacing, eyeY, 5.5, 6.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Eye shine
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(-eyeSpacing - 2, eyeY - 3, 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(eyeSpacing - 2, eyeY - 3, 2.4, 0, Math.PI * 2);
    ctx.fill();

    // Smile
    ctx.strokeStyle = '#6b3e1c';
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.arc(0, 6, 9, 0.15, Math.PI - 0.15);
    ctx.stroke();

    // Tongue
    ctx.fillStyle = '#ff8a8a';
    ctx.beginPath();
    ctx.ellipse(0, 13, 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // Right arm
    ctx.fillStyle = '#ffb07c';
    ctx.save();
    ctx.translate(30, 4);
    ctx.rotate(0.2);
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 7, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Cheeks
    ctx.fillStyle = '#ffa5a5b0';
    ctx.beginPath();
    ctx.ellipse(-eyeSpacing - 11, 2, 7, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(eyeSpacing + 11, 2, 7, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function draw() {
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    drawCharacter();
  }

  function loop() {
    draw();
    requestAnimationFrame(loop);
  }

  resizeCanvas();
  loop();
})();
</script>
</body>
</html>
