<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #ffffff;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #ffffff;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let CANVAS_W = window.innerWidth;
  let CANVAS_H = window.innerHeight;

  const ZOOM = 2.2;

  // Character state
  const char = {
    screenX: 0,
    y: 0,
    baseY: 0,
    baseRadius: 34 * ZOOM,
    radius: 34 * ZOOM,
    squash: 1,
    squashVel: 0,
    blink: 0,
    walkPhase: 0,
    state: 'walking',   // 'walking' or 'jumping'
    vy: 0,
    grounded: true,
    nextJumpAt: 1.5,
    walkDuration: 1.5
  };

  // Jump physics
  let JUMP_VELOCITY = 0;
  let JUMP_GRAVITY = 0;
  const GROUND_FRACTION = 0.80;      // character stands at 80% of screen height
  const FOOT_OFFSET = 37 * ZOOM;     // distance from char center to feet
  const CHAR_FOOT_SINK = 4;
  const JUMP_APEX_FRACTION = 0.60;
  const JUMP_TIME_TO_PEAK = 0.75;

  let GROUND_Y = CANVAS_H * GROUND_FRACTION;
  let FOOT_GROUND = GROUND_Y + 2;

  function recomputeJumpPhysics() {
    const baseY = FOOT_GROUND - FOOT_OFFSET + CHAR_FOOT_SINK;
    const apexY = CANVAS_H - CANVAS_H * JUMP_APEX_FRACTION;
    const rise = baseY - apexY;
    const safeRise = Math.max(rise, CANVAS_H * 0.25);
    const dt = 1 / 60;
    const steps = JUMP_TIME_TO_PEAK / dt;
    JUMP_GRAVITY = (2 * safeRise) / (steps * steps);
    JUMP_VELOCITY = -(2 * safeRise) / steps;
  }

  function resizeCanvas() {
    CANVAS_W = window.innerWidth;
    CANVAS_H = window.innerHeight;
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;

    GROUND_Y = CANVAS_H * GROUND_FRACTION;
    FOOT_GROUND = GROUND_Y + 2;

    const newBaseY = FOOT_GROUND - FOOT_OFFSET + CHAR_FOOT_SINK;

    if (char.grounded) {
      char.baseY = newBaseY;
      char.y = newBaseY;
      char.vy = 0;
    } else {
      const oldHeightAboveGround = char.baseY - char.y;
      char.baseY = newBaseY;
      char.y = newBaseY - oldHeightAboveGround;
    }

    // Keep character horizontally centered-ish (a bit left of center so it can "walk")
    char.screenX = CANVAS_W * 0.45;

    recomputeJumpPhysics();
  }
  window.addEventListener('resize', resizeCanvas);

  // ---------- UPDATE ----------
  function update() {
    const dt = 1 / 60;

    char.blink = (char.blink + 0.025) % (Math.PI * 2);

    // Squash/stretch spring
    char.squashVel += (1 - char.squash) * 0.25;
    char.squashVel *= 0.75;
    char.squash += char.squashVel;

    if (char.state === 'walking') {
      char.walkPhase += 0.18;

      char.nextJumpAt -= dt;
      if (char.nextJumpAt <= 0) {
        char.state = 'jumping';
        char.grounded = false;
        char.vy = JUMP_VELOCITY;
        char.squash = 0.82;
        char.squashVel = 0.12;
      }
    } else if (char.state === 'jumping') {
      char.vy += JUMP_GRAVITY;
      char.y += char.vy;

      if (char.y >= char.baseY) {
        char.y = char.baseY;
        char.vy = 0;
        char.grounded = true;
        char.squash = 0.86;
        char.squashVel = 0.08;

        char.state = 'walking';
        char.walkDuration = 0.8 + Math.random() * 1.5;
        char.nextJumpAt = char.walkDuration;
      }
    }
  }

  // ---------- DRAW ----------
  function drawCharacter() {
    const cx = char.screenX;
    const cy = char.y;
    const squash = char.squash;
    const stretch = 1 / Math.max(0.7, squash);
    const sizeFactor = char.radius / char.baseRadius;

    let tilt = 0;
    if (char.state === 'walking') {
      tilt = Math.sin(char.walkPhase) * 0.08;
    }

    let footStride = 0;
    let footY = 0;
    if (char.state === 'walking') {
      footStride = Math.sin(char.walkPhase) * 8;
      footY = Math.abs(Math.sin(char.walkPhase)) * -3;
    } else if (char.state === 'jumping') {
      footStride = 12;
      footY = -4;
    }

    let armSwing = 0;
    if (char.state === 'walking') {
      armSwing = Math.sin(char.walkPhase) * 0.35;
    } else if (char.state === 'jumping') {
      armSwing = -0.5;
    }

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tilt);
    ctx.scale(squash * ZOOM * sizeFactor, stretch * ZOOM * sizeFactor);

    // Feet
    ctx.fillStyle = '#ffb07c';
    ctx.beginPath();
    ctx.ellipse(-16 + footStride * 0.5, 30 + footY, 10, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(16 - footStride * 0.5, 30 + footY, 10, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = '#ffc896';
    ctx.beginPath();
    ctx.arc(0, 0, 34, 0, Math.PI * 2);
    ctx.fill();

    // Belly
    ctx.fillStyle = '#ffe0b9';
    ctx.beginPath();
    ctx.ellipse(0, 10, 20, 17, 0, 0, Math.PI * 2);
    ctx.fill();

    // Left arm
    ctx.fillStyle = '#e8a46e';
    ctx.save();
    ctx.translate(-30, 4);
    ctx.rotate(-armSwing);
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 7, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Ears
    ctx.fillStyle = '#ffb07c';
    ctx.beginPath();
    ctx.ellipse(-20, -40, 14, 16, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff9f7c';
    ctx.beginPath();
    ctx.ellipse(-20, -42, 7, 9, -0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffb07c';
    ctx.beginPath();
    ctx.ellipse(20, -40, 14, 16, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff9f7c';
    ctx.beginPath();
    ctx.ellipse(20, -42, 7, 9, 0.2, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    const eyeSpacing = 13;
    const eyeY = -10;
    const eyeOffsetY = Math.sin(char.blink) * 2;

    ctx.fillStyle = '#2e1b0e';
    ctx.beginPath();
    ctx.ellipse(-eyeSpacing, eyeY + eyeOffsetY, 5.5, 6.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(eyeSpacing, eyeY + eyeOffsetY, 5.5, 6.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Eye shine
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(-eyeSpacing - 2, eyeY - 3 + eyeOffsetY, 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(eyeSpacing - 2, eyeY - 3 + eyeOffsetY, 2.4, 0, Math.PI * 2);
    ctx.fill();

    // Smile
    ctx.strokeStyle = '#6b3e1c';
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.arc(0, 6, 9, 0.15, Math.PI - 0.15);
    ctx.stroke();

    // Tongue
    ctx.fillStyle = '#ff8a8a';
    ctx.beginPath();
    ctx.ellipse(0, 13, 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // Right arm
    ctx.fillStyle = '#ffb07c';
    ctx.save();
    ctx.translate(30, 4);
    ctx.rotate(armSwing);
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 7, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Cheeks
    ctx.fillStyle = '#ffa5a5b0';
    ctx.beginPath();
    ctx.ellipse(-eyeSpacing - 11, 2, 7, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(eyeSpacing + 11, 2, 7, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function draw() {
    // Plain white background
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    drawCharacter();
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  resizeCanvas();
  gameLoop();
})();
</script>
</body>
</html>
