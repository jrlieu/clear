<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍬 Bouncy Muncher · Weather Edition</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #b7e2fa;
    font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #b7e2fa;
    cursor: grab;
    touch-action: none;
  }
  canvas.dragging { cursor: grabbing; }

  .top-bar {
    position: fixed;
    top: 14px;
    left: 14px;
    right: 14px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: nowrap;
    pointer-events: none;
  }
  .top-bar > * { pointer-events: auto; }

  .weather-panel { position: relative; flex-shrink: 0; }

  .weather-toggle {
    background: rgba(255, 245, 225, 0.95);
    backdrop-filter: blur(8px);
    border: none;
    border-radius: 16px;
    padding: 11px 16px;
    font-size: 0.95rem;
    font-weight: 800;
    color: #5e3a1c;
    cursor: pointer;
    box-shadow: inset 0 -3px 0 #dbbd9b, 0 5px 0 #9e7b5b, 0 8px 18px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    gap: 8px;
    text-shadow: 1px 1px 0 #ffe6c0;
    transition: 0.08s;
    font-family: inherit;
    white-space: nowrap;
  }
  .weather-toggle:active {
    transform: translateY(3px);
    box-shadow: inset 0 -2px 0 #dbbd9b, 0 2px 0 #9e7b5b;
  }
  .weather-toggle .chev {
    font-size: 0.75rem;
    transition: transform 0.2s ease;
    display: inline-block;
  }
  .weather-toggle.open .chev { transform: rotate(180deg); }
  .weather-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    background: rgba(255, 245, 225, 0.98);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: 12px;
    box-shadow: inset 0 -3px 0 #dbbd9b, 0 5px 0 #9e7b5b, 0 12px 24px rgba(0,0,0,0.2);
    display: none;
    flex-direction: column;
    gap: 6px;
    min-width: 230px;
    z-index: 25;
  }
  .weather-menu.open { display: flex; }
  .weather-btn {
    background: #fff2d7;
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.88rem;
    font-weight: 800;
    color: #5e3a1c;
    cursor: pointer;
    box-shadow: inset 0 -3px 0 #e6c7a2, 0 3px 0 #9e7b5b;
    transition: 0.08s;
    font-family: inherit;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
    text-shadow: 1px 1px 0 #fff0d8;
  }
  .weather-btn:active {
    transform: translateY(2px);
    box-shadow: inset 0 -2px 0 #e6c7a2, 0 1px 0 #9e7b5b;
  }
  .weather-btn.active {
    background: #ffd88a;
    box-shadow: inset 0 -3px 0 #e0a94c, 0 3px 0 #b46f3f;
    color: #4a2b10;
  }
  .intensity-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
    padding: 8px 6px 2px;
    border-top: 1px solid #e8cfa8;
  }
  .intensity-row label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8b5a2b;
    font-weight: 800;
  }
  .intensity-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    border-radius: 4px;
    background: #ffd8a8;
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.15);
    outline: none;
    cursor: pointer;
  }
  .intensity-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #ffb882;
    box-shadow: 0 3px 0 #b46f3f, 0 2px 6px rgba(0,0,0,0.25);
    cursor: pointer;
    border: 2px solid #fff2d7;
  }
  .intensity-slider::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #ffb882;
    box-shadow: 0 3px 0 #b46f3f, 0 2px 6px rgba(0,0,0,0.25);
    cursor: pointer;
    border: 2px solid #fff2d7;
  }
  .intensity-value {
    font-size: 0.75rem;
    min-width: 34px;
    text-align: right;
    color: #6b3e1c;
    font-weight: 800;
  }

  .upload-btn {
    background: rgba(255, 245, 225, 0.95);
    backdrop-filter: blur(8px);
    border: none;
    border-radius: 16px;
    padding: 11px 14px;
    font-size: 1rem;
    font-weight: 800;
    color: #5e3a1c;
    cursor: pointer;
    box-shadow: inset 0 -3px 0 #dbbd9b, 0 5px 0 #9e7b5b, 0 8px 18px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    gap: 6px;
    text-shadow: 1px 1px 0 #ffe6c0;
    transition: 0.08s;
    font-family: inherit;
    text-align: left;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .upload-btn:active {
    transform: translateY(3px);
    box-shadow: inset 0 -2px 0 #dbbd9b, 0 2px 0 #9e7b5b;
  }
  .upload-btn.uploaded {
    background: #d4f0a8;
    color: #3a5a1c;
  }
  .upload-btn input[type="file"] {
    display: none;
  }
  .count-badge {
    background: #ffeac1;
    border-radius: 12px;
    padding: 2px 8px;
    font-size: 0.72rem;
    color: #6b3e1c;
    cursor: pointer;
    pointer-events: auto;
    font-weight: 800;
  }
  .count-badge:hover {
    background: #ffd88a;
  }

  .top-bar-spacer {
    flex: 1;
    min-width: 0;
  }

  .pause-btn {
    background: #a8d8f0;
    border: none;
    border-radius: 40px;
    padding: 11px 20px;
    font-size: 0.95rem;
    font-weight: 800;
    color: #1f3a4f;
    box-shadow: 0 5px 0 #6a9ab8, 0 6px 18px rgba(0,0,0,0.25);
    cursor: pointer;
    transition: 0.07s;
    font-family: inherit;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 0 #d4ecf8;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .pause-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #6a9ab8;
  }
  .pause-btn.paused {
    background: #ffd88a;
    color: #4a2b10;
    box-shadow: 0 5px 0 #b46f3f, 0 6px 18px rgba(0,0,0,0.25);
  }
  .reset-btn {
    background: #ffb882;
    border: none;
    border-radius: 40px;
    padding: 11px 20px;
    font-size: 0.95rem;
    font-weight: 800;
    color: #4f321b;
    box-shadow: 0 5px 0 #b46f3f, 0 6px 18px rgba(0,0,0,0.25);
    cursor: pointer;
    transition: 0.07s;
    font-family: inherit;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 0 #ffd9b0;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .reset-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #b46f3f;
  }

  .photo-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .photo-modal-backdrop.open { display: flex; }
  .photo-modal {
    background: #fff5e1;
    border-radius: 28px;
    padding: 20px;
    max-width: 700px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .photo-modal h2 {
    font-size: 1.2rem;
    color: #5e3a1c;
    margin-bottom: 12px;
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .photo-modal .close-x {
    background: #ffb882;
    border: none;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-weight: 800;
    font-size: 1rem;
    color: #4f321b;
    box-shadow: 0 3px 0 #b46f3f;
  }
  .photo-modal .close-x:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #b46f3f;
  }
  .photo-modal-hint {
    font-size: 0.78rem;
    color: #8b5a2b;
    font-weight: 700;
    margin-bottom: 12px;
    text-align: center;
    letter-spacing: 0.4px;
  }
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
    touch-action: none;
  }
  .photo-cell {
    position: relative;
    background: #ffeac1;
    border-radius: 14px;
    padding: 6px;
    box-shadow: inset 0 -3px 0 #e6c7a2;
    text-align: center;
    cursor: grab;
    transition: 0.1s;
    touch-action: none;
  }
  .photo-cell:active { cursor: grabbing; }
  .photo-cell:hover {
    background: #ffd88a;
  }
  .photo-cell.placeholder {
    opacity: 0.25;
  }
  .photo-cell.drag-over-cell {
    outline: 3px dashed #b46f3f;
    outline-offset: -3px;
  }
  .photo-cell.dragging-cell {
    opacity: 0.85;
    transform: scale(1.06);
    box-shadow: 0 12px 24px rgba(0,0,0,0.35);
    cursor: grabbing;
    pointer-events: none;
    z-index: 100;
  }
  .photo-cell img {
    width: 100%;
    height: 90px;
    object-fit: contain;
    background: #ffffff;
    border-radius: 10px;
    display: block;
    pointer-events: none;
  }
  .photo-cell .label {
    font-size: 0.7rem;
    color: #8b5a2b;
    font-weight: 800;
    margin-top: 4px;
    pointer-events: none;
  }
  .photo-empty {
    color: #8b5a2b;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 20px 0;
    text-align: center;
  }

  .drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.9;
    transform: translate(-50%, -50%) scale(1.1) rotate(-3deg);
    box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    border-radius: 14px;
    transition: none;
    will-change: left, top;
  }

  .photo-action-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 40;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .photo-action-backdrop.open { display: flex; }
  .photo-action {
    background: #fff5e1;
    border-radius: 24px;
    padding: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    max-width: 340px;
    width: 100%;
    text-align: center;
  }
  .photo-action img {
    width: 100%;
    height: 160px;
    object-fit: contain;
    background: #fff;
    border-radius: 14px;
    margin-bottom: 14px;
    display: block;
  }
  .photo-action h3 {
    color: #5e3a1c;
    font-size: 1rem;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
  }
  .photo-action-btns {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .photo-action-btns button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 12px 8px;
    font-size: 0.85rem;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.3px;
    transition: 0.08s;
  }
  .replace-btn {
    background: #a8d8f0;
    color: #1f3a4f;
    box-shadow: 0 5px 0 #6a9ab8;
    text-shadow: 1px 1px 0 #d4ecf8;
  }
  .replace-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #6a9ab8;
  }
  .duplicate-btn {
    background: #c8e8a8;
    color: #3a5a1c;
    box-shadow: 0 5px 0 #6a9a3a;
    text-shadow: 1px 1px 0 #e0f4c8;
  }
  .duplicate-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #6a9a3a;
  }
  .delete-btn {
    background: #ff8a8a;
    color: #4a1010;
    box-shadow: 0 5px 0 #b03030;
    text-shadow: 1px 1px 0 #ffd4d4;
  }
  .delete-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #b03030;
  }
  .cancel-btn {
    background: #ffd88a;
    color: #4a2b10;
    box-shadow: 0 5px 0 #b46f3f;
    margin-top: 10px;
    width: 100%;
    border: none;
    border-radius: 16px;
    padding: 12px;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
  }
  .cancel-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #b46f3f;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div class="top-bar">
  <div class="weather-panel">
    <button class="weather-toggle" id="weatherToggle">
      <span id="weatherToggleLabel">☀️ Sunny</span>
      <span class="chev">▼</span>
    </button>
    <div class="weather-menu" id="weatherMenu">
      <button class="weather-btn active" data-weather="sunny">☀️ Sunny</button>
      <button class="weather-btn" data-weather="cloudy">☁️ Cloudy</button>
      <button class="weather-btn" data-weather="rainy">🌧️ Rainy</button>
      <button class="weather-btn" data-weather="windy">💨 Windy</button>
      <button class="weather-btn" data-weather="stormy">⛈️ Stormy</button>
      <button class="weather-btn" data-weather="snowy">❄️ Snowy</button>
      <button class="weather-btn" data-weather="foggy">🌫️ Foggy</button>
      <div class="intensity-row">
        <label>Intensity</label>
        <input type="range" min="0" max="100" value="50" class="intensity-slider" id="intensitySlider">
        <span class="intensity-value" id="intensityValue">50%</span>
      </div>
    </div>
  </div>

  <label class="upload-btn" id="foodUploadBtn">
    🍎<span class="count-badge" id="foodPhotoCount">(0)</span>
    <input type="file" id="foodUpload" accept="image/*" multiple>
  </label>

  <label class="upload-btn" id="drinkUploadBtn">
    🥤<span class="count-badge" id="drinkPhotoCount">(0)</span>
    <input type="file" id="drinkUpload" accept="image/*" multiple>
  </label>

  <label class="upload-btn" id="grassUploadBtn">
    🌿<span class="count-badge" id="grassPhotoCount">(0)</span>
    <input type="file" id="grassUpload" accept="image/*" multiple>
  </label>

  <label class="upload-btn" id="rockUploadBtn">
    🪨<span class="count-badge" id="rockPhotoCount">(0)</span>
    <input type="file" id="rockUpload" accept="image/*" multiple>
  </label>

  <label class="upload-btn" id="flowerUploadBtn">
    🌸<span class="count-badge" id="flowerPhotoCount">(0)</span>
    <input type="file" id="flowerUpload" accept="image/*" multiple>
  </label>

  <div class="top-bar-spacer"></div>

  <button class="pause-btn" id="pauseBtn">▶️ Start</button>
  <button class="reset-btn" id="resetBtn">🔄 Play Again</button>
</div>

<div class="photo-modal-backdrop" id="photoModalBackdrop">
  <div class="photo-modal">
    <h2 id="photoModalTitle">Uploaded Photos <button class="close-x" id="photoModalClose">✕</button></h2>
    <div class="photo-modal-hint">✋ Press &amp; hold, then drag to reorder</div>
    <div class="photo-grid" id="photoGrid"></div>
  </div>
</div>

<div class="photo-action-backdrop" id="photoActionBackdrop">
  <div class="photo-action">
    <img id="photoActionPreview" src="" alt="">
    <h3 id="photoActionTitle">Photo</h3>
    <div class="photo-action-btns">
      <button class="replace-btn" id="photoActionReplace">🔄</button>
      <button class="duplicate-btn" id="photoActionDuplicate">📋</button>
      <button class="delete-btn" id="photoActionDelete">🗑️</button>
    </div>
    <button class="cancel-btn" id="photoActionCancel">Cancel</button>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const intensitySlider = document.getElementById('intensitySlider');
  const intensityValue = document.getElementById('intensityValue');
  const weatherToggle = document.getElementById('weatherToggle');
  const weatherToggleLabel = document.getElementById('weatherToggleLabel');
  const weatherMenu = document.getElementById('weatherMenu');
  const foodUpload = document.getElementById('foodUpload');
  const drinkUpload = document.getElementById('drinkUpload');
  const grassUpload = document.getElementById('grassUpload');
  const rockUpload = document.getElementById('rockUpload');
  const flowerUpload = document.getElementById('flowerUpload');
  const foodUploadBtn = document.getElementById('foodUploadBtn');
  const drinkUploadBtn = document.getElementById('drinkUploadBtn');
  const grassUploadBtn = document.getElementById('grassUploadBtn');
  const rockUploadBtn = document.getElementById('rockUploadBtn');
  const flowerUploadBtn = document.getElementById('flowerUploadBtn');
  const foodPhotoCount = document.getElementById('foodPhotoCount');
  const drinkPhotoCount = document.getElementById('drinkPhotoCount');
  const grassPhotoCount = document.getElementById('grassPhotoCount');
  const rockPhotoCount = document.getElementById('rockPhotoCount');
  const flowerPhotoCount = document.getElementById('flowerPhotoCount');
  const pauseBtn = document.getElementById('pauseBtn');
  const photoModalBackdrop = document.getElementById('photoModalBackdrop');
  const photoModalTitle = document.getElementById('photoModalTitle');
  const photoModalClose = document.getElementById('photoModalClose');
  const photoGrid = document.getElementById('photoGrid');
  const photoActionBackdrop = document.getElementById('photoActionBackdrop');
  const photoActionPreview = document.getElementById('photoActionPreview');
  const photoActionTitle = document.getElementById('photoActionTitle');
  const photoActionReplace = document.getElementById('photoActionReplace');
  const photoActionDuplicate = document.getElementById('photoActionDuplicate');
  const photoActionDelete = document.getElementById('photoActionDelete');
  const photoActionCancel = document.getElementById('photoActionCancel');

  let globalUploadCounter = 0;

  const customFoodImages = [];
  const customDrinkImages = [];
  const customGrassImages = [];
  const customRockImages = [];
  const customFlowerImages = [];

  function getList(kind) {
    if (kind === 'food') return customFoodImages;
    if (kind === 'drink') return customDrinkImages;
    if (kind === 'grass') return customGrassImages;
    if (kind === 'rock') return customRockImages;
    if (kind === 'flower') return customFlowerImages;
    return [];
  }

  function entryImg(entry) {
    if (entry && entry.img) return entry.img;
    return entry;
  }

  let pendingReplace = null;

  const replaceInput = document.createElement('input');
  replaceInput.type = 'file';
  replaceInput.accept = 'image/*';
  replaceInput.style.display = 'none';
  document.body.appendChild(replaceInput);

  replaceInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file || !pendingReplace) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      const img = new Image();
      img.onload = () => {
        const list = getList(pendingReplace.kind);
        const old = list[pendingReplace.index];
        if (pendingReplace.kind === 'food' || pendingReplace.kind === 'drink') {
          list[pendingReplace.index] = { img, order: old.order };
        } else {
          list[pendingReplace.index] = img;
        }
        if (pendingReplace.kind === 'food' || pendingReplace.kind === 'drink') rebuildFoods();
        openPhotoModal(pendingReplace.kind);
        pendingReplace = null;
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
    replaceInput.value = '';
  });

  function openPhotoAction(kind, index) {
    const list = getList(kind);
    const entry = list[index];
    if (!entry) return;
    const img = entryImg(entry);

    photoActionPreview.src = img.src;
    const prefix = kind === 'food' ? 'Food #'
                 : kind === 'drink' ? 'Drink #'
                 : kind === 'grass' ? 'Grass #'
                 : kind === 'rock' ? 'Rock #'
                 : 'Flower #';
    photoActionTitle.textContent = prefix + (index + 1);
    photoActionBackdrop.classList.add('open');

    photoActionReplace.onclick = () => {
      pendingReplace = { kind, index };
      replaceInput.click();
    };

    photoActionDuplicate.onclick = () => {
      const original = list[index];
      let copy;
      if (kind === 'food' || kind === 'drink') {
        const newOrder = globalUploadCounter++;
        copy = { img: original.img, order: newOrder };
      } else {
        copy = original;
      }
      list.splice(index + 1, 0, copy);
      updateBadges();
      photoActionBackdrop.classList.remove('open');
      if (kind === 'food' || kind === 'drink') rebuildFoods();
      openPhotoModal(kind);
    };

    photoActionDelete.onclick = () => {
      list.splice(index, 1);
      updateBadges();
      photoActionBackdrop.classList.remove('open');
      if (kind === 'food' || kind === 'drink') rebuildFoods();
      openPhotoModal(kind);
    };

    photoActionCancel.onclick = () => {
      photoActionBackdrop.classList.remove('open');
    };
  }

  photoActionBackdrop.addEventListener('click', (e) => {
    if (e.target === photoActionBackdrop) {
      photoActionBackdrop.classList.remove('open');
    }
  });

  function updateBadges() {
    foodPhotoCount.textContent = `(${customFoodImages.length})`;
    drinkPhotoCount.textContent = `(${customDrinkImages.length})`;
    grassPhotoCount.textContent = `(${customGrassImages.length})`;
    rockPhotoCount.textContent = `(${customRockImages.length})`;
    flowerPhotoCount.textContent = `(${customFlowerImages.length})`;
    if (customFoodImages.length === 0) foodUploadBtn.classList.remove('uploaded');
    if (customDrinkImages.length === 0) drinkUploadBtn.classList.remove('uploaded');
    if (customGrassImages.length === 0) grassUploadBtn.classList.remove('uploaded');
    if (customRockImages.length === 0) rockUploadBtn.classList.remove('uploaded');
    if (customFlowerImages.length === 0) flowerUploadBtn.classList.remove('uploaded');
  }

  function attachUpload(inputEl, list, btnEl, kind) {
    inputEl.addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length === 0) return;

      let loadedCount = 0;
      const total = files.length;

      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            if (kind === 'food' || kind === 'drink') {
              const order = globalUploadCounter++;
              list.push({ img, order });
            } else {
              list.push(img);
            }

            loadedCount++;
            if (loadedCount === total) {
              updateBadges();
              btnEl.classList.add('uploaded');
              if (kind === 'food' || kind === 'drink') rebuildFoods();
            }
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      });

      inputEl.value = '';
    });
  }

  attachUpload(foodUpload, customFoodImages, foodUploadBtn, 'food');

  // -------- Drag-to-reorder --------
  let dragState = null;

  function beginDrag(e, kind, index, cell) {
    if (dragState) return;
    const list = getList(kind);
    const entry = list[index];
    if (!entry) return;

    const rect = cell.getBoundingClientRect();

    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost photo-cell';
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    ghost.style.position = 'fixed';
    ghost.style.left = rect.left + rect.width / 2 + 'px';
    ghost.style.top = rect.top + rect.height / 2 + 'px';

    const ghostImg = document.createElement('img');
    ghostImg.src = entryImg(entry).src;
    ghostImg.draggable = false;
    ghost.appendChild(ghostImg);

    const ghostLabel = document.createElement('div');
    ghostLabel.className = 'label';
    ghostLabel.textContent = cell.querySelector('.label') ? cell.querySelector('.label').textContent : '';
    ghost.appendChild(ghostLabel);

    document.body.appendChild(ghost);
    cell.classList.add('placeholder');

    dragState = {
      kind,
      fromIndex: index,
      toIndex: index,
      ghost,
      pointerId: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      cell,
      moved: false
    };

    try { cell.setPointerCapture(e.pointerId); } catch (err) {}
  }

  function moveDrag(e) {
    if (!dragState) return;
    if (e.pointerId !== dragState.pointerId) return;

    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    if (!dragState.moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
      dragState.moved = true;
    }

    dragState.ghost.style.left = e.clientX + 'px';
    dragState.ghost.style.top = e.clientY + 'px';

    const el = document.elementFromPoint(e.clientX, e.clientY);
    const targetCell = el ? el.closest('.photo-cell') : null;

    document.querySelectorAll('.photo-cell.drag-over-cell').forEach(c => c.classList.remove('drag-over-cell'));

    if (targetCell && !targetCell.classList.contains('placeholder') && targetCell !== dragState.cell) {
      targetCell.classList.add('drag-over-cell');
      const idx = parseInt(targetCell.dataset.index, 10);
      if (!isNaN(idx)) dragState.toIndex = idx;
    }
  }

  function endDrag(e) {
    if (!dragState) return;
    if (e && e.pointerId !== undefined && e.pointerId !== dragState.pointerId) return;

    const { kind, fromIndex, toIndex, ghost, cell, moved } = dragState;

    ghost.remove();
    cell.classList.remove('placeholder');
    document.querySelectorAll('.photo-cell.drag-over-cell').forEach(c => c.classList.remove('drag-over-cell'));

    dragState = null;

    if (!moved) {
      openPhotoAction(kind, fromIndex);
      return;
    }

    if (fromIndex === toIndex) return;

    const list = getList(kind);
    const [item] = list.splice(fromIndex, 1);
    list.splice(toIndex, 0, item);

    if (kind === 'food' || kind === 'drink') rebuildFoods();
    openPhotoModal(kind);
  }

  window.addEventListener('pointermove', moveDrag, { passive: false });
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  function openPhotoModal(kind) {
    const images = getList(kind);
    const title = kind === 'food' ? '🍎 Food Photos'
                : kind === 'drink' ? '🥤 Drink Photos'
                : kind === 'grass' ? '🌿 Grass Photos'

    photoModalTitle.firstChild.nodeValue = title + ' ';
    photoGrid.innerHTML = '';

    if (images.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'photo-empty';
      empty.textContent = 'No photos uploaded yet.';
      photoGrid.appendChild(empty);
    } else {
      images.forEach((entry, idx) => {
        const cell = document.createElement('div');
        cell.className = 'photo-cell';
        cell.dataset.index = idx;

        const preview = document.createElement('img');
        preview.src = entryImg(entry).src;
        preview.draggable = false;
        cell.appendChild(preview);

        const label = document.createElement('div');
        label.className = 'label';
        const prefix = kind === 'food' ? 'Food #'
                     : kind === 'drink' ? 'Drink #'
                     : kind === 'grass' ? 'Grass #'
                     : kind === 'rock' ? 'Rock #'
                     : 'Flower #';
        label.textContent = prefix + (idx + 1);
        cell.appendChild(label);

        cell.addEventListener('pointerdown', (e) => {
          if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
          beginDrag(e, kind, idx, cell);
          e.preventDefault();
        });

        photoGrid.appendChild(cell);
      });
    }

    photoModalBackdrop.classList.add('open');
  }

  let JUMP_VELOCITY = 0;
  let JUMP_GRAVITY  = 0;

  function recomputeJumpPhysics() {
    const baseY     = FOOT_GROUND - FOOT_OFFSET + CHAR_FOOT_SINK;
    const screenBot = CANVAS_H;
    const apexY     = screenBot - CANVAS_H * JUMP_APEX_FRACTION;
    const rise      = baseY - apexY;
    const safeRise  = Math.max(rise, CANVAS_H * 0.25);
    const dt        = 1 / 60;
    const steps     = JUMP_TIME_TO_PEAK / dt;
    JUMP_GRAVITY  = (2 * safeRise) / (steps * steps);
    JUMP_VELOCITY = -(2 * safeRise) / steps;
  }

  function resizeCanvas() {
    CANVAS_W = window.innerWidth;
    CANVAS_H = window.innerHeight;
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;
    GROUND_Y = CANVAS_H * 0.80;
    FOOT_GROUND = GROUND_Y + 2;

    const newBaseY = FOOT_GROUND - FOOT_OFFSET + CHAR_FOOT_SINK;

    if (char.grounded) {
      char.baseY = newBaseY;
      char.y = newBaseY;
      char.vy = 0;
    } else {
      const oldHeightAboveGround = char.baseY - char.y;
      char.baseY = newBaseY;
      char.y = newBaseY - oldHeightAboveGround;
    }

    char.maxX = CANVAS_W * 0.50;
    recomputeJumpPhysics();
  }

  function buildFoods() {
    foods = [];
    portal = null;
    portalSuck = null;
    portalStare = null;
    portalFlares = [];
    portalFlash = 0;
    showFinishReset = false;
    finishResetTimer = 0;

    const combined = [];
    customFoodImages.forEach((entry) => {
      combined.push({ entry, kind: 'food' });
    });
    customDrinkImages.forEach((entry) => {
      combined.push({ entry, kind: 'drink' });
    });

    if (combined.length === 0) return;

    let distance = 400 * ZOOM;
    let lastDistance = 0;
    combined.forEach((item, i) => {
      const gap = (i === 0) ? 400 * ZOOM : randomGap();
      distance += gap;
      lastDistance = distance;
      foods.push({
        worldDistance: distance,
        gap: gap,
        y: GROUND_Y - FOOD_RADIUS,
        radius: FOOD_RADIUS + (i % 3 === 0 ? 3 * ZOOM : 0),
        isDrink: item.kind === 'drink',
        image: item.entry.img,
        eaten: false,
        triggered: false,
        bobPhase: Math.random() * Math.PI * 2,
        eatSquash: 1
      });
    });

    // Portal spawns a random distance after the last food/drink.
    const portalGap = (400 + Math.random() * 500) * ZOOM;
    portal = {
      worldDistance: lastDistance + portalGap,
      swingPhase: 0,
      openProgress: 0,
      radius: 55 * ZOOM,
      activated: false
    };
  }

  function buildItemType(list, count, minSize, maxSize, yOffsetRange) {
    const items = [];
    if (list.length === 0) return items;

    const TOTAL_DISTANCE = 30000;
    for (let i = 0; i < count; i++) {
      const worldX = Math.random() * TOTAL_DISTANCE;
      const imgIndex = Math.floor(Math.random() * list.length);
      const size = (minSize + Math.random() * (maxSize - minSize)) * ZOOM;
      const yOffset = (Math.random() - 0.5) * yOffsetRange;
      const swayPhase = Math.random() * Math.PI * 2;

      items.push({ worldX, imgIndex, size, yOffset, swayPhase });
    }
    return items;
  }

  function buildRoadsideItems() {
    grassItems = buildItemType(customGrassImages, 100, 20, 38, 4);
    rockItems  = buildItemType(customRockImages,   40, 14, 26, 2);
    flowerItems = buildItemType(customFlowerImages, 60, 18, 30, 3);
  }

  function rebuildFoods() {
    buildFoods();
    if (gameState === 'idle') {
      foodEaten = 0;
    }
  }

  function startArrival() {
    // Character falls out of a portal at the beginning.
    // Portal appears high above and slightly to the right of the character.
    const portalX = CANVAS_W * 0.30 + 40 * ZOOM;
    const portalY = GROUND_Y - 260 * ZOOM;
    const baseY = FOOT_GROUND - FOOT_OFFSET + CHAR_FOOT_SINK;

    arrival = {
      timer: 0,
      totalTime: 70,       // ~1.15s of falling

      portalY,

    foodEaten = 0;

    flyingFood = null;
