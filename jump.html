  function beginPlay() {
    // Called when the user presses Start or Play Again.
    // Character arrives by falling out of a portal.
    foodEaten = 0;
    gameActive = true;
    worldOffset = 0;
    flyingFood = null;
    sippingDrink = null;
    portalSuck = null;
    portalStare = null;
    portalFlares = [];
    portalFlash = 0;
    showFinishReset = false;
    finishResetTimer = 0;

    char.eatingTimer = 0;
    char.facingFront = 0;
    char.facingTarget = 0;
    char.walkPhase = 0;
    char.grounded = false;
    char.landingSettle = 0;
    char.pendingFood = null;
    char.squash = 0.7;
    char.squashVel = 0;

    char.walkDuration = 1.0 + Math.random() * 1.5;
    char.nextJumpAt = char.walkDuration;

    startArrival();
  }

  function inWalkZone() {
    const nextFood = foods.find(f => !f.triggered);
    if (!nextFood) return false;
    const foodScreenX = char.screenX + (nextFood.worldDistance - worldOffset);
    const standoffScreenX = char.screenX + EAT_STANDOFF;
    const remaining = foodScreenX - standoffScreenX;
    const walkZoneWidth = nextFood.gap * WALK_ZONE_FRACTION;
    return remaining <= walkZoneWidth;
  }

  function getMouthPos() {
    return {
      x: char.screenX,
      y: char.y + 10 * ZOOM * (char.squash)
    };
  }

  function hasTouchedFood(nextFood) {
    if (!nextFood) return false;
    const foodScreenX = char.screenX + (nextFood.worldDistance - worldOffset);
    const foodLeftEdge = foodScreenX - nextFood.radius;
    const charRightEdge = char.screenX + char.radius;
    return foodLeftEdge <= charRightEdge - 1;
  }

  function triggerConsume(nextFood) {
    if (!nextFood) return;

    const foodScreenX = char.screenX + (nextFood.worldDistance - worldOffset);

    if (nextFood.isDrink) {
      sippingDrink = {
        food: nextFood,
        worldDistance: nextFood.worldDistance,
        originalY: nextFood.y,
        timer: 0,
        phase: 'fizz',
        image: nextFood.image,
        burpBubbles: []
      };
      nextFood.triggered = true;
      foodEaten++;

      char.state = 'drinking';
      char.grounded = true;
      char.squash = 0.92;
      char.squashVel = 0.05;
    } else {
      const startX = foodScreenX;
      const startY = nextFood.y;

      flyingFood = {
        startX: startX,
        startY: startY,
        t: 0,
        radius: nextFood.radius,
        image: nextFood.image,
        rotation: 0,
        spin: (Math.random() - 0.5) * 0.4
      };

      nextFood.triggered = true;
      nextFood.eaten = true;
      nextFood.eatSquash = 0.6;
      foodEaten++;

      char.state = 'eating';
      char.eatingTimer = 0;
      char.vy = 0;
      char.y = char.baseY;
      char.grounded = true;
      char.squash = 0.92;
      char.squashVel = 0.05;
    }
  }

  // Called when character first reaches portal: stop, stare.
  function startPortalStare() {
    if (!portal || portal.activated || portalStare || portalSuck) return;
    portalStare = {
      timer: 0,
      totalTime: 90   // ~1.5s stare
    };
    portal.activated = true;
    char.state = 'staring';
    char.grounded = true;
    char.vy = 0;
    char.y = char.baseY;
    char.squash = 1;
    char.squashVel = 0;
  }

  // After staring, launch the suction.
  function startPortalSuck() {
    if (!portal || portalSuck) return;

    const portalScreenX = char.screenX + (portal.worldDistance - worldOffset);
    const portalCenterY = GROUND_Y - portal.radius * 0.9;

    portalSuck = {
      timer: 0,
      totalTime: 55,   // fast yank
      startX: char.screenX,
      startY: char.y,
      targetScreenX: portalScreenX,
      targetScreenY: portalCenterY
    };

    char.state = 'sucked';
    char.grounded = false;
    char.vy = 0;
  }

  function update() {
    const dt = 1 / 60;

    char.blink = (char.blink + 0.025) % (Math.PI * 2);
    updateWeatherParticles();

    if (portal) {
      portal.swingPhase += 0.05;

      const distToPortal = portal.worldDistance - worldOffset;
      const proximity = Math.max(0, Math.min(1, 1 - distToPortal / (900 * ZOOM)));
      portal.openProgress = proximity;

      if (gameState === 'running' && !portal.activated && !portalStare && !portalSuck) {
        const portalScreenX = char.screenX + (portal.worldDistance - worldOffset);
        if (portalScreenX > -200 && portalScreenX < CANVAS_W + 200) {
          if (Math.random() < 0.45) {
            const angle = Math.random() * Math.PI * 2;
            const r = portal.radius * (0.9 + Math.random() * 1.3);
            portalFlares.push({
              x: portalScreenX + Math.cos(angle) * r,
              y: GROUND_Y - portal.radius * 0.9 + Math.sin(angle) * r,
              vx: (Math.random() - 0.5) * 2.5,
              vy: -1 - Math.random() * 2.5,
              life: 1,
              size: 2 + Math.random() * 4,
              hue: 40 + Math.random() * 40
            });
          }
        }
      }
    }

    for (const fl of portalFlares) {
      fl.x += fl.vx;
      fl.y += fl.vy;
      fl.vy += 0.03;
      fl.life -= 0.015;
    }
    portalFlares = portalFlares.filter(fl => fl.life > 0);

    if (portalFlash > 0) {
      portalFlash -= 0.02;
      if (portalFlash < 0) portalFlash = 0;
    }

    if (showFinishReset) {
      finishResetTimer -= 1;
      if (finishResetTimer <= 0) {
        // Auto restart with another arrival
        resetGame();
        gameState = 'running';
        pauseBtn.classList.remove('paused');
        pauseBtn.textContent = '⏸️ Pause';
        beginPlay();
      }
      updateScenery(0.15);
      return;
    }

    if (gameState !== 'running') return;
    if (isDragging) return;

    char.squashVel += (1 - char.squash) * 0.25;
    char.squashVel *= 0.75;
    char.squash += char.squashVel;

    for (const f of foods) {
      if (f.eatSquash < 1) f.eatSquash += 0.05;
    }

    char.facingTarget = 0;
    char.facingFront += (char.facingTarget - char.facingFront) * 0.14;

    if (flyingFood) {
      flyingFood.t += 1 / FLY_DURATION;
      if (flyingFood.t >= 1) {
        flyingFood = null;
      }
    }

    if (sippingDrink) {
      sippingDrink.timer++;

      if (sippingDrink.phase === 'fizz') {
        if (sippingDrink.timer >= char.DRINK_FIZZ_DURATION) {
          sippingDrink.phase = 'return';
          sippingDrink.timer = 0;
        }
      } else if (sippingDrink.phase === 'return') {
        const returnProgress = Math.min(1, sippingDrink.timer / char.DRINK_RETURN_DURATION);
        if (returnProgress >= 1) {
          sippingDrink.phase = 'burp';
          sippingDrink.timer = 0;
          sippingDrink.burpBubbles = [];
          for (let i = 0; i < 12; i++) {
            sippingDrink.burpBubbles.push({
              x: 0,
              y: 0,
              vx: (Math.random() - 0.5) * 3,
              vy: -1.5 - Math.random() * 2.5,
              r: 3 + Math.random() * 5,
              life: 1
            });
          }
        }
      } else if (sippingDrink.phase === 'burp') {
        for (const b of sippingDrink.burpBubbles) {
          b.x += b.vx;
          b.y += b.vy;
          b.vy += 0.08;
          b.life -= 0.02;
        }
        sippingDrink.burpBubbles = sippingDrink.burpBubbles.filter(b => b.life > 0);

        if (sippingDrink.timer >= char.DRINK_BURP_DURATION) {
          sippingDrink = null;
          char.state = 'walking';
          char.grounded = true;
          char.walkDuration = 0.8 + Math.random() * 1.5;
          char.nextJumpAt = char.walkDuration;
        }
      }
    }

    // ---- Arrival animation ----
    if (arrival) {
      arrival.timer++;
      arrival.portalFadeIn = Math.min(1, arrival.timer / 20);
      const t = Math.min(1, arrival.timer / arrival.totalTime);
      const eased = t * t;  // accelerate downward (gravity-like)

      const fallArc = Math.sin(t * Math.PI) * 6 * ZOOM;

      char.screenX = arrival.startX + (CANVAS_W * 0.30 - arrival.startX) * eased + fallArc;
      char.y = arrival.startY + (arrival.targetY - arrival.startY) * eased;

      char.squash = 0.72 + eased * 0.28;

      // Flares burst around arrival portal
      if (arrival.timer < 25 && Math.random() < 0.7) {
        const angle = Math.random() * Math.PI * 2;
        const r = portal ? portal.radius : 55 * ZOOM;
        portalFlares.push({
          x: arrival.portalX + Math.cos(angle) * r,
          y: arrival.portalY + Math.sin(angle) * r,
          vx: (Math.random() - 0.5) * 3,
          vy: (Math.random() - 0.5) * 3,
          life: 1,
          size: 3 + Math.random() * 5,
          hue: 40 + Math.random() * 40
        });
      }

      if (t >= 1) {
        char.y = arrival.targetY;
        char.baseY = arrival.targetY;
        char.grounded = true;
        char.state = 'walking';
        char.vy = 0;
        char.squash = 0.78;
        char.squashVel = 0.14;
        char.walkDuration = 0.9 + Math.random() * 1.2;
        char.nextJumpAt = char.walkDuration;
        arrival = null;
      }

      updateScenery(WALK_SPEED * 0.4);
      return;
    }

    // ---- Portal suction ----
    if (portalSuck) {
      portalSuck.timer++;
      const t = Math.min(1, portalSuck.timer / portalSuck.totalTime);
      const eased = t * t * (3 - 2 * t);

      const startX = portalSuck.startX;
      const startY = portalSuck.startY;
      const tgtX = portalSuck.targetScreenX;
      const tgtY = portalSuck.targetScreenY;

      const spiral = Math.sin(t * Math.PI * 8) * (1 - t) * 26 * ZOOM;
      const wobbleY = Math.cos(t * Math.PI * 8) * (1 - t) * 16 * ZOOM;

      char.screenX = startX + (tgtX - startX) * eased + spiral;
      char.y = startY + (tgtY - startY) * eased + wobbleY;

      const shrink = 1 - eased * 0.9;
      char.squash = Math.max(0.05, shrink);

      portalFlash = Math.min(1, portalFlash + 0.03 + eased * 0.06);

      if (Math.random() < 0.8) {
        const angle = Math.random() * Math.PI * 2;
        const radius = (portal ? portal.radius * 2 : 110 * ZOOM) * (0.5 + Math.random());
        portalFlares.push({
          x: tgtX + Math.cos(angle) * radius,
          y: tgtY + Math.sin(angle) * radius,
          vx: (tgtX - (tgtX + Math.cos(angle) * radius)) * 0.05,
          vy: (tgtY - (tgtY + Math.sin(angle) * radius)) * 0.05,
          life: 1,
          size: 2 + Math.random() * 5,
          hue: 40 + Math.random() * 50
        });
      }

      if (t >= 1) {
        portalSuck = null;
        char.screenX = tgtX;
        char.y = tgtY;
        char.squash = 0.02;
        portalFlash = 1;
        showFinishReset = true;
        finishResetTimer = 100;
      }

      updateScenery(WALK_SPEED * 0.15);
      return;
    }

    if (!gameActive) {
      updateScenery(WALK_SPEED * 0.2);
      return;
    }

    if (char.state === 'sucked') {
      updateScenery(WALK_SPEED * 0.15);
      return;
    }

    // ---- Staring at portal ----
    if (char.state === 'staring' && portalStare) {
      portalStare.timer++;
      char.squash = 1 + Math.sin(portalStare.timer * 0.15) * 0.03;

      if (portalStare.timer >= portalStare.totalTime) {
        portalStare = null;
        startPortalSuck();
      }
      return;
    }

    if (char.state === 'eating') {
      char.eatingTimer++;
      char.y = char.baseY;
      char.vy = 0;
      char.grounded = true;
      const chewPulse = Math.sin(char.eatingTimer * 0.35) * 0.04;
      char.squash = 0.94 + chewPulse;

      updateScenery(0.15);

      if (char.eatingTimer >= char.EAT_DURATION) {
        char.eatingTimer = 0;
        char.state = 'walking';
        char.grounded = true;
        char.walkDuration = 0.8 + Math.random() * 1.5;
        char.nextJumpAt = char.walkDuration;
        char.squash = 0.9;
        char.squashVel = 0.06;
      }
      return;
    }

    if (char.state === 'drinking') {
      char.y = char.baseY;
      char.vy = 0;
      char.grounded = true;

      if (sippingDrink && sippingDrink.phase === 'fizz') {
        const fizzWobble = Math.sin(Date.now() * 0.03) * 0.04;
        char.squash = 0.96 + fizzWobble;
      } else if (sippingDrink && sippingDrink.phase === 'burp') {
        const burpWobble = Math.sin(Date.now() * 0.06) * 0.08;
        char.squash = 0.94 + burpWobble;
      }

      updateScenery(0.15);
      return;
    }

    if (char.landingSettle > 0) {
      char.landingSettle -= 1;

      if (char.landingSettle <= 0) {
        const food = char.pendingFood;
        char.pendingFood = null;
        if (food && !food.triggered) {
          triggerConsume(food);
          return;
        }
      }
      return;
    }

    const nextFood = foods.find(f => !f.triggered);

    if (nextFood && hasTouchedFood(nextFood)) {
      if (char.state === 'jumping') {
        char.pendingFood = nextFood;
      } else {
        triggerConsume(nextFood);
        return;
      }
    }

    // If no food left and portal exists, walk to it and trigger stare.
    if (!nextFood && portal && !portal.activated && !portalStare && !portalSuck) {
      const portalScreenX = char.screenX + (portal.worldDistance - worldOffset);
      const portalLeftEdge = portalScreenX - portal.radius;
      const charRightEdge = char.screenX + char.radius;
      if (portalLeftEdge <= charRightEdge + 20 * ZOOM) {
        startPortalStare();
        return;
      }
    }

    char.stateTimer += dt;

    if (char.state === 'walking') {
      worldOffset += WALK_SPEED;
      char.walkPhase += 0.18;

      if (nextFood) {
        if (inWalkZone()) {
          char.nextJumpAt = 9999;
        } else {
          char.nextJumpAt -= dt;
          if (char.nextJumpAt <= 0) {
            char.state = 'jumping';
            char.grounded = false;
            char.vy = JUMP_VELOCITY;
            char.squash = 0.82;
            char.squashVel = 0.12;
          }
        }
      } else {
        char.nextJumpAt = 9999;
      }
    } else if (char.state === 'jumping') {
      worldOffset += JUMP_SPEED;

      char.vy += JUMP_GRAVITY;
      char.y += char.vy;

      if (char.y >= char.baseY) {
        char.y = char.baseY;
        char.vy = 0;
        char.grounded = true;
        char.squash = 0.86;
        char.squashVel = 0.08;

        char.state = 'walking';

        if (char.pendingFood) {
          char.landingSettle = 10;
        } else if (nextFood && inWalkZone()) {
          char.nextJumpAt = 9999;
        } else if (nextFood) {
          char.walkDuration = 0.7 + Math.random() * 1.8;
          char.nextJumpAt = char.walkDuration;
        } else {
          char.nextJumpAt = 9999;
        }
      }
    }

    updateScenery(char.state === 'jumping' ? JUMP_SPEED : WALK_SPEED);
  }

  function updateWeatherParticles() {
    const intensity = weather.intensity;
    const type = weather.type;
    const now = Date.now();

    if (type === 'windy' || type === 'stormy') {
      weather.gustTimer -= 1/60;
      if (weather.gustTimer <= 0) {
        weather.gustActive = !weather.gustActive || Math.random() < 0.5;
        weather.gustTimer = 0.4 + Math.random() * 1.6;
        weather.gustStrength = weather.gustActive ? (0.6 + Math.random() * 0.8) : 0.15;
      }
    } else {
      weather.gustStrength = 0;
    }

    weather.windTime += 0.016;

    if (type === 'rainy' || type === 'stormy') {
      const windDrift = (type === 'stormy' ? -2.5 : -1.2) * (0.4 + intensity);
      for (const d of rainDrops) {
        d.y += d.speed * (0.5 + intensity * 0.8);
        d.x += windDrift;
        if (d.y > CANVAS_H) { d.y = -20; d.x = Math.random() * CANVAS_W; }
        if (d.x < -30) d.x = CANVAS_W + 20;
      }
    }

    if (type === 'snowy') {
      for (const s of snowFlakes) {
        s.swayPhase += s.swaySpeed;
        s.y += s.speed * (0.4 + intensity * 0.9);
        s.x += Math.sin(s.swayPhase) * 0.7 * (0.3 + intensity);
        if (s.y > CANVAS_H) { s.y = -10; s.x = Math.random() * CANVAS_W; }
        if (s.x < -10) s.x = CANVAS_W + 10;
        if (s.x > CANVAS_W + 10) s.x = -10;
      }
    }

    if (type === 'windy' || type === 'stormy') {
      const baseMult = type === 'stormy' ? 2.5 : 1.8;
      const gustMult = 1 + weather.gustStrength * 1.5;
      const windMult = baseMult * (0.5 + intensity) * gustMult;

      for (const w of windStreaks) {
        w.x -= w.speed * windMult;
        w.y += Math.sin(now * 0.002 + w.x * 0.01) * 0.3;
        if (w.x < -w.len - 10) {
          w.x = CANVAS_W + 40;
          w.y = Math.random() * (GROUND_Y * 0.9);
          w.len = 80 + Math.random() * 160;
          w.thickness = 1.5 + Math.random() * 2.5;
          w.opacity = 0.4 + Math.random() * 0.5;
        }
      }

      for (const leaf of windLeaves) {
        leaf.swayPhase += leaf.swaySpeed;
        leaf.x -= leaf.speed * windMult;
        leaf.y += Math.sin(leaf.swayPhase) * 1.5;
        leaf.rotation += leaf.rotSpeed * (1 + weather.gustStrength);
        if (leaf.x < -40) {
          leaf.x = CANVAS_W + 30 + Math.random() * 100;
          leaf.y = 60 + Math.random() * (GROUND_Y * 0.85);
          leaf.speed = 6 + Math.random() * 8;
        }
      }
    }

    if (type === 'foggy') {
      for (const p of fogBanks) {
        p.wobblePhase += p.wobbleSpeed;
        p.x -= p.speed * (0.4 + intensity * 0.8);
        p.y += Math.sin(p.wobblePhase) * 0.15;
        if (p.x < -p.w / 2 - 100) {
          p.x = CANVAS_W + p.w / 2 + Math.random() * 200;
          p.y = GROUND_Y * 0.15 + Math.random() * (GROUND_Y * 0.9);
          p.w = 180 + Math.random() * 280;
          p.h = 80 + Math.random() * 120;
          p.opacity = 0.35 + Math.random() * 0.35;
        }
      }
    }

    if (type === 'stormy') {
      if (Math.random() < 0.004 * (0.5 + intensity * 1.5)) {
        lightningFlashes.push({
          life: 12, maxLife: 12,
          strength: 0.4 + Math.random() * 0.5
        });
      }
      for (let i = lightningFlashes.length - 1; i >= 0; i--) {
        lightningFlashes[i].life--;
        if (lightningFlashes[i].life <= 0) lightningFlashes.splice(i, 1);
      }
    }
  }

  function initScenery() {
    clouds = [];
    for (let i = 0; i < 7; i++) {
      clouds.push({
        worldX: Math.random() * CANVAS_W * 2,
        y: 40 + SKY_SHIFT + Math.random() * (GROUND_Y * 0.35),
        scale: 0.6 + Math.random() * 0.8,
        speed: 0.15 + Math.random() * 0.2
      });
    }
    hills = [];
    for (let i = 0; i < 6; i++) {
      hills.push({
        worldX: i * 300 + Math.random() * 100,
        width: 200 + Math.random() * 150,
        height: 60 + Math.random() * 50,
        speed: 0.4
      });
    }
  }

  function initWeatherParticles() {
    rainDrops = [];
    snowFlakes = [];
    windStreaks = [];
    windLeaves = [];
    fogBanks = [];
    lightningFlashes = [];

    for (let i = 0; i < 200; i++) {
      rainDrops.push({
        x: Math.random() * CANVAS_W,
        y: Math.random() * CANVAS_H,
        len: 8 + Math.random() * 14,
        speed: 8 + Math.random() * 10
      });
    }
    for (let i = 0; i < 120; i++) {
      snowFlakes.push({
        x: Math.random() * CANVAS_W,
        y: Math.random() * CANVAS_H,
        r: 1.5 + Math.random() * 3,
        speed: 0.5 + Math.random() * 1.2,
        swayPhase: Math.random() * Math.PI * 2,
        swaySpeed: 0.02 + Math.random() * 0.04
      });
    }
    for (let i = 0; i < 40; i++) {
      windStreaks.push({
        x: Math.random() * CANVAS_W,
        y: Math.random() * (GROUND_Y * 0.9),
        len: 80 + Math.random() * 160,
        speed: 10 + Math.random() * 12,
        thickness: 1.5 + Math.random() * 2.5,
        opacity: 0.4 + Math.random() * 0.5
      });
    }
    for (let i = 0; i < 30; i++) {
      windLeaves.push({
        x: Math.random() * CANVAS_W,
        y: 60 + Math.random() * (GROUND_Y * 0.85),
        size: 6 + Math.random() * 8,
        speed: 6 + Math.random() * 8,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.4,
        swayPhase: Math.random() * Math.PI * 2,
        swaySpeed: 0.08 + Math.random() * 0.1,
        color: ['#7ec850', '#a8d858', '#ffb84d', '#ff9f7c', '#e8c860'][Math.floor(Math.random() * 5)]
      });
    }
    for (let i = 0; i < 14; i++) {
      fogBanks.push({
        x: Math.random() * (CANVAS_W + 400) - 200,
        y: GROUND_Y * 0.15 + Math.random() * (GROUND_Y * 0.9),
        w: 180 + Math.random() * 280,
        h: 80 + Math.random() * 120,
        speed: 0.3 + Math.random() * 0.6,
        opacity: 0.35 + Math.random() * 0.35,
        wobblePhase: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.008 + Math.random() * 0.012
      });
    }
  }

  function updateScenery(speed) {
    let windBoost = 0;
    if (weather.type === 'windy') windBoost = (0.6 + weather.gustStrength * 0.8) * weather.intensity;
    if (weather.type === 'stormy') windBoost = (1.2 + weather.gustStrength * 1.2) * weather.intensity;

    const effectiveSpeed = speed + windBoost;

    for (const c of clouds) {
      c.worldX -= effectiveSpeed * c.speed;
      if (c.worldX < -300 * c.scale) {
        c.worldX = CANVAS_W + 200 + Math.random() * 300;
        c.y = 40 + SKY_SHIFT + Math.random() * (GROUND_Y * 0.35);
        c.scale = 0.6 + Math.random() * 0.8;
      }
    }
    for (const h of hills) {
      h.worldX -= effectiveSpeed * h.speed;
      if (h.worldX + h.width < -100) {
        const maxX = Math.max(...hills.map(x => x.worldX), CANVAS_W);
        h.worldX = maxX + 200 + Math.random() * 300;
        h.width = 200 + Math.random() * 150;
        h.height = 60 + Math.random() * 50;
      }
    }
    for (const r of grassItems) r.swayPhase += 0.08;
    for (const r of rockItems) r.swayPhase += 0.08;
    for (const r of flowerItems) r.swayPhase += 0.08;
  }

  function lerpColor(a, b, t) {
    t = Math.max(0, Math.min(1, t));
    const ah = a.replace('#',''), bh = b.replace('#','');
    const ar = parseInt(ah.substr(0,2),16), ag = parseInt(ah.substr(2,2),16), ab = parseInt(ah.substr(4,2),16);
    const br = parseInt(bh.substr(0,2),16), bg = parseInt(bh.substr(2,2),16), bb = parseInt(bh.substr(4,2),16);
    const rr = Math.round(ar + (br - ar) * t);
    const rg = Math.round(ag + (bg - ag) * t);
    const rb = Math.round(ab + (bb - ab) * t);
    return `rgb(${rr},${rg},${rb})`;
  }

  function getSkyColors() {
    const i = weather.intensity;
    const type = weather.type;
    let top = '#9dd6f5', mid = '#c2e8fa', bot = '#e3f4fd';

    if (type === 'cloudy') {
      top = lerpColor('#9dd6f5', '#8a9db0', 0.3 + i * 0.5);
      mid = lerpColor('#c2e8fa', '#b0bcc7', 0.3 + i * 0.5);
      bot = lerpColor('#e3f4fd', '#cfd8de', 0.3 + i * 0.5);
    } else if (type === 'rainy') {
      top = lerpColor('#9dd6f5', '#5a6b7a', 0.4 + i * 0.5);
      mid = lerpColor('#c2e8fa', '#7a8a96', 0.4 + i * 0.5);
      bot = lerpColor('#e3f4fd', '#9aa8b2', 0.4 + i * 0.5);
    } else if (type === 'stormy') {
      top = lerpColor('#9dd6f5', '#2d3742', 0.5 + i * 0.5);
      mid = lerpColor('#c2e8fa', '#4a545e', 0.5 + i * 0.5);
      bot = lerpColor('#e3f4fd', '#5e6870', 0.5 + i * 0.5);
    } else if (type === 'snowy') {
      top = lerpColor('#9dd6f5', '#c5d8e8', 0.4 + i * 0.4);
      mid = lerpColor('#c2e8fa', '#dde8f2', 0.4 + i * 0.4);
      bot = lerpColor('#e3f4fd', '#f0f5fa', 0.4 + i * 0.4);
    } else if (type === 'foggy') {
      top = lerpColor('#9dd6f5', '#c0c8d0', 0.5 + i * 0.4);
      mid = lerpColor('#c2e8fa', '#d0d6dc', 0.5 + i * 0.4);
      bot = lerpColor('#e3f4fd', '#e0e4e8', 0.5 + i * 0.4);
    } else if (type === 'windy') {
      top = lerpColor('#9dd6f5', '#b0d4ec', 0.3 + i * 0.3);
      mid = lerpColor('#c2e8fa', '#cfe8f5', 0.3 + i * 0.3);
      bot = lerpColor('#e3f4fd', '#e8f5fd', 0.3 + i * 0.3);
    }
    return { top, mid, bot };
  }

  function drawCloud(sx, sy, s) {
    const baseW = 130 * s;
    const baseH = 30 * s;
    const baseY = sy + 4 * s;
    const r = baseH / 2;

    ctx.beginPath();
    ctx.moveTo(sx - baseW/2 + r, baseY - baseH/2);
    ctx.lineTo(sx + baseW/2 - r, baseY - baseH/2);
    ctx.quadraticCurveTo(sx + baseW/2, baseY - baseH/2, sx + baseW/2, baseY);
    ctx.quadraticCurveTo(sx + baseW/2, baseY + baseH/2, sx + baseW/2 - r, baseY + baseH/2);
    ctx.lineTo(sx - baseW/2 + r, baseY + baseH/2);
    ctx.quadraticCurveTo(sx - baseW/2, baseY + baseH/2, sx - baseW/2, baseY);
    ctx.quadraticCurveTo(sx - baseW/2, baseY - baseH/2, sx - baseW/2 + r, baseY - baseH/2);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.arc(sx - 42 * s, sy - 4 * s, 26 * s, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(sx - 8 * s, sy - 22 * s, 34 * s, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(sx + 28 * s, sy - 16 * s, 30 * s, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(sx + 56 * s, sy - 2 * s, 22 * s, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(sx + 6 * s, sy - 40 * s, 16 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawCircularPortal(cx, cy, radius, open, extraBright) {
    ctx.save();
    ctx.translate(cx, cy);

    const r = radius * (0.55 + open * 0.45);

    // Soft halo
    const haloR = r * 2.1;
    const haloGrad = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, haloR);
    haloGrad.addColorStop(0, `rgba(255, 245, 200, ${0.6 * open})`);
    haloGrad.addColorStop(0.5, `rgba(255, 200, 100, ${0.3 * open})`);
    haloGrad.addColorStop(1, 'rgba(255, 200, 100, 0)');
    ctx.fillStyle = haloGrad;
    ctx.beginPath();
    ctx.arc(0, 0, haloR, 0, Math.PI * 2);
    ctx.fill();

    // Outer ring
    const ringGrad = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 1.15);
    ringGrad.addColorStop(0, `rgba(255, 255, 220, ${0.95 * open})`);
    ringGrad.addColorStop(0.7, `rgba(255, 210, 120, ${0.55 * open})`);
    ringGrad.addColorStop(1, 'rgba(255, 170, 80, 0)');
    ctx.fillStyle = ringGrad;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.15, 0, Math.PI * 2);
    ctx.fill();

    // Circle body — bright core
    const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    coreGrad.addColorStop(0, '#ffffff');
    coreGrad.addColorStop(0.55, '#fff5c8');
    coreGrad.addColorStop(1, '#ffd27a');
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // Inner brighter ring accent
    ctx.strokeStyle = `rgba(255, 240, 160, ${0.85 * open})`;
    ctx.lineWidth = 3 * ZOOM * (0.6 + open * 0.4);
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.92, 0, Math.PI * 2);
    ctx.stroke();

    // White center point
    ctx.fillStyle = `rgba(255, 255, 255, ${0.75 + extraBright * 0.25})`;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2);
    ctx.fill();

    // Rotating sparkles
    const tt = Date.now() * 0.005;
    for (let i = 0; i < 8; i++) {
      const a = tt + i * 0.785;
      const sx = Math.cos(a) * r * 0.7;
      const sy = Math.sin(a) * r * 0.7;
      const alpha = 0.4 + Math.sin(tt * 3 + i) * 0.4;
      ctx.fillStyle = `rgba(255, 255, 220, ${alpha * open})`;
      ctx.beginPath();
      ctx.arc(sx, sy, 2.2 * ZOOM, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawPortal() {
    if (!portal) return;
    const screenX = char.screenX + (portal.worldDistance - worldOffset);
    if (screenX < -250 || screenX > CANVAS_W + 250) return;

    const open = Math.max(0.35, portal.openProgress);
    const centerY = GROUND_Y - portal.radius * 0.9;

    drawCircularPortal(screenX, centerY, portal.radius, open, 0);

    // Ground light pool
    const poolGrad = ctx.createRadialGradient(screenX, GROUND_Y + 4, 0, screenX, GROUND_Y + 4, portal.radius * 1.6);
    poolGrad.addColorStop(0, `rgba(255, 240, 180, ${0.55 * open})`);
    poolGrad.addColorStop(1, 'rgba(255, 240, 180, 0)');
    ctx.fillStyle = poolGrad;
    ctx.beginPath();
    ctx.ellipse(screenX, GROUND_Y + 4, portal.radius * 1.6, 14 * ZOOM, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawArrivalPortal() {
    if (!arrival || !portal) return;
    const fade = arrival.portalFadeIn;
    drawCircularPortal(arrival.portalX, arrival.portalY, portal.radius * 0.9, fade, fade * 0.4);
  }

  function drawPortalFlares() {
    for (const fl of portalFlares) {
      const alpha = Math.max(0, fl.life);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(fl.x, fl.y, 0, fl.x, fl.y, fl.size * 3);
      g.addColorStop(0, `hsla(${fl.hue}, 100%, 90%, ${alpha})`);
      g.addColorStop(0.4, `hsla(${fl.hue}, 100%, 70%, ${alpha * 0.5})`);
      g.addColorStop(1, `hsla(${fl.hue}, 100%, 60%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(fl.x, fl.y, fl.size * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawCharacter() {
    const cx = char.screenX;
    const cy = char.y;
    const squash = char.squash;
    const stretch = 1 / Math.max(0.7, squash);

    const heightAboveGround = char.baseY - char.y;
    const heightFactor = Math.max(0.3, 1 - heightAboveGround / (200 * ZOOM));

    // Shadow only when on / near ground
    if (char.state !== 'sucked' && char.state !== 'arriving') {
      ctx.beginPath();
      ctx.ellipse(cx, GROUND_Y + 2, 40 * ZOOM * heightFactor, 10 * ZOOM * heightFactor, 0, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,0,0,${0.18 * heightFactor})`;
      ctx.fill();
    }

    let tilt = 0;
    if (char.state === 'walking' && gameState === 'running' && !isDragging) {
      tilt = Math.sin(char.walkPhase) * 0.08;
    }

    let windTilt = 0;
    if (weather.type === 'windy') windTilt = -(0.05 + weather.gustStrength * 0.1) * weather.intensity;
    if (weather.type === 'stormy') windTilt = -(0.12 + weather.gustStrength * 0.15) * weather.intensity;

    let leanIn = 0;
    if (char.state === 'eating' || char.state === 'drinking') {
      leanIn = 0.06;
    } else if (char.state === 'staring') {
      // Lean slightly forward toward the portal
      leanIn = 0.05;
    }

    let footStride = 0;
    let footY = 0;
    if (char.state === 'walking' && gameState === 'running' && !isDragging && char.landingSettle <= 0) {
      footStride = Math.sin(char.walkPhase) * 8;
      footY = Math.abs(Math.sin(char.walkPhase)) * -3;
    } else if (char.state === 'jumping') {
      footStride = 12;
      footY = -4;
    } else if (char.state === 'arriving') {
      footStride = 10;
      footY = -6;
    }

    let armSwing = 0;
    if (char.state === 'walking' && gameState === 'running' && !isDragging && char.landingSettle <= 0) {
      armSwing = Math.sin(char.walkPhase) * 0.35;
    } else if (char.state === 'jumping') {
      armSwing = -0.5;
    } else if (char.state === 'sucked') {
      armSwing = -0.9 + Math.sin(Date.now() * 0.03) * 0.15;
    } else if (char.state === 'arriving') {
      armSwing = -0.8 + Math.sin(Date.now() * 0.04) * 0.2;
    } else if (char.state === 'staring') {
      armSwing = 0.05 * Math.sin(Date.now() * 0.008);
    }

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tilt + windTilt + leanIn);
    ctx.scale(squash * ZOOM, stretch * ZOOM);

    ctx.fillStyle = '#ffb07c';
    ctx.beginPath();
    ctx.ellipse(-16 + footStride * 0.5, 30 + footY, 10, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(16 - footStride * 0.5, 30 + footY, 10, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffc896';
    ctx.beginPath();
    ctx.arc(0, 0, 34, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffe0b9';
    ctx.beginPath();
    ctx.ellipse(0, 10, 20, 17, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#e8a46e';
    ctx.save();
    ctx.translate(-30, 4);
    ctx.rotate(-armSwing);
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 7, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#ffb07c';
    ctx.beginPath();
    ctx.ellipse(-20, -40, 14, 16, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff9f7c';
    ctx.beginPath();
    ctx.ellipse(-20, -42, 7, 9, -0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffb07c';
    ctx.beginPath();
    ctx.ellipse(20, -40, 14, 16, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff9f7c';
    ctx.beginPath();
    ctx.ellipse(20, -42, 7, 9, 0.2, 0, Math.PI * 2);
    ctx.fill();

    const eyeSpacing = 13;
    const eyeY = -10;
    const eyeOffsetY = Math.sin(char.blink) * 2;

    if (char.state === 'staring') {
      // Wide staring eyes
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-eyeSpacing, eyeY, 7.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(eyeSpacing, eyeY, 7.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#2e1b0e';
      ctx.beginPath();
      ctx.arc(-eyeSpacing + 2, eyeY, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(eyeSpacing + 2, eyeY, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(-eyeSpacing + 3, eyeY - 2, 1.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(eyeSpacing + 3, eyeY - 2, 1.6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#2e1b0e';
      ctx.beginPath();
      ctx.ellipse(-eyeSpacing, eyeY + eyeOffsetY, 5.5, 6.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(eyeSpacing, eyeY + eyeOffsetY, 5.5, 6.5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(-eyeSpacing - 2, eyeY - 3 + eyeOffsetY, 2.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(eyeSpacing - 2, eyeY - 3 + eyeOffsetY, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#ffa5a5b0';
    ctx.beginPath();
    ctx.ellipse(-eyeSpacing - 11, 2, 7, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(eyeSpacing + 11, 2, 7, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#6b3e1c';
    ctx.lineWidth = 2.8;

    if (char.state === 'eating') {
      const chewSize = 5 + Math.sin(char.eatingTimer * 0.4) * 2;
      ctx.fillStyle = '#6b3e1c';
      ctx.beginPath();
      ctx.arc(0, 10, chewSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff8a8a';
      ctx.beginPath();
      ctx.arc(0, 11, chewSize * 0.6, 0, Math.PI * 2);
      ctx.fill();
    } else if (char.state === 'drinking') {
      let burpSize = 0;
      if (sippingDrink && sippingDrink.phase === 'burp') {
        burpSize = 4 + Math.sin(Date.now() * 0.05) * 5;
      }
      const mouthSize = 6 + burpSize * 0.5;
      ctx.fillStyle = '#6b3e1c';
      ctx.beginPath();
      ctx.arc(0, 10, mouthSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff8a8a';
      ctx.beginPath();
      ctx.arc(0, 11, mouthSize * 0.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (char.state === 'sucked') {
      ctx.fillStyle = '#6b3e1c';
      ctx.beginPath();
      ctx.arc(0, 12, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff8a8a';
      ctx.beginPath();
      ctx.arc(0, 13, 5, 0, Math.PI * 2);
      ctx.fill();
    } else if (char.state === 'arriving') {
      ctx.fillStyle = '#6b3e1c';
      ctx.beginPath();
      ctx.arc(0, 12, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff8a8a';
      ctx.beginPath();
      ctx.arc(0, 13, 4, 0, Math.PI * 2);
      ctx.fill();
    } else if (char.state === 'staring') {
      // Small "o" mouth
      ctx.fillStyle = '#6b3e1c';
      ctx.beginPath();
      ctx.arc(0, 11, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff8a8a';
      ctx.beginPath();
      ctx.arc(0, 12, 3, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0, 6, 9, 0.15, Math.PI - 0.15);
      ctx.stroke();
      ctx.fillStyle = '#ff8a8a';
      ctx.beginPath();
      ctx.ellipse(0, 13, 4, 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#ffb07c';
    ctx.save();
    ctx.translate(30, 4);
    ctx.rotate(armSwing);
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 7, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.restore();

    if (char.state === 'eating') {
      const tt = Date.now() * 0.01;
      for (let i = 0; i < 3; i++) {
        const a = tt + i * 2.1;
        const px = cx + Math.cos(a) * (30 * ZOOM + Math.sin(tt * 2) * 10 * ZOOM);
        const py = cy - 20 * ZOOM + Math.sin(a) * 15 * ZOOM;
        ctx.fillStyle = `rgba(255, 220, 120, ${0.6 + Math.sin(tt * 3 + i) * 0.4})`;
        ctx.beginPath();
        ctx.arc(px, py, 3 * ZOOM, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (char.state === 'drinking' && sippingDrink) {
      if (sippingDrink.phase === 'fizz') {
        const tt = Date.now() * 0.015;
        for (let i = 0; i < 6; i++) {
          const a = tt + i * 1.05;
          const px = cx + Math.cos(a) * (25 * ZOOM + Math.sin(tt * 3) * 12 * ZOOM);
          const py = cy - 15 * ZOOM + Math.sin(a * 1.7) * 18 * ZOOM;
          const alpha = 0.5 + Math.sin(tt * 4 + i * 1.2) * 0.4;
          ctx.fillStyle = `rgba(180, 230, 255, ${alpha})`;
          ctx.beginPath();
          ctx.arc(px, py, (2.5 + Math.sin(tt * 2 + i) * 1.5) * ZOOM, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (sippingDrink.phase === 'burp' && sippingDrink.burpBubbles) {
        for (const b of sippingDrink.burpBubbles) {
          ctx.fillStyle = `rgba(200, 240, 255, ${b.life * 0.8})`;
          ctx.beginPath();
          ctx.arc(cx + b.x * ZOOM, cy - 10 * ZOOM + b.y * ZOOM, b.r * ZOOM * b.life, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    if (portalSuck) {
      const t = Math.min(1, portalSuck.timer / portalSuck.totalTime);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 5; i++) {
        const back = i * 6;
        const alpha = (1 - t) * (0.4 - i * 0.06);
        if (alpha <= 0) continue;
        ctx.fillStyle = `rgba(255, 240, 160, ${alpha})`;
        ctx.beginPath();
        ctx.arc(cx + back, cy, (14 - i * 2) * ZOOM * (1 - t), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    if (arrival) {
      // Bright trail while falling
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const t = Math.min(1, arrival.timer / arrival.totalTime);
      for (let i = 0; i < 5; i++) {
        const up = i * 8;
        const alpha = (1 - t) * (0.5 - i * 0.08);
        if (alpha <= 0) continue;
        ctx.fillStyle = `rgba(255, 245, 190, ${alpha})`;
        ctx.beginPath();
        ctx.arc(cx, cy - up, (14 - i * 2) * ZOOM * (1 - t * 0.5), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawFoodAt(x, y, radius, scale, rotation, img) {
    if (!img || !img.complete || img.naturalWidth === 0) return;

    ctx.save();
    ctx.translate(x, y);
    if (rotation) ctx.rotate(rotation);
    ctx.scale(scale, scale);

    const size = radius * 2.2;
    try {
      ctx.drawImage(img, -size/2, -size/2, size, size);
    } catch (e) {}

    ctx.restore();
  }

  function drawRoadsideType(items, imageList) {
    if (imageList.length === 0) return;

    const windSwayAmount =
      (weather.type === 'windy' ? 0.3 + weather.gustStrength * 0.4 : 0) +
      (weather.type === 'stormy' ? 0.5 + weather.gustStrength * 0.5 : 0);
    const swayScale = windSwayAmount * weather.intensity;

    for (const r of items) {
      const sx = r.worldX - worldOffset;
      if (sx < -120 || sx > CANVAS_W + 120) continue;

      const img = imageList[r.imgIndex];
      if (!img || !img.complete || img.naturalWidth === 0) continue;

      const swayX = Math.sin(r.swayPhase) * swayScale * 14 * ZOOM;
      const y = GROUND_Y + r.yOffset;

      try {
        ctx.drawImage(
          img,
          sx + swayX - r.size / 2,
          y - r.size,
          r.size,
          r.size
        );
      } catch (e) {}
    }
  }

  function drawFoods() {
    const now = Date.now();
    for (const f of foods) {
      if (f.eaten) continue;
      const screenX = char.screenX + (f.worldDistance - worldOffset);
      if (screenX < -150 || screenX > CANVAS_W + 150) continue;

      const bob = Math.sin(now * 0.005 + f.bobPhase) * 3 * ZOOM;

      ctx.beginPath();
      ctx.ellipse(screenX, GROUND_Y + 2, f.radius * 0.8, f.radius * 0.3, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#00000022';
      ctx.fill();

      if (sippingDrink && sippingDrink.food === f) {
        if (sippingDrink.phase === 'fizz' || sippingDrink.phase === 'return') continue;
      }

      drawFoodAt(screenX, f.y + bob, f.radius, f.eatSquash, 0, f.image);
    }
  }

  function drawFlyingFood() {
    if (!flyingFood) return;
    const mouth = getMouthPos();
    const t = flyingFood.t;
    const eased = t < 0.5
      ? 2 * t * t
      : 1 - Math.pow(-2 * t + 2, 2) / 2;

    const px = flyingFood.startX + (mouth.x - flyingFood.startX) * eased;
    const baseY = flyingFood.startY + (mouth.y - flyingFood.startY) * eased;
    const arcHeight = 40 * ZOOM;
    const arc = Math.sin(t * Math.PI) * arcHeight;
    const py = baseY - arc;

    const scale = 1 - eased * 0.6;
    flyingFood.rotation += flyingFood.spin;

    if (t < 0.9) {
      for (let s = 0; s < 2; s++) {
        const trailT = Math.max(0, t - 0.05 - s * 0.05);
        const trailEased = trailT < 0.5
          ? 2 * trailT * trailT
          : 1 - Math.pow(-2 * trailT + 2, 2) / 2;
        const tx = flyingFood.startX + (mouth.x - flyingFood.startX) * trailEased;
        const baseTY = flyingFood.startY + (mouth.y - flyingFood.startY) * trailEased;
        const arcT = Math.sin(trailT * Math.PI) * arcHeight;
        const ty = baseTY - arcT;
        ctx.fillStyle = `rgba(255, 240, 180, ${(1 - t) * 0.6})`;
        ctx.beginPath();
        ctx.arc(tx, ty, 3 * (1 - trailT * 0.5), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    drawFoodAt(px, py, flyingFood.radius, scale, flyingFood.rotation, flyingFood.image);
  }

  function drawSippingDrink() {
    if (!sippingDrink) return;
    const originalScreenX = char.screenX + (sippingDrink.worldDistance - worldOffset);
    const mouth = getMouthPos();
    const drink = sippingDrink.food;

    let px, py, scale;

    if (sippingDrink.phase === 'fizz') {
      const hoverProgress = Math.min(1, sippingDrink.timer / 30);
      const hoverEased = hoverProgress * hoverProgress * (3 - 2 * hoverProgress);
      px = originalScreenX + (mouth.x - originalScreenX) * hoverEased;
      py = drink.y + (mouth.y - drink.y) * hoverEased;
      scale = 1 - hoverEased * 0.3;

      const hoverBob = Math.sin(Date.now() * 0.02) * 2 * ZOOM;
      py += hoverBob * hoverEased;

      if (hoverEased > 0.1 && hoverEased < 0.95) {
        for (let s = 0; s < 2; s++) {
          const trailAmt = Math.max(0, hoverEased - 0.15 - s * 0.1);
          const tx = originalScreenX + (mouth.x - originalScreenX) * trailAmt;
          const ty = drink.y + (mouth.y - drink.y) * trailAmt;
          ctx.fillStyle = `rgba(180, 220, 255, ${(1 - hoverEased) * 0.5})`;
          ctx.beginPath();
          ctx.arc(tx, ty, 3 * (1 - trailAmt * 0.5), 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } else if (sippingDrink.phase === 'return') {
      const returnProgress = Math.min(1, sippingDrink.timer / char.DRINK_RETURN_DURATION);
      const returnEased = returnProgress * returnProgress * (3 - 2 * returnProgress);
      px = mouth.x + (originalScreenX - mouth.x) * returnEased;
      py = mouth.y + (drink.y - mouth.y) * returnEased;
      scale = 0.7 + returnEased * 0.3;

      if (returnEased > 0.1 && returnEased < 0.9) {
        ctx.fillStyle = `rgba(180, 220, 255, ${(1 - returnEased) * 0.4})`;
        ctx.beginPath();
        ctx.arc(px, py, 4 * ZOOM * (1 - returnEased * 0.5), 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      px = mouth.x;
      py = mouth.y;
      scale = 1;
    }

    if (sippingDrink.phase === 'fizz' || sippingDrink.phase === 'return') {
      drawFoodAt(px, py, drink.radius, scale, 0, sippingDrink.image);
    }

    if (sippingDrink.phase === 'fizz') {
      const tt = Date.now() * 0.02;
      for (let k = 0; k < 8; k++) {
        const angle = tt * 0.8 + k * 0.785;
        const radius = (18 + Math.sin(tt * 2 + k) * 8) * ZOOM;
        const bx = px + Math.cos(angle) * radius;
        const by = py + Math.sin(angle) * radius - 10 * ZOOM;
        const alpha = 0.4 + Math.sin(tt * 3 + k) * 0.3;
        ctx.fillStyle = `rgba(200, 240, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(bx, by, (2 + Math.sin(tt + k) * 1.5) * ZOOM, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function draw() {
    const i = weather.intensity;
    const type = weather.type;
    const sky = getSkyColors();

    const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    skyGrad.addColorStop(0, sky.top);
    skyGrad.addColorStop(0.7, sky.mid);
    skyGrad.addColorStop(1, sky.bot);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, CANVAS_W, GROUND_Y + 10);

    let sunAlpha = 1;
    if (type === 'cloudy') sunAlpha = 0.7 - i * 0.4;
    else if (type === 'rainy') sunAlpha = 0.35 - i * 0.3;
    else if (type === 'stormy') sunAlpha = 0.1 - i * 0.1;
    else if (type === 'foggy') sunAlpha = 0.4 - i * 0.3;
    else if (type === 'snowy') sunAlpha = 0.5 - i * 0.3;
    sunAlpha = Math.max(0, sunAlpha);

    if (sunAlpha > 0.02) {
      const sunX = CANVAS_W * 0.85;
      const sunY = CANVAS_H * 0.13 + SKY_SHIFT;
      const sunR = Math.min(CANVAS_W, CANVAS_H) * 0.09;
      ctx.globalAlpha = sunAlpha;
      ctx.fillStyle = '#fff7b0';
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunR * 1.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffe570';
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffe57080';
      ctx.lineWidth = 4;
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2 + Date.now() * 0.0003;
        ctx.beginPath();
        ctx.moveTo(sunX + Math.cos(a) * sunR * 1.5, sunY + Math.sin(a) * sunR * 1.5);
        ctx.lineTo(sunX + Math.cos(a) * sunR * 2.0, sunY + Math.sin(a) * sunR * 2.0);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    let cloudColor = '#ffffffd0';
    let cloudAlpha = 1;
    if (type === 'cloudy') { cloudColor = '#e0e4e8'; cloudAlpha = 0.8 + i * 0.2; }
    else if (type === 'rainy') { cloudColor = '#9aa8b2'; cloudAlpha = 0.85; }
    else if (type === 'stormy') { cloudColor = '#4a545e'; cloudAlpha = 0.9; }
    else if (type === 'snowy') { cloudColor = '#f0f5fa'; cloudAlpha = 0.9; }
    else if (type === 'foggy') { cloudColor = '#d8dde2'; cloudAlpha = 0.7; }

    ctx.fillStyle = cloudColor;
    ctx.globalAlpha = cloudAlpha;
    for (const c of clouds) {
      drawCloud(c.worldX, c.y, c.scale * ZOOM);
    }
    ctx.globalAlpha = 1;

    let hillColor = '#a8d88c';
    if (type === 'rainy' || type === 'stormy') hillColor = '#6a8a5e';
    else if (type === 'snowy') hillColor = '#dfe8f0';
    else if (type === 'foggy') hillColor = '#a8bca0';
    else if (type === 'cloudy') hillColor = '#98c880';
    ctx.fillStyle = hillColor;
    for (const h of hills) {
      ctx.beginPath();
      ctx.ellipse(h.worldX + h.width / 2, GROUND_Y + 10, h.width / 2, h.height, 0, Math.PI, 0);
      ctx.fill();
    }

    if (customGrassImages.length === 0) {
      let grassColor = '#7ec850';
      if (type === 'rainy' || type === 'stormy') grassColor = '#4a8a3a';
      else if (type === 'snowy') grassColor = '#e0e8f0';
      else if (type === 'foggy') grassColor = '#88b078';
      ctx.fillStyle = grassColor;
      ctx.fillRect(0, GROUND_Y - 6, CANVAS_W, 12);
    }

    let roadTop = '#9b8a78', roadBot = '#7a6a58';
    if (type === 'rainy') { roadTop = '#6a5a4a'; roadBot = '#4a3a2a'; }
    else if (type === 'stormy') { roadTop = '#4a4a4a'; roadBot = '#2a2a2a'; }
    else if (type === 'snowy') { roadTop = '#d0d8e0'; roadBot = '#a8b0b8'; }

    const roadTopY = GROUND_Y + 6;
    const roadBotY = CANVAS_H;
    const roadMiddleY = (roadTopY + roadBotY) / 2;

    const roadGrad = ctx.createLinearGradient(0, GROUND_Y, 0, CANVAS_H);
    roadGrad.addColorStop(0, roadTop);
    roadGrad.addColorStop(1, roadBot);
    ctx.fillStyle = roadGrad;
    ctx.fillRect(0, roadTopY, CANVAS_W, CANVAS_H - GROUND_Y);

    ctx.strokeStyle = type === 'snowy' ? '#ffffff' : '#f5e6a3';
    ctx.lineWidth = 6 * ZOOM;
    ctx.setLineDash([40 * ZOOM, 35 * ZOOM]);
    ctx.lineDashOffset = worldOffset * 1.5;
    ctx.beginPath();
    ctx.moveTo(0, roadMiddleY);
    ctx.lineTo(CANVAS_W, roadMiddleY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;

    ctx.strokeStyle = '#ffffff60';
    ctx.lineWidth = 3 * ZOOM;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y + 14);
    ctx.lineTo(CANVAS_W, GROUND_Y + 14);
    ctx.stroke();

    drawRoadsideType(grassItems, customGrassImages);
    drawRoadsideType(rockItems, customRockImages);
    drawRoadsideType(flowerItems, customFlowerImages);

    // Arrival portal (above the scene, drawn before character)
    drawArrivalPortal();

    // Regular portal
    drawPortal();

    drawCharacter();
    drawFoods();
    drawFlyingFood();
    drawSippingDrink();

    drawPortalFlares();

    if (portalFlash > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255, 250, 220, ${portalFlash * 0.85})`;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.restore();
    }

    if (type === 'rainy' || type === 'stormy') {
      const dropCount = Math.floor(rainDrops.length * (0.3 + i * 0.7));
      ctx.strokeStyle = type === 'stormy' ? '#b8c8d8' : '#a8c0d8';
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.5 + i * 0.4;
      for (let k = 0; k < dropCount; k++) {
        const d = rainDrops[k];
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x + 1.5, d.y + d.len);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    if (type === 'snowy') {
      const flakeCount = Math.floor(snowFlakes.length * (0.3 + i * 0.7));
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.7 + i * 0.3;
      for (let k = 0; k < flakeCount; k++) {
        const s = snowFlakes[k];
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    if (type === 'windy' || type === 'stormy') {
      const streakCount = Math.floor(windStreaks.length * (0.4 + i * 0.6));
      const gustMult = 1 + weather.gustStrength * 0.8;

      for (let k = 0; k < streakCount; k++) {
        const w = windStreaks[k];
        const alpha = w.opacity * (0.5 + i * 0.6) * gustMult;
        const grad = ctx.createLinearGradient(w.x, w.y, w.x + w.len, w.y);
        grad.addColorStop(0, `rgba(255,255,255,0)`);
        grad.addColorStop(0.3, `rgba(255,255,255,${alpha})`);
        grad.addColorStop(1, `rgba(255,255,255,0)`);

        ctx.strokeStyle = grad;
        ctx.lineWidth = w.thickness * (0.8 + weather.gustStrength * 0.4);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(w.x, w.y);
        ctx.lineTo(w.x + w.len, w.y);
        ctx.stroke();
      }

      const leafCount = Math.floor(windLeaves.length * (0.5 + i * 0.5));
      for (let k = 0; k < leafCount; k++) {
        const leaf = windLeaves[k];
        ctx.save();
        ctx.translate(leaf.x, leaf.y);
        ctx.rotate(leaf.rotation);
        ctx.fillStyle = leaf.color;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.ellipse(0, 0, leaf.size, leaf.size * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-leaf.size, 0);
        ctx.lineTo(leaf.size, 0);
        ctx.stroke();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    if (type === 'foggy') {
      const bankCount = fogBanks.length;
      const baseOpacity = 0.4 + i * 0.4;

      for (let k = 0; k < bankCount; k++) {
        const p = fogBanks[k];
        const wobble = Math.sin(p.wobblePhase) * 8;

        const grad = ctx.createRadialGradient(
          p.x + wobble, p.y, 0,
          p.x + wobble, p.y, Math.max(p.w, p.h) * 0.6
        );
        const op = p.opacity * baseOpacity;
        grad.addColorStop(0, `rgba(235, 240, 245, ${op})`);
        grad.addColorStop(0.6, `rgba(235, 240, 245, ${op * 0.7})`);
        grad.addColorStop(1, `rgba(235, 240, 245, 0)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(p.x + wobble, p.y, p.w * 0.6, p.h * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      const hazeGrad = ctx.createLinearGradient(0, GROUND_Y * 0.5, 0, GROUND_Y);
      hazeGrad.addColorStop(0, `rgba(230, 235, 240, 0)`);
      hazeGrad.addColorStop(1, `rgba(230, 235, 240, ${0.1 + i * 0.15})`);
      ctx.fillStyle = hazeGrad;
      ctx.fillRect(0, GROUND_Y * 0.5, CANVAS_W, GROUND_Y * 0.5);
    }

    if (type === 'stormy' && lightningFlashes.length > 0) {
      for (const flash of lightningFlashes) {
        const alpha = (flash.life / flash.maxLife) * flash.strength * (0.5 + i * 0.7);
        ctx.fillStyle = `rgba(255, 255, 220, ${alpha})`;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      }
    }

    if (type === 'stormy') {
      ctx.fillStyle = `rgba(20, 25, 35, ${0.1 + i * 0.3})`;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    } else if (type === 'rainy') {
      ctx.fillStyle = `rgba(30, 50, 70, ${0.05 + i * 0.12})`;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    } else if (type === 'cloudy') {
      ctx.fillStyle = `rgba(180, 190, 200, ${i * 0.1})`;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }

    if (gameState === 'idle') {
      const pulse = 0.7 + Math.sin(Date.now() * 0.004) * 0.3;
      ctx.fillStyle = `rgba(0,0,0,${0.35 * pulse})`;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.font = `bold ${Math.max(28, Math.min(CANVAS_W, CANVAS_H) * 0.06)}px "Segoe UI", sans-serif`;
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 20;

      let msg = '▶️  Press Start to Play';
      if (customFoodImages.length === 0 && customDrinkImages.length === 0) {
        msg = '🍎  Upload a Food Photo to Begin';
      }
      ctx.fillText(msg, CANVAS_W / 2, CANVAS_H / 2);
      ctx.shadowBlur = 0;
      ctx.textBaseline = 'alphabetic';
    }

    if (gameState === 'running' && isDragging) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, CANVAS_H - 40, CANVAS_W, 40);
      ctx.font = `bold 15px "Segoe UI", sans-serif`;
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText('✋ Dragging the road…', CANVAS_W / 2, CANVAS_H - 16);
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  function getPointerX(e) {
    if (e.touches && e.touches.length > 0) return e.touches[0].clientX;
    if (e.changedTouches && e.changedTouches.length > 0) return e.changedTouches[0].clientX;
    return e.clientX;
  }

  function onPointerDown(e) {
    if (e.target !== canvas) return;
    isDragging = true;
    dragMoved = false;
    dragStartX = getPointerX(e);
    dragStartWorldOffset = worldOffset;
    canvas.classList.add('dragging');
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!isDragging) return;
    const x = getPointerX(e);
    const dx = x - dragStartX;
    if (Math.abs(dx) > 3) dragMoved = true;
    worldOffset = dragStartWorldOffset - dx;
    if (worldOffset < 0) worldOffset = 0;
    e.preventDefault();
  }

  function onPointerUp(e) {
    if (!isDragging) return;
    isDragging = false;
    canvas.classList.remove('dragging');
    e.preventDefault();
  }

  canvas.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);

  canvas.addEventListener('touchstart', onPointerDown, { passive: false });
  window.addEventListener('touchmove', onPointerMove, { passive: false });
  window.addEventListener('touchend', onPointerUp, { passive: false });
  window.addEventListener('touchcancel', onPointerUp, { passive: false });

  weatherToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    weatherToggle.classList.toggle('open');
    weatherMenu.classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    if (!weatherMenu.contains(e.target) && !weatherToggle.contains(e.target)) {
      weatherToggle.classList.remove('open');
      weatherMenu.classList.remove('open');
    }
  });

  weatherMenu.addEventListener('click', (e) => {
    const btn = e.target.closest('.weather-btn');
    if (!btn) return;
    document.querySelectorAll('.weather-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    weather.type = btn.dataset.weather;
    weatherToggleLabel.textContent = weatherLabels[weather.type];
    weatherToggle.classList.remove('open');
    weatherMenu.classList.remove('open');
  });

  intensitySlider.addEventListener('input', (e) => {
    const v = parseInt(e.target.value, 10);
    weather.intensity = v / 100;
    intensityValue.textContent = v + '%';
  });

  pauseBtn.addEventListener('click', () => {
    if (showFinishReset) return;
    if (gameState === 'idle') {
      if (customFoodImages.length === 0 && customDrinkImages.length === 0) return;
      gameState = 'running';
      pauseBtn.classList.remove('paused');
      pauseBtn.textContent = '⏸️ Pause';
      beginPlay();
    } else if (gameState === 'running') {
      gameState = 'paused';
      pauseBtn.classList.add('paused');
      pauseBtn.textContent = '▶️ Resume';
    } else if (gameState === 'paused') {
      gameState = 'running';
      pauseBtn.classList.remove('paused');
      pauseBtn.textContent = '⏸️ Pause';
    }
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    resetGame();
    gameState = 'running';
    pauseBtn.classList.remove('paused');
    pauseBtn.textContent = '⏸️ Pause';
    beginPlay();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') {
      resetGame();
      gameState = 'running';
      pauseBtn.classList.remove('paused');
      pauseBtn.textContent = '⏸️ Pause';
      beginPlay();
    }
    if (e.key === ' ') {
      e.preventDefault();
      pauseBtn.click();
    }
  });

  resizeCanvas();
  resetGame();
  gameLoop();
})();
</script>
</body>
</html>
